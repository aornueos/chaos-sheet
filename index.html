/* ============================================================
   CAOS EMINENTE — FICHA / DOSSIÊ
   Datilografado: Courier Prime, tinta cor de papel velho sobre
   preto puro. Sem matiz além do papel; alerta por trama, não cor.
   ============================================================ */

:root{
  /* Preto puro + cinzas + papel envelhecido. A hierarquia é feita
     por valor e trama, nunca por cor. */
  --ink:#000000;
  --ink-2:#070707;
  --panel:#0b0b0b;
  --panel-2:#131313;
  --line:#3a3a3a;
  --line-soft:#242424;
  --bone:#e9dab6;
  --dust:#ada38c;
  --dust-dim:#847c6d;
  --brass:#e9dab6;       /* acento = papel velho */
  --brass-lo:#8a8272;    /* acento recuado = cinza quente */
  --blood:#8a8272;       /* alerta = cinza + trama */
  --blood-hi:#e9dab6;    /* alerta forte = papel */
  --spec:#e9dab6;

  /* a cor que fica LEGÍVEL em cima de um preenchimento de --bone.
     Cada Afiliação tem o seu, porque o breu de cada uma é diferente. */
  --on-bone:#000;
  --focus-bg:#111;       /* campo em foco */
  --line-hi:#4a4a4a;     /* borda acordada pelo ponteiro */

  /* tramas: como o preto e branco diz "pior" sem usar cor */
  --hatch:repeating-linear-gradient(45deg,#e9dab6 0 3px,#000 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#e9dab6 0 2px,#000 2px 4px);

  --corr:0;              /* 0..1 — dirige a degradação da ficha */
  --grain:.055;

  --fs-xs:11px;
  --fs-sm:12px;
  --fs-base:14px;
  --fs-lg:16px;
  --fs-xl:22px;
  --fs-2xl:34px;

  --mono:"Courier Prime","Courier New",Courier,"Lucida Sans Typewriter",monospace;

  /* Só a Courier Prime viaja embutida no arquivo. As famílias que os temas
     pedem são as que já existem na máquina de quem abre — por isso cada
     pilha termina numa genérica, e o tema degrada para algo próximo em vez
     de para o nada. */
  --fonte-titulo:var(--mono);
  --titulo-caixa:uppercase;
  --titulo-espaco:.15em;
  --titulo-peso:700;
  --titulo-italico:normal;
  --nome-caixa:uppercase;   /* o nome do Ascendido no cabeçalho */
}

*{box-sizing:border-box}
::selection{background:var(--bone);color:var(--on-bone);text-shadow:none}

body{
  margin:0;
  background:var(--ink);
  color:var(--bone);
  font-family:var(--mono);
  font-size:var(--fs-base);
  line-height:1.5;
  /* sem antialiasing forcado: em texto claro sobre preto ele afina o traco.
     a sombra minima devolve a sangria de tinta da fita. */
  text-shadow:0 0 .5px currentColor;
}

/* ---------- textura: grão + vinheta + sangramento de corrupção ---------- */
.tex{position:fixed;inset:0;pointer-events:none;z-index:9999}
/* grão vivo: salta entre posições em passos, como projeção de filme.
   Passos em vez de deslizar contínuo — é mais barato e mais autêntico. */
@keyframes granulado{
  0%{transform:translate(0,0)}
  20%{transform:translate(-1.5%,1%)}
  40%{transform:translate(1%,-1.5%)}
  60%{transform:translate(-1%,-1%)}
  80%{transform:translate(1.5%,1.5%)}
  100%{transform:translate(0,0)}
}
.tex::before{
  content:"";position:absolute;inset:-4%;
  animation:granulado .7s steps(1,end) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='1'/></svg>");
  opacity:calc(var(--grain) + var(--corr) * .06);
  /* o grão é a luz que sobra na emulsão, por isso "screen" e não "multiply" */
  mix-blend-mode:screen;
}
.tex::after{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(0,0,0,.4) 100%),
    radial-gradient(100% 100% at 50% 100%,transparent 52%,rgba(233,218,182,calc(var(--corr)*.14)) 100%);
}

/* ---------- layout raiz ---------- */
.wrap{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}

/* ================= GAVETA / LISTA DE FICHAS ================= */
.drawer{
  background:var(--ink-2);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.drawer-head{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand{
  font-size:var(--fs-sm);letter-spacing:.08em;text-transform:uppercase;
  color:var(--bone);margin:0 0 4px;font-weight:700;
}
.brand-sub{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--dust-dim);margin:0}

.drawer-list{flex:1;overflow-y:auto;padding:10px 10px 4px}
.drawer-label{
  font-size:var(--fs-xs);letter-spacing:.11em;text-transform:uppercase;
  color:var(--dust-dim);padding:6px 6px 8px;display:flex;justify-content:space-between;
}
.file{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--line);
  color:var(--dust);padding:9px 10px;margin-bottom:6px;
  font-family:var(--mono);font-size:var(--fs-sm);line-height:1.3;
  transition:border-color .12s,color .12s,background .12s;
}
.file:hover{border-left-color:var(--brass-lo);color:var(--bone)}
.file.is-active{border-left-color:var(--brass);background:var(--panel-2);color:var(--bone)}
.file b{display:block;font-size:var(--fs-base);font-weight:700;letter-spacing:.04em}
.file span{display:block;font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--dust-dim);margin-top:3px}
.file.is-active span{color:var(--dust)}

.drawer-foot{padding:10px;border-top:1px solid var(--line);display:grid;gap:6px}
.drawer-toggle{display:none}
.save-state{
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dust-dim);text-align:center;padding:3px 0 5px;
}
.save-state[data-state="erro"]{background:var(--bone);color:var(--on-bone);font-weight:700}

/* ---------- aviso persistente ---------- */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10000;
  max-width:min(680px,92vw);display:flex;align-items:center;gap:12px;
  background:var(--bone);color:var(--on-bone);border:2px solid var(--on-bone);
  padding:12px 14px;font-size:var(--fs-sm);line-height:1.45;text-shadow:none;
  box-shadow:0 0 0 1px var(--bone),0 10px 30px rgba(0,0,0,.6);
}
.toast[hidden]{display:none}
.toast span{flex:1}
.toast .btn{border-color:var(--on-bone);color:var(--on-bone);flex:none}
.toast .btn:hover{background:rgba(0,0,0,.12);border-color:var(--on-bone);color:var(--on-bone)}
.toast-x{
  background:transparent;border:none;color:var(--on-bone);cursor:pointer;flex:none;
  font-family:var(--mono);font-size:14px;line-height:1;padding:0 2px;
}

/* ================= BOTÕES ================= */
.btn{
  font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.09em;text-transform:uppercase;
  background:transparent;color:var(--dust);border:1px solid var(--line);
  padding:8px 10px;cursor:pointer;transition:border-color .12s,color .12s,background .12s;
}
.btn:hover{border-color:var(--brass-lo);color:var(--bone);background:rgba(233,218,182,.09)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn-brass{border-color:var(--brass-lo);color:var(--brass)}
.btn-brass:hover{background:rgba(233,218,182,.15);color:var(--bone)}
.btn-danger:hover{border-color:var(--blood);color:var(--blood-hi);background:rgba(233,218,182,.13)}
.btn-xs{padding:3px 7px;font-size:10px;letter-spacing:.07em}

/* ================= FOLHA ================= */
/* clip, não hidden: contém o vazamento lateral das animações sem criar
   um contêiner de rolagem que quebraria posicionamento fixo/sticky */
.sheet{padding:26px 30px 80px;max-width:1500px;overflow-x:clip}

/* --- cabeçalho / masthead --- */
.masthead{
  border:1px solid var(--line);background:var(--panel);
  padding:16px 20px;margin-bottom:14px;position:relative;overflow:hidden;
}
.masthead::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,var(--brass) 0%,var(--brass-lo) 22%,transparent 60%);
}
.mast-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.mast-id{display:flex;gap:16px;align-items:flex-start;min-width:0;flex:1}
.mast-id > div:last-child{min-width:0;flex:1}
.mast-stamps{display:flex;flex-direction:column;gap:14px;align-items:flex-end;flex:none}
.mast-nome{
  font-family:var(--fonte-titulo);font-size:var(--fs-2xl);letter-spacing:.07em;text-transform:var(--nome-caixa);font-weight:var(--titulo-peso);font-style:var(--titulo-italico);
  padding:2px 6px;background:transparent;border:none;border-bottom:1px solid var(--line);
}
.mast-title{margin:0;font-size:var(--fs-2xl);letter-spacing:.07em;text-transform:uppercase;font-weight:700;line-height:1}
.mast-kicker{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--brass);margin:0 0 8px}
.mast-meta{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--dust-dim);margin:8px 0 0}

/* carimbo principal: bloco invertido, como tinta chapada de fotocópia */
.stamp{
  border:2px solid var(--bone);background:var(--bone);color:var(--on-bone);
  font-size:var(--fs-xs);letter-spacing:.11em;text-transform:uppercase;font-weight:700;
  padding:7px 12px;transform:rotate(-4deg);white-space:nowrap;
}
.stamp-brass{background:var(--bone);border-color:var(--bone);color:var(--on-bone);transform:rotate(3deg)}

/* --- grelha de painéis --- */
/* Três colunas, mas não uma grade: numa grade cada pilha é uma coluna fixa,
   e como só a das Cifras e a dos Talentos crescem com o personagem, uma ficha
   de campanha longa terminava com uma coluna de 4500px ao lado de outra de
   900px. Aqui as colunas são de fluxo: o navegador reparte os painéis na
   ordem em que estão e iguala as alturas sozinho, para qualquer ficha. */
.cols{columns:3;column-gap:14px}
.stack{display:contents}
.cols > .stack > .panel{break-inside:avoid;margin-bottom:14px}
.full{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}

.panel{border:1px solid var(--line);background:var(--panel);padding:14px 16px 16px}
.panel-h{
  display:flex;align-items:center;gap:10px;margin:0 0 12px;
  font-family:var(--fonte-titulo);font-size:var(--fs-xs);letter-spacing:var(--titulo-espaco);text-transform:var(--titulo-caixa);color:var(--bone);font-weight:var(--titulo-peso);font-style:var(--titulo-italico);
}
.panel-h::before{content:"";width:7px;height:7px;background:var(--brass);flex:none}
.panel-h::after{content:"";flex:1;height:1px;background:var(--line)}
.panel-h .h-note{
  font-size:10px;letter-spacing:.12em;color:var(--dust-dim);font-weight:400;flex:none;
}

/* --- campos --- */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field > label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust-dim)}
.inp,.sel,.txt{
  font-family:var(--mono);font-size:var(--fs-base);color:var(--bone);
  background:var(--ink-2);border:1px solid var(--line-soft);border-bottom-color:var(--line);
  padding:6px 8px;width:100%;min-width:0;
}
.inp:focus,.sel:focus,.txt:focus{outline:none;border-color:var(--brass-lo);background:var(--focus-bg)}
.txt{resize:vertical;line-height:1.5}
/* Campo que mostra o texto inteiro. Rolar na horizontal para ler o efeito
   de uma Cifra é pedir que o jogador leia por uma fresta: a caixa cresce
   até caber, e quem manda na altura é o conteudo. */
.txt.cresce{resize:none;overflow:hidden;min-height:0}
.sel{appearance:none;cursor:pointer;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--dust) 50%),linear-gradient(135deg,var(--dust) 50%,transparent 50%);
  background-position:calc(100% - 12px) calc(50% + 1px),calc(100% - 7px) calc(50% + 1px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.sel option{background:var(--panel);color:var(--bone)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* rotulos de alturas diferentes desalinhavam os campos: alinha pela base */
.grid-2>.field,.grid-3>.field,.grid-4>.field{justify-content:flex-end}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* --- atributos --- */
.attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.attr{border:1px solid var(--line-soft);background:var(--ink-2);padding:9px 6px;text-align:center}
.attr-n{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dust);margin-bottom:5px}
.attr-v{
  font-family:var(--mono);font-size:26px;font-weight:700;color:var(--bone);
  background:transparent;border:none;width:100%;text-align:center;padding:0;
  -moz-appearance:textfield;
}
.attr-v::-webkit-outer-spin-button,.attr-v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.attr-v:focus{outline:none;color:var(--brass)}
.attr-d{font-size:10px;letter-spacing:.1em;color:var(--dust-dim);margin-top:3px}

/* --- perícias --- */
.sk-group + .sk-group{margin-top:12px}
.sk-head{
  font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass);
  border-bottom:1px solid var(--line-soft);padding-bottom:4px;margin-bottom:6px;
  display:flex;justify-content:space-between;
}
.sk{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:2px 0}
.sk-name{font-size:var(--fs-sm);color:var(--dust);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk.has-grade .sk-name{color:var(--bone)}
.pips{display:flex;gap:3px}
.pip{
  width:12px;height:12px;border:1px solid var(--line);background:transparent;
  cursor:pointer;padding:0;transition:background .1s,border-color .1s;
}
.pip:hover{border-color:var(--brass-lo)}
.pip.on{background:var(--brass);border-color:var(--brass)}
.pip:focus-visible{outline:1px solid var(--brass);outline-offset:1px}
.sk-pool{
  font-size:var(--fs-xs);color:var(--dust-dim);min-width:30px;text-align:right;
  font-variant-numeric:tabular-nums;
}
.sk.has-grade .sk-pool{color:var(--brass)}

/* --- trilhas de estado --- */
.track{margin-bottom:14px}
.track:last-child{margin-bottom:0}
.track-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.track-name{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--bone)}
.track-max{font-size:var(--fs-xs);color:var(--dust-dim);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:6px}
.lvl{
  border:1px solid var(--line);background:var(--ink-2);padding:5px 2px;text-align:center;cursor:pointer;
  font-size:10px;letter-spacing:.06em;color:var(--dust-dim);transition:all .12s;
}
.lvl:hover{border-color:var(--brass-lo)}
/* estados sem cor: sólido = ok · hachurado = penalidade · invertido = crítico */
.lvl.on{background:var(--bone);border-color:var(--bone);color:var(--on-bone);font-weight:700}
.lvl.on.vit{background:var(--bone);border-color:var(--bone)}
.lvl.warn.on{background:var(--hatch);border-color:var(--bone);color:var(--on-bone);text-shadow:0 0 3px var(--bone),0 0 2px var(--bone)}
.lvl.bad.on{background:var(--ink);border-color:var(--bone);border-width:2px;color:var(--bone);text-shadow:none}
.track-state{
  display:flex;justify-content:space-between;gap:10px;
  font-size:var(--fs-xs);letter-spacing:.1em;color:var(--dust);
  border-left:2px solid var(--line);padding-left:8px;
}
.track-state b{color:var(--bone);text-transform:uppercase;letter-spacing:.07em;font-size:10px}
.pool-row{display:flex;align-items:center;gap:8px;margin-top:7px}
.pool-row .inp{text-align:center;font-size:var(--fs-lg);font-weight:700;padding:4px}
.pool-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dust-dim);white-space:nowrap}

/* --- corrupção ---
   A barra tem o tamanho do Limiar, e o Limiar varia de 8 a 12 conforme a
   Linhagem. Por isso flex e não um grid de dez colunas fixas: o número de
   casas muda quando o jogador troca de sangue. */
.corr-bar{display:flex;gap:2px;margin:8px 0 7px}
.corr-c{
  flex:1;min-width:0;height:22px;border:1px solid var(--line);background:var(--ink-2);
  padding:0;cursor:pointer;transition:background .12s,border-color .12s;
}
.corr-c:hover{border-color:var(--brass-lo)}
.corr-c.assentada{background:var(--bone);border-color:var(--bone)}
.corr-c.assentada.mid{background:var(--hatch);border-color:var(--bone)}
.corr-c.assentada.hi{background:var(--hatch-dense);border-color:var(--bone)}
.corr-c.assentada.max{background:var(--ink);border-color:var(--bone);border-width:2px}
/* A Ativada ocupa o Limiar sem ser tinta que assentou: trama na diagonal
   contrária e na cor de acento, para não se confundir com as tramas de
   intensidade da Assentada. */
.corr-c.ativada{
  border-color:var(--brass-lo);
  background:repeating-linear-gradient(-45deg,var(--brass) 0 2px,transparent 2px 5px);
}
.corr-state{font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.corr-state b{color:var(--blood-hi)}

/* --- capacidade ---
   Uma régua só, sem casas: o Peso não é contado em unidades que o jogador
   marque a lápis, é uma soma que a ficha faz. */
.cap-barra{height:8px;border:1px solid var(--line);background:var(--ink-2);margin:2px 0 8px}
.cap-cheio{height:100%;background:var(--bone);transition:width .18s}
.vol.over ~ .cap-barra .cap-cheio{background:var(--hatch-dense)}

/* interruptor de Talento: aceso ocupa Capacidade, dormente não ocupa nada */
.acende{
  flex:none;font:inherit;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 7px;border:1px solid var(--line);background:transparent;color:var(--dust-dim);
  cursor:pointer;transition:color .12s,border-color .12s,background .12s;
}
.acende:hover{border-color:var(--brass-lo);color:var(--dust)}
.acende.on{background:var(--bone);border-color:var(--bone);color:var(--ink)}

/* --- listas dinâmicas --- */
.rows{display:grid;gap:7px}
.row{border:1px solid var(--line-soft);background:var(--ink-2);padding:9px 10px;position:relative}
.row-top{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.row-top .inp{flex:1}
.row-x{
  background:transparent;border:1px solid var(--line);color:var(--dust-dim);
  cursor:pointer;font-family:var(--mono);font-size:12px;line-height:1;padding:4px 7px;flex:none;
}
.row-x:hover{border-color:var(--blood);color:var(--blood-hi)}
.row-meta{display:flex;gap:7px;flex-wrap:wrap}
.row-meta .sel,.row-meta .inp{font-size:var(--fs-sm);padding:4px 6px}
.tag{
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--brass);
  border:1px solid var(--brass-lo);padding:2px 6px;white-space:nowrap;align-self:center;
}
.empty{font-size:var(--fs-xs);color:var(--dust-dim);letter-spacing:.1em;padding:6px 0}
.empty::before{content:"— "}
.add-row{margin-top:8px;width:100%}

/* --- âncoras --- */
.anchor{border:1px solid var(--line-soft);background:var(--ink-2);padding:11px 12px}
.anchor + .anchor{margin-top:9px}
.anchor-n{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.anchor .field + .field{margin-top:7px}

/* --- inventário --- */
.vol{display:flex;justify-content:space-between;font-size:var(--fs-xs);letter-spacing:.07em;text-transform:uppercase;color:var(--dust);margin-bottom:8px;border-bottom:1px solid var(--line-soft);padding-bottom:6px}
.vol b{color:var(--bone);font-variant-numeric:tabular-nums}
.vol.over b{color:var(--bone);text-decoration:underline;text-underline-offset:3px}
.eq{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust-dim);cursor:pointer;white-space:nowrap;align-self:center}
.eq input{accent-color:var(--brass);cursor:pointer;margin:0}

/* --- retrato --- */
.portrait{
  width:104px;height:126px;border:1px solid var(--line);background:var(--ink-2);
  display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;position:relative;
}
.portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.18) brightness(.86)}
.portrait span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dust-dim);text-align:center;padding:0 8px}
.portrait:hover{border-color:var(--brass-lo)}

/* --- utilitários --- */
.hint{font-size:10px;letter-spacing:.1em;color:var(--dust-dim);margin-top:6px;line-height:1.5}
.divider{height:1px;background:var(--line-soft);margin:12px 0}
.print-only{display:none}

/* ---------- habilidades concedidas (derivadas, não editáveis) ---------- */
.conc{border-left:2px solid var(--brass-lo);padding:2px 0 2px 10px;margin-bottom:11px}
.conc:last-child{margin-bottom:0}
.conc-de{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust-dim)}
.conc-nome{font-weight:700;color:var(--bone);letter-spacing:.02em}
.conc-txt{font-size:var(--fs-sm);color:var(--dust);line-height:1.5;margin-top:2px}
.conc-per{display:flex;align-items:center;gap:7px;margin-top:6px;flex-wrap:wrap}
.conc-per .sel{width:auto;flex:1;min-width:120px}
.add-dupla{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}

/* ---------- compêndio ---------- */
.compendio{
  position:fixed;inset:0;z-index:10001;background:rgba(0,0,0,.82);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.compendio[hidden]{display:none}
.comp-caixa{
  background:var(--panel);border:1px solid var(--line);
  width:min(760px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px;padding:16px;
}
.comp-topo{display:flex;align-items:center;gap:12px}
.comp-abas{display:flex;gap:6px;flex-wrap:wrap}
.comp-aba{
  font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line);color:var(--dust);padding:7px 11px;cursor:pointer;
}
.comp-aba:hover{border-color:var(--brass-lo);color:var(--bone)}
.comp-aba.on{background:var(--bone);border-color:var(--bone);color:var(--on-bone);font-weight:700}
.comp-lista{overflow-y:auto;display:grid;gap:7px;padding-right:4px}
.comp-grupo{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);
  border-bottom:1px solid var(--line-soft);padding:9px 0 4px;position:sticky;top:0;background:var(--panel);
}
.comp-item{border:1px solid var(--line-soft);background:var(--ink-2);padding:9px 10px;display:grid;gap:5px}
.comp-cab{display:flex;align-items:center;gap:9px}
.comp-nome{font-weight:700;flex:1;letter-spacing:.02em}
.comp-txt{font-size:var(--fs-sm);color:var(--dust);line-height:1.5}
.comp-vazio{font-size:var(--fs-sm);color:var(--dust-dim);padding:16px 0;text-align:center}
.comp-item.ja .comp-nome{color:var(--dust-dim)}
/* prateleira de outro Arquétipo: legível, para você saber o que existe atrás
   da porta, mas visivelmente fora do seu alcance */
.comp-item.trancado{opacity:.5;border-style:dashed}

@media screen and (max-width:680px){
  .compendio{padding:0}
  .comp-caixa{max-height:100vh;height:100vh;width:100%;border:none}
  .add-dupla{grid-template-columns:1fr}
}

/* ============================================================
   MOVIMENTO
   Três camadas, nenhuma decorativa:
   1. chegada — os documentos são postos sobre a mesa
   2. ambiente — a Corrupção faz a página respirar
   3. resposta — o que você toca reage como tinta
   Só transform/opacity, para não custar repintura.
   ============================================================ */

/* ---- 1. chegada: os documentos são jogados sobre a mesa ---- */
@keyframes assenta{
  from{opacity:0;transform:translateY(9px) rotate(var(--queda,.3deg))}
  to{opacity:1;transform:none}
}
.masthead,.panel{animation:assenta .38s cubic-bezier(.2,.75,.3,1) backwards}
/* alterna o lado da inclinação para não parecer um baralho enfileirado */
.stack .panel:nth-child(even){--queda:-.34deg}
.stack .panel:nth-child(odd){--queda:.28deg}
.masthead{--queda:.12deg}

/* a linha datilografada do cabeçalho é escrita na hora */
@media screen and (min-width:681px){
  .mast-kicker{
    overflow:hidden;white-space:nowrap;width:fit-content;
    animation:datilografa .9s steps(32,end) .15s backwards;
  }
  @keyframes datilografa{from{width:0}to{width:100%}}
}

/* Carimbo: bate no papel, recua e assenta. A escala de entrada é uma
   variável porque em tela estreita o pico de 1.8 deixa o carimbo mais
   largo que o espaço disponível, e o corte do cabeçalho o decepa. */
@keyframes carimba{
  0%{opacity:0;transform:rotate(var(--rot)) scale(var(--esc))}
  55%{opacity:1;transform:rotate(var(--rot)) scale(.92)}
  100%{opacity:1;transform:rotate(var(--rot)) scale(1)}
}
/* Os carimbos ficam encostados na borda direita do cabeçalho, então a
   ampliação precisa crescer para dentro; com origem no centro ela
   transbordava e era recortada pelo overflow do cabeçalho. */
/* Depois de bater, o carimbo nunca assenta de vez: fica oscilando de
   leve, e a amplitude cresce com a Corrupção — quanto mais o Ascendido
   se perde, mais inquieto fica o papel. */
@keyframes balanco{
  0%,100%{transform:rotate(var(--rot)) translate(0,0)}
  25%{transform:rotate(calc(var(--rot) + var(--sway))) translate(2px,-3px)}
  50%{transform:rotate(calc(var(--rot) - var(--sway) * .8)) translate(-3px,2px)}
  75%{transform:rotate(calc(var(--rot) + var(--sway) * .5)) translate(2px,2px)}
}
.stamp{
  --rot:-4deg; --esc:1.8;
  /* amplitude visível: abaixo de ~2° o giro rende menos de um pixel na
     largura do carimbo e o movimento simplesmente não se enxerga */
  --sway:calc(2.2deg + var(--corr) * 1.8deg);
  transform-origin:right center;
  animation:
    carimba .4s cubic-bezier(.3,1.5,.4,1) .18s backwards,
    balanco 4.5s ease-in-out .6s infinite;
}
/* fases e durações diferentes para os dois nunca baterem juntos */
.stamp-brass{
  --rot:3deg;
  animation-duration:.4s, 5.9s;
  animation-delay:.32s, 1.1s;
}

/* lâmpada velha sobre o cabeçalho: pisca raro, nunca ritmado */
@keyframes lampada{
  0%,93%,100%{opacity:1}
  94%{opacity:.25}
  95%{opacity:.85}
  96%{opacity:.4}
  97%{opacity:.95}
}
.masthead::before{animation:lampada 13s steps(1,end) infinite}

/* ---- 2. ambiente: a maré só existe se houver Corrupção ---- */
@keyframes mare{
  0%,100%{opacity:1}
  50%{opacity:calc(1 - var(--corr) * .38)}
}
.tex::after{animation:mare 9s ease-in-out infinite}

/* estado crítico pulsa sem precisar de cor */
@keyframes alerta{0%,100%{opacity:1}50%{opacity:.42}}
.lvl.bad.on,.corr-c.assentada.max{animation:alerta 1.9s ease-in-out infinite}

/* ---- 3. resposta ao toque ---- */
@keyframes tinta{0%{transform:scale(.65)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.pip.on{animation:tinta .2s ease-out}
.pip:active{transform:scale(.8)}

.lvl,.corr-c{transition:transform .1s ease}
.lvl:active,.corr-c:active{transform:scale(.93)}

.panel{transition:border-color .18s ease}
.panel:hover{border-color:var(--line-hi)}

.file{transform-origin:left center}
.file:active{transform:scale(.985)}
/* ============================================================
   PAPEL TIMBRADO — a ficha veste a Afiliação

   Cada Afiliação emite os próprios documentos, e um documento diz de
   onde veio antes de dizer qualquer outra coisa. Mudam a cor, o tipo e
   a textura; a disposição dos painéis é a mesma em todas, porque é a
   mesma ficha sendo preenchida por gente diferente.

   Cada tema tem um bloco de variáveis e, abaixo dele, as regras do seu
   efeito próprio. Todo efeito aqui é CSS, então todos caem sozinhos sob
   o controle de movimento da gaveta, que desliga animação por '*'.

   Só a Courier Prime viaja embutida no arquivo. As famílias que os temas
   pedem são as que já existem na máquina de quem abre, e por isso cada
   pilha termina numa genérica.
   ============================================================ */

/* ---- O Olho · noir de Londres ----
   Escritório de investigação em noite de neblina: fuligem, névoa e o
   âmbar de um lampião de rua. A datilografia continua sendo a voz do
   arquivo, mas o nome da casa é composto em gótica, como nameplate de
   jornal vitoriano. O cabeçalho pisca porque a lâmpada é velha. */
[data-afiliacao="O Olho"]{
  --ink:#000000; --ink-2:#070707; --panel:#0b0b0c; --panel-2:#131315;
  --line:#3a3a3c; --line-soft:#242427; --line-hi:#4d4d52;
  --bone:#e9dab6; --dust:#a8a08c; --dust-dim:#857d6e;
  --brass:#e9dab6; --brass-lo:#8a8272;
  --blood:#8a8272; --blood-hi:#e9dab6; --spec:#e9dab6;
  --on-bone:#000; --focus-bg:#111;
  --hatch:repeating-linear-gradient(45deg,#e9dab6 0 3px,#000 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#e9dab6 0 2px,#000 2px 4px);
  --grain:.055;
  --titulo-espaco:.15em;
}
/* a névoa: uma massa lenta que atravessa a folha e nunca chega */
@keyframes neblina{
  0%,100%{transform:translateX(-12%)}
  50%{transform:translateX(12%)}
}
[data-afiliacao="O Olho"] .tex::after{
  background:
    radial-gradient(120% 90% at 50% 0%,transparent 45%,rgba(0,0,0,.55) 100%),
    radial-gradient(80% 60% at 50% 40%,rgba(233,218,182,.05) 0%,transparent 70%);
  animation:neblina 34s ease-in-out infinite;
}
[data-afiliacao="O Olho"] .brand{
  font-family:"Old London","Old English Text MT","Blackadder ITC",Georgia,serif;
  font-size:var(--fs-lg);letter-spacing:.02em;text-transform:none;
}

/* ---- A Penumbra · o culto ----
   Dark fantasy pesada. Não é organização com escritório, é gente que se
   reúne onde não chega luz. O roxo quase não existe e serve só para o
   preto não virar cinza. Gótica no título, sombra interna nos painéis
   para que pareçam afundados na pedra. */
[data-afiliacao="A Penumbra"]{
  --ink:#020103; --ink-2:#050308; --panel:#08050d; --panel-2:#0e0916;
  --line:#2a1f3a; --line-soft:#170f22; --line-hi:#3f2d59;
  --bone:#c9bcd8; --dust:#9182ab; --dust-dim:#8a7aa4;
  --brass:#9a70cf; --brass-lo:#553877;
  --blood:#553877; --blood-hi:#c6a2ff; --spec:#9a70cf;
  --on-bone:#08050d; --focus-bg:#0c0714;
  --hatch:repeating-linear-gradient(45deg,#9a70cf 0 3px,#020103 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#9a70cf 0 2px,#020103 2px 4px);
  --grain:.11;
  --fonte-titulo:"Old English Text MT","Old London",Garamond,Georgia,serif;
  --titulo-caixa:none;
  --titulo-espaco:.06em;
  --titulo-peso:400;
  --nome-caixa:none;
}
/* a sombra respira: o que cerca a folha se aproxima e recua */
@keyframes mare-de-sombra{
  0%,100%{opacity:.85}
  50%{opacity:1}
}
[data-afiliacao="A Penumbra"] .tex::after{
  background:radial-gradient(105% 80% at 50% 30%,transparent 30%,rgba(0,0,0,.88) 100%);
  animation:mare-de-sombra 11s ease-in-out infinite;
}
[data-afiliacao="A Penumbra"] .panel,
[data-afiliacao="A Penumbra"] .masthead{
  box-shadow:inset 0 0 34px rgba(0,0,0,.9);
  border-color:var(--line-soft);
}
[data-afiliacao="A Penumbra"] .panel-h{text-shadow:0 0 10px rgba(154,112,207,.5)}
[data-afiliacao="A Penumbra"] .panel-h::before{transform:rotate(45deg)}

/* ---- Os Acorrentados · a chama vermelha ----
   Fanáticos. Vermelho de brasa sobre carvão, moldura dupla de relicário
   e versaletes de inscrição. O quadrado do título arde: é a chama que a
   ordem segue, e ela não fica parada. */
[data-afiliacao="Os Acorrentados"]{
  --ink:#0b0202; --ink-2:#100404; --panel:#160606; --panel-2:#1f0a08;
  --line:#5a1c16; --line-soft:#32100d; --line-hi:#82291f;
  --bone:#f4d9cc; --dust:#c08d7e; --dust-dim:#ad7568;
  --brass:#e2422a; --brass-lo:#93251a;
  --blood:#93251a; --blood-hi:#ff6a4a; --spec:#e2422a;
  --on-bone:#160606; --focus-bg:#1b0807;
  --hatch:repeating-linear-gradient(45deg,#e2422a 0 3px,#0b0202 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#e2422a 0 2px,#0b0202 2px 4px);
  --grain:.06;
  --fonte-titulo:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --titulo-caixa:none;
  --titulo-espaco:.1em;
  --nome-caixa:none;
}
@keyframes brasa{
  0%,100%{box-shadow:0 0 5px rgba(226,66,42,.55);opacity:1}
  50%{box-shadow:0 0 12px rgba(226,66,42,.95);opacity:.8}
}
[data-afiliacao="Os Acorrentados"] .panel-h,
[data-afiliacao="Os Acorrentados"] .mast-nome{font-variant:small-caps}
[data-afiliacao="Os Acorrentados"] .panel{border-style:double;border-width:3px}
[data-afiliacao="Os Acorrentados"] .panel-h::before{
  transform:rotate(45deg);animation:brasa 3.4s ease-in-out infinite;
}
[data-afiliacao="Os Acorrentados"] .tex::after{
  background:
    radial-gradient(120% 90% at 50% 0%,transparent 50%,rgba(0,0,0,.6) 100%),
    radial-gradient(90% 70% at 50% 100%,rgba(226,66,42,.15) 0%,transparent 65%);
}
[data-afiliacao="Os Acorrentados"] .masthead::before{
  background:linear-gradient(90deg,var(--brass) 0%,var(--brass-lo) 40%,transparent 75%);
}

/* ---- Mysteria · o deus que ainda não ligaram ----
   Gente convencida de que divindade é questão de arquitetura. Azul de
   madrugada industrial com néon ciano e rosa: a paleta de quem trabalha
   olhando para um monitor e chama aquilo de oração. O acento tem brilho
   de tubo de gás, e uma varredura desce pela folha sem parar. */
[data-afiliacao="Mysteria"]{
  --ink:#03060e; --ink-2:#050a15; --panel:#08101f; --panel-2:#0d1a2e;
  --line:#1d3b5c; --line-soft:#122437; --line-hi:#2f5c8a;
  --bone:#cfe6ff; --dust:#8fb0cf; --dust-dim:#7ba0c2;
  --brass:#31d2f2; --brass-lo:#1a6f8c;
  --blood:#1a6f8c; --blood-hi:#ff4fa3; --spec:#31d2f2;
  --on-bone:#03060e; --focus-bg:#071120;
  --hatch:repeating-linear-gradient(45deg,#31d2f2 0 3px,#03060e 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#ff4fa3 0 2px,#03060e 2px 4px);
  --grain:.04;
  --fonte-titulo:"Segoe UI","Trebuchet MS",Tahoma,sans-serif;
  --titulo-espaco:.3em;
}
@keyframes varredura{
  0%{transform:translateY(-100%)}
  100%{transform:translateY(100vh)}
}
[data-afiliacao="Mysteria"] .panel-h{
  color:var(--brass);text-shadow:0 0 7px rgba(49,210,242,.6),0 0 18px rgba(49,210,242,.28);
}
[data-afiliacao="Mysteria"] .panel-h::before{
  background:var(--blood-hi);box-shadow:0 0 8px rgba(255,79,163,.9);
}
[data-afiliacao="Mysteria"] .stamp-brass{box-shadow:0 0 14px rgba(49,210,242,.45)}
/* linhas de varredura paradas, mais o feixe que desce */
[data-afiliacao="Mysteria"] .tex::after{
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
    radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(0,0,0,.5) 100%);
}
[data-afiliacao="Mysteria"] .tex::before{
  animation:granulado .7s steps(1,end) infinite,varredura 7s linear infinite;
}

/* ---- Guardiões da Árvore · os escolhidos ----
   Não é clube de naturalistas: é uma ordem que seleciona. Ouro de folha
   sobre madeira sagrada, serifa de inscrição, a calma de quem foi
   chamado e não se candidatou. O dourado tem lustro, e ele atravessa o
   filete do cabeçalho de tempos em tempos. */
[data-afiliacao="Guardiões da Árvore"]{
  --ink:#070502; --ink-2:#0b0804; --panel:#100c05; --panel-2:#191308;
  --line:#4d3b17; --line-soft:#2c210e; --line-hi:#715723;
  --bone:#f6e6bb; --dust:#c3aa77; --dust-dim:#ab9560;
  --brass:#e8c257; --brass-lo:#9a7a24;
  --blood:#9a7a24; --blood-hi:#ffd970; --spec:#e8c257;
  --on-bone:#100c05; --focus-bg:#151006;
  --hatch:repeating-linear-gradient(45deg,#e8c257 0 3px,#070502 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#e8c257 0 2px,#070502 2px 4px);
  --grain:.045;
  --fonte-titulo:"Palatino Linotype","Book Antiqua",Palatino,Garamond,Georgia,serif;
  --titulo-espaco:.2em;
}
@keyframes lustro{
  0%,88%,100%{background-position:-140% 0}
  94%{background-position:240% 0}
}
[data-afiliacao="Guardiões da Árvore"] .masthead::before{
  height:3px;
  background:linear-gradient(90deg,transparent 0%,var(--brass-lo) 18%,var(--blood-hi) 32%,var(--brass-lo) 46%,transparent 70%);
  background-size:220% 100%;
  animation:lustro 9s ease-in-out infinite;
}
[data-afiliacao="Guardiões da Árvore"] .panel-h{text-shadow:0 0 9px rgba(232,194,87,.28)}
[data-afiliacao="Guardiões da Árvore"] .panel-h::before{border-radius:50% 0 50% 0}
[data-afiliacao="Guardiões da Árvore"] .tex::after{
  background:
    radial-gradient(120% 90% at 50% 0%,transparent 52%,rgba(0,0,0,.58) 100%),
    radial-gradient(70% 50% at 50% 8%,rgba(232,194,87,.09) 0%,transparent 70%);
}

/* ---- Sociedade dos Ceifadores · o terno e a lâmina ----
   Noir como o Olho, mas de sangue azul: quem faz este trabalho o faz de
   terno, e a casa é velha o bastante para ter vitral. Prata fria, azul
   de meia-noite e um filete ornamental por dentro de cada painel. */
[data-afiliacao="Sociedade dos Ceifadores"]{
  --ink:#040509; --ink-2:#07080e; --panel:#0b0d16; --panel-2:#121522;
  --line:#2c3149; --line-soft:#1a1d2c; --line-hi:#454b6b;
  --bone:#dfe3f0; --dust:#9aa1bd; --dust-dim:#8d95b4;
  --brass:#b9c0e0; --brass-lo:#6a7199;
  --blood:#6a7199; --blood-hi:#e8ecff; --spec:#b9c0e0;
  --on-bone:#040509; --focus-bg:#0a0c14;
  --hatch:repeating-linear-gradient(45deg,#b9c0e0 0 3px,#040509 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#b9c0e0 0 2px,#040509 2px 4px);
  --grain:.05;
  --fonte-titulo:"Book Antiqua","Palatino Linotype",Garamond,Georgia,serif;
  --titulo-espaco:.22em;
}
/* filete duplo por dentro da borda, como papel de convite */
[data-afiliacao="Sociedade dos Ceifadores"] .panel{
  box-shadow:inset 0 0 0 1px var(--ink-2),inset 0 0 0 2px var(--line-soft);
}
[data-afiliacao="Sociedade dos Ceifadores"] .panel-h::before{
  transform:rotate(45deg);
  box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--brass-lo);
}
[data-afiliacao="Sociedade dos Ceifadores"] .masthead::before{
  background:linear-gradient(90deg,var(--brass) 0%,var(--brass-lo) 30%,transparent 68%);
}
[data-afiliacao="Sociedade dos Ceifadores"] .tex::after{
  background:
    radial-gradient(120% 90% at 50% 0%,transparent 48%,rgba(0,0,0,.62) 100%),
    radial-gradient(85% 65% at 50% 55%,rgba(185,192,224,.05) 0%,transparent 70%);
}

/* ---- O Coletivo · a edição da madrugada ----
   Jornal visto na sala de impressão e não na banca: chumbo, tinta fresca
   e o papel ainda escuro do rolo. */
[data-afiliacao="O Coletivo"]{
  --ink:#090807; --ink-2:#0d0c0a; --panel:#121110; --panel-2:#1a1714;
  --line:#3f392f; --line-soft:#26221c; --line-hi:#5d5445;
  --bone:#ece5d4; --dust:#a99d87; --dust-dim:#8b8071;
  --brass:#e05a44; --brass-lo:#96301f;
  --blood:#96301f; --blood-hi:#f57a62; --spec:#e05a44;
  --on-bone:#121110; --focus-bg:#171512;
  --hatch:repeating-linear-gradient(45deg,#ece5d4 0 3px,#090807 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#ece5d4 0 2px,#090807 2px 4px);
  --grain:.045;
  --fonte-titulo:"Times New Roman",Times,Georgia,serif;
  --titulo-espaco:.06em;
}
[data-afiliacao="O Coletivo"] .masthead::before{height:4px;background:var(--brass)}
[data-afiliacao="O Coletivo"] .panel-h{border-bottom:2px solid var(--line);padding-bottom:5px}
[data-afiliacao="O Coletivo"] .panel-h::after{display:none}

/* ---- A Frente · o cartaz amarelo ----
   Impresso rápido e colado num muro, para ser lido de longe e por cima
   do ombro de alguém. Amarelo de sinalização sobre breu, Impact
   apertada, nada de elegante. O cabeçalho é faixa de advertência. */
[data-afiliacao="A Frente"]{
  --ink:#0a0903; --ink-2:#0f0d04; --panel:#141105; --panel-2:#1d1808;
  --line:#4f4310; --line-soft:#2c2609; --line-hi:#7a6817;
  --bone:#f7ecc0; --dust:#c3b071; --dust-dim:#ae9a53;
  --brass:#f5c518; --brass-lo:#a08210;
  --blood:#a08210; --blood-hi:#ffdb4d; --spec:#f5c518;
  --on-bone:#141105; --focus-bg:#191504;
  --hatch:repeating-linear-gradient(45deg,#f5c518 0 3px,#0a0903 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#f5c518 0 2px,#0a0903 2px 4px);
  --grain:.1;
  --fonte-titulo:Impact,Haettenschweiler,"Arial Black","Arial Narrow",sans-serif;
  --titulo-espaco:.04em;
  --titulo-peso:400;   /* Impact já vem pesada; negrito a borraria */
}
[data-afiliacao="A Frente"] .panel-h::before{width:12px;height:9px}
[data-afiliacao="A Frente"] .stamp{border-width:3px}
/* faixa de advertência no alto do cabeçalho */
[data-afiliacao="A Frente"] .masthead::before{
  height:6px;
  background:repeating-linear-gradient(135deg,var(--brass) 0 9px,var(--ink) 9px 18px);
}

/* ---- Avulso · sem papel timbrado ----
   Quem não responde a ninguém não recebe formulário de ninguém. Cinza
   de fotocópia, sem acento, sem calor. A ausência é a identidade. */
[data-afiliacao="Avulso"]{
  --ink:#050505; --ink-2:#090909; --panel:#0e0e0e; --panel-2:#151515;
  --line:#333; --line-soft:#202020; --line-hi:#454545;
  --bone:#cfcfcf; --dust:#8f8f8f; --dust-dim:#7d7d7d;
  --brass:#9a9a9a; --brass-lo:#5e5e5e;
  --blood:#5e5e5e; --blood-hi:#cfcfcf; --spec:#9a9a9a;
  --on-bone:#050505; --focus-bg:#101010;
  --hatch:repeating-linear-gradient(45deg,#cfcfcf 0 3px,#050505 3px 5px);
  --hatch-dense:repeating-linear-gradient(45deg,#cfcfcf 0 2px,#050505 2px 4px);
  --grain:.09;
  --titulo-espaco:.1em;
}
[data-afiliacao="Avulso"] .masthead::before{background:var(--line-hi)}
[data-afiliacao="Avulso"] .panel-h::before{background:var(--dust-dim)}

/* A troca não é um corte seco: o papel é substituído, não repintado. */
body,.panel,.masthead,.drawer,.inp,.sel,.txt,.stamp,.btn{
  transition:background-color .45s ease,border-color .45s ease,color .45s ease;
}
@media (prefers-reduced-motion:reduce){
  body,.panel,.masthead,.drawer,.inp,.sel,.txt,.stamp,.btn{transition:none}
}

/* aviso entra deslizando, sem perder a centralização */
@keyframes sobe-aviso{
  from{opacity:0;transform:translate(-50%,16px)}
  to{opacity:1;transform:translate(-50%,0)}
}
.toast{animation:sobe-aviso .24s ease-out}

/* ============================================================
   IMPRESSÃO — preto e branco, A4 paisagem, mesma direção de arte
   ============================================================ */
@media print{
  @page{size:A4 landscape;margin:9mm}

  html,body{background:#fff !important;color:#000 !important}

  /* No papel a ficha volta a ser datilografada, qualquer que seja a
     Afiliação. Só a Courier Prime viaja embutida no arquivo; as famílias
     dos temas dependem da máquina, e um PDF que sai diferente em cada
     computador não serve como documento. A cor do tema já não chega
     aqui — a folha é preta e branca desde sempre. */
  *{font-family:var(--mono) !important}
  .tex,.drawer,.no-print,.toast{display:none !important}
  .print-only{display:block}
  .wrap{display:block}
  .sheet{padding:0;max-width:none}

  *{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
    color:#000 !important;
    box-shadow:none !important;
  }

  .masthead,.panel,.row,.anchor,.attr,.lvl,.portrait{
    background:#fff !important;border:1pt solid #000 !important;
  }
  .masthead::before{background:#000 !important;height:3pt}

  /* Uma ficha de campanha longa tem painéis de várias páginas de altura.
     'break-inside:avoid' num bloco maior que a página não o mantém inteiro:
     faz o navegador cortar o que não coube. Então o painel pode quebrar, e
     o que se protege é a unidade que o leitor lê de uma vez — uma Cifra,
     um Talento, uma Âncora — que nunca deve ficar partida ao meio. */
  .panel{padding:6pt 8pt;break-inside:auto}
  .row,.anchor,.attr,.sk-group,.conc,.track,.field,.comp-item{break-inside:avoid}
  .panel-h{break-after:avoid}
  .panel-h{font-size:8pt;margin-bottom:6pt;color:#000 !important}
  .panel-h::before{background:#000 !important}
  .panel-h::after{background:#000 !important}

  .mast-title{font-size:20pt}
  .mast-kicker{color:#000 !important;font-size:7pt}
  .stamp,.stamp-brass{background:#fff !important;border:1.5pt solid #000 !important;color:#000 !important;opacity:1}
  /* animação com fill 'backwards' congelaria elementos invisíveis no papel */
  *{text-shadow:none !important;animation:none !important}
  .masthead,.panel{opacity:1 !important;transform:none !important}

  .inp,.sel,.txt{
    background:transparent !important;border:none !important;
    border-bottom:.75pt solid #000 !important;padding:1pt 2pt;font-size:9pt;
  }
  .sel{background-image:none !important}
  .txt{border:.75pt solid #000 !important;padding:3pt}

  /* Na tela as colunas são de fluxo e o navegador equilibra as alturas. No
     papel isso não serve: colunas de fluxo se equilibram dentro de UMA
     página e depois transbordam. Aqui volta a ser grade, com cada painel
     como item próprio, preenchendo as páginas na ordem em que aparece. */
  .cols,.full{display:grid;columns:auto;grid-template-columns:1fr 1fr 1fr;gap:7pt;align-items:start}
  .full{margin-top:7pt}
  .stack{display:contents}
  .cols > .stack > .panel{margin-bottom:0}

  /* Painel comprido não cabe numa coluna de um terço sem virar uma tira
     estreita e altíssima: ele toma a largura inteira e quebra na vertical,
     que é como uma lista longa quer ser lida. */
  .panel.largo{grid-column:1/-1}
  .panel.largo .rows{columns:2;column-gap:10pt}
  .panel.largo .rows > *{break-inside:avoid}

  .attr-v{font-size:16pt}
  .attr-n,.attr-d,.field > label{color:#000 !important;font-size:6pt}

  /* pips / células viram caixas de tinta preta */
  .pip{border:.75pt solid #000 !important;width:9pt;height:9pt;background:#fff !important}
  .pip.on{background:#000 !important}
  .sk{padding:0}
  .sk-name{font-size:8pt}
  .sk-pool{font-size:7pt}
  .sk-head{color:#000 !important;border-bottom:.75pt solid #000 !important;font-size:7pt}

  .lvl{font-size:6pt;padding:2pt 0}
  .lvl.on{background:#000 !important;color:#fff !important}
  .lvl.on *{color:#fff !important}

  .corr-c{border:.75pt solid #000 !important;background:#fff !important;height:12pt}
  .corr-c.assentada{background:#000 !important}
  .corr-c.ativada{background:repeating-linear-gradient(-45deg,#000 0 2px,#fff 2px 5px) !important}

  /* Quais Talentos estão acesos é estado da ficha, não controle de tela:
     a folha impressa precisa dizer isso. O botão vira um selo de tinta. */
  .acende{
    display:inline-block !important;border:.75pt solid #000 !important;
    background:#fff !important;color:#000 !important;font-size:6pt;padding:1pt 3pt;
  }
  .acende.on{background:#000 !important;color:#fff !important}
  .cap-barra{border:.75pt solid #000 !important;background:#fff !important;height:6pt}
  .cap-cheio{background:#000 !important}

  .track-name,.track-max,.track-state,.corr-state,.vol,.hint,.tag,.eq{font-size:7pt;color:#000 !important}
  .tag{border:.75pt solid #000 !important}
  .row-x,.add-row,.btn{display:none !important}
  .empty{font-size:7pt}
  .portrait img{filter:grayscale(1) contrast(1.5) brightness(1.05)}
}

/* ============================================================
   RESPONSIVO — só para tela: uma folha A4 paisagem tem ~1055px
   e reativaria estas regras durante a impressão.
   ============================================================ */

/* ---- notebook estreito ----
   São três pilhas. Em duas colunas a terceira desce sozinha para uma
   segunda linha e fica ao lado de meia tela vazia — e como é justamente a
   pilha das Cifras e dos Talentos, é a mais alta das três. Aqui as pilhas
   se dissolvem e cada painel entra na grade por conta própria, preenchendo
   as duas colunas na ordem em que aparece. */
@media screen and (max-width:1180px){
  .cols{columns:2}
}

/* ---- tablet ---- */
@media screen and (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .drawer{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .full{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:20px 18px 60px}

  /* aberta, a gaveta empurrava a ficha para fora da tela (493px antes de
     qualquer conteudo). Recolhida por padrao em tudo que nao e desktop. */
  .drawer-head{padding:12px 14px 10px}
  .drawer-toggle{display:block;width:100%;margin-top:9px}
  .drawer-list,.drawer-foot{display:none}
  .drawer.is-open .drawer-list{display:block}
  .drawer.is-open .drawer-foot{display:grid}
  .drawer-list{padding:8px 14px 0;overflow:visible}
  #fileList{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
  .file{flex:0 0 190px;margin-bottom:0}
  .drawer-foot{grid-template-columns:1fr 1fr;padding:8px 14px 12px}
  .save-state{grid-column:1/-1;padding:0 0 2px}
}

/* ---- celular ---- */
@media screen and (max-width:680px){
  :root{--fs-2xl:22px}

  .sheet{padding:14px 12px 56px}
  .cols{columns:1}
  .cols > .stack > .panel{margin-bottom:12px}
  .full{gap:12px}
  .panel{padding:12px 13px 14px}

  /* a gaveta virava um muro de 500px antes da ficha:
     as fichas passam a rolar na horizontal e as ações ficam em duas colunas */
  /* cabeçalho: o retrato fixo de 104px espremia todo o resto */
  .mast-row{flex-direction:column;gap:14px}
  .mast-id{gap:12px}
  .portrait{width:74px;height:92px}
  /* afiliações de nome longo ("Sociedade dos Ceifadores") somam mais que
     a largura da tela; deixar quebrar é melhor que empurrar para fora */
  .mast-stamps{flex-direction:row;flex-wrap:wrap;align-items:center;align-self:flex-start;gap:10px;max-width:100%}
  .stamp{max-width:100%;transform-origin:left center}   /* aqui eles alinham à esquerda */
  .stamp-brass{white-space:normal}

  /* Em tela estreita o carimbo já ocupa quase toda a largura: qualquer
     escala de entrada o faz transbordar e ser decepado pelo corte do
     cabeçalho. Aqui ele cai de cima, que dá o mesmo peso sem crescer. */
  @keyframes carimba{
    0%{opacity:0;transform:rotate(var(--rot)) translateY(-7px)}
    60%{opacity:1;transform:rotate(var(--rot)) translateY(2px)}
    100%{opacity:1;transform:rotate(var(--rot))}
  }
  .mast-nome{letter-spacing:.04em}
  .mast-kicker{letter-spacing:.05em}
  .mast-meta{letter-spacing:.04em}

  /* grelhas densas não cabem em 375px */
  .grid-4,.grid-3{grid-template-columns:1fr 1fr}
  .attrs{grid-template-columns:1fr 1fr;gap:7px}
  .attr-v{font-size:22px}
}

/* ---- celular estreito ---- */
@media screen and (max-width:430px){
  .grid-3{grid-template-columns:1fr}
  .row-meta{flex-direction:column;align-items:stretch}
  .row-meta .field{width:100% !important}
  .eq{align-self:flex-start}
  .track-state{flex-direction:column;gap:2px}
  .file{flex:0 0 158px}
}

/* ============================================================
   TOQUE — vale por tipo de ponteiro, não por largura, para
   pegar também tablets e telas sensíveis grandes.
   ============================================================ */
@media (pointer:coarse){
  /* abaixo de 16px o iOS dá zoom sozinho ao focar o campo */
  .inp,.sel,.txt{font-size:16px;padding:9px 10px}
  .mast-nome{font-size:var(--fs-2xl)}

  .pip{width:26px;height:26px}
  .pips{gap:5px}
  .lvl{padding:12px 2px;font-size:11px}
  .corr-c{height:34px}
  .btn{padding:11px 12px}
  .row-x{padding:9px 13px;font-size:14px}
  .eq input{width:18px;height:18px}
  .toast-x{padding:6px 8px;font-size:16px}
}

/* ---------- movimento: sistema por padrão, com decisão manual por cima ----------
   O padrão continua obedecendo o "reduzir movimento" do sistema. Quem quer os
   efeitos mesmo assim marca 'on' e passa na frente; quem quer silêncio total
   marca 'off' e desliga até onde o sistema permitiria. */
@media (prefers-reduced-motion:reduce){
  :root:not([data-motion="on"]) *{transition:none !important;animation:none !important}
}
:root[data-motion="off"] *{transition:none !important;animation:none !important}

const DADOS = {"cifras":[{"nome":"Canalização Positiva","selo":"Universal","vinculo":"Baixo","gestos":"Criar + Proclamar","gatilho":"Tato","efeito":"Você canaliza energia positiva em um alvo através do toque, curando 1 Vitalidade."},{"nome":"Canalização Negativa","selo":"Universal","vinculo":"Baixo","gestos":"Invocar + Bloquear","gatilho":"Visão","efeito":"Você canaliza energia negativa em um alvo à distância visual, causando 1 de dano."},{"nome":"Selo Menor","selo":"Universal","vinculo":"Baixo","gestos":"Sentir","gatilho":"Terceiro Olho","efeito":"Você percebe toda fonte de Distorção, Cifra ativa e aberração num raio de 10 metros e identifica o Selo e o Vínculo aproximado de cada uma."},{"nome":"Estancar","selo":"Universal","vinculo":"Baixo","gestos":"Criar + Bloquear","gatilho":"Tato","efeito":"Toque um alvo a 0 Vitalidade: ele estabiliza, para de piorar e não perde nível de Vitalidade por aquele colapso. Não restaura Vitalidade."},{"nome":"Pulso","selo":"Origem","vinculo":"Baixo","gestos":"Sentir","gatilho":"Terceiro Olho","efeito":"Você estende sua percepção e sente a vitalidade de todos os seres vivos a até 5 metros. O Narrador informa o estado geral de cada um, não o número exato de Vitalidade, mas se estão saudáveis, feridos, agonizando."},{"nome":"Florescimento","selo":"Origem","vinculo":"Médio","gestos":"Criar + Proclamar + Criar","gatilho":"Visão","efeito":"Escolha um alvo. Até o fim da cena, toda cura que esse alvo receber tem o valor aumentado em 1."},{"nome":"Amigo Místico","selo":"Origem","vinculo":"Médio","gestos":"Criar + Invocar + Proclamar","gatilho":"Terceiro Olho","efeito":"Você invoca uma criatura de Origem, uma entidade orgânica, instável, que pode ou não seguir suas ordens. A criatura possui Vitalidade iguais à metade dos seus, age no seu turno e causa 1 de dano por ataque. Detalhes sobre progressão da criatura estão no capítulo de talentos."},{"nome":"Renascença","selo":"Origem","vinculo":"Alto","gestos":"Criar + Criar + Proclamar","gatilho":"Tato","efeito":"Você toca um alvo que acabou de cair a 0 Vitalidade, nessa"},{"nome":"Raiz Profunda","selo":"Origem","vinculo":"Baixo","gestos":"Criar + Bloquear","gatilho":"Tato","efeito":"Um alvo que você toca cria raízes etéreas: até o início do seu próximo Foco, recebe Vantagem para resistir a ser movido, agarrado ou derrubado."},{"nome":"Enxame Vital","selo":"Origem","vinculo":"Médio","gestos":"Criar + Invocar","gatilho":"Terceiro Olho","efeito":"Por uma cena, sempre que você restaurar Vitalidade de um aliado, um segundo aliado a até 5 metros recupera metade desse valor, arredondando para cima."},{"nome":"Fio","selo":"Extinção","vinculo":"Baixo","gestos":"Sentir + Proclamar","gatilho":"Visão","efeito":"Você vê o fio que conecta um ser à sua morte. O Narrador informa o estado real de saúde do alvo, nível de Vitalidade, e se ele carrega alguma condição oculta."},{"nome":"Marca da Extinção","selo":"Extinção","vinculo":"Médio","gestos":"Proclamar + Invocar","gatilho":"Visão","efeito":"O alvo recebe a Marca. Por 2 rodadas, ele não pode recuperar Vitalidade por nenhum meio. A Marca é visível para qualquer Ascendido com o terceiro olho ativo."},{"nome":"Ceifa","selo":"Extinção","vinculo":"Médio","gestos":"Invocar + Bloquear + Proclamar","gatilho":"Visão","efeito":"Um ataque de Cifra que causa danos igual à diferença entre os Vitalidade máximos e os Vitalidade atuais do alvo, dividida por 2 (arredonde para baixo). Quanto mais ferido o alvo, mais dano."},{"nome":"Círculo do Fim","selo":"Extinção","vinculo":"Alto","gestos":"Bloquear + Invocar + Bloquear","gatilho":"Terceiro Olho","efeito":"Cria um círculo etéreo ao seu redor com raio de 3 metros. Inimigos dentro do círculo ficam presos, para sair, devem gastar uma Ação Completa e passar em um teste de Resistência ND 3. Enquanto o círculo estiver ativo, você recebe −1 em qualquer dano sofrido e causa +1 em qualquer dano causado. O círculo persiste até o fim da cena ou até você se mover mais de 1 metro."},{"nome":"Sentença","selo":"Extinção","vinculo":"Médio","gestos":"Proclamar + Bloquear","gatilho":"Visão","efeito":"Marque um alvo visível. Na próxima vez que ele sofrer dano até o fim da cena, sofre 1d6 adicional e a marca se apaga."},{"nome":"Último Suspiro","selo":"Extinção","vinculo":"Alto","gestos":"Invocar + Proclamar + Bloquear","gatilho":"Visão","efeito":"Escolha um corpo a 0 Vitalidade ou recém eliminado nesta rodada. A morte dele se expande: todos os inimigos a até 3 metros sofrem 1d8 de dano espiritual."},{"nome":"Sussurro da Sabedoria","selo":"Controle","vinculo":"Baixo","gestos":"Sentir + Proclamar","gatilho":"Audição","efeito":"Uma vez por cena, receba uma dica ou informação do Narrador sobre a situação atual. A informação é sempre verdadeira, mas nem sempre completa."},{"nome":"Tradução","selo":"Controle","vinculo":"Baixo","gestos":"Sentir + Criar","gatilho":"Audição","efeito":"Você compreende e fala qualquer idioma enquanto a Cifra estiver ativa. Dura uma cena."},{"nome":"Quebra de Defesa","selo":"Controle","vinculo":"Médio","gestos":"Transmutar + Bloquear","gatilho":"Visão","efeito":"Todas as reações do alvo sofrem −2 de penalidade até o fim da rodada."},{"nome":"Arquitetura","selo":"Controle","vinculo":"Médio","gestos":"Criar + Transmutar + Proclamar","gatilho":"Visão","efeito":"Você manipula o ambiente físico imediato dentro do campo visual. Pode fechar uma porta sem tocá-la, mover um objeto de até 10kg, criar uma barreira improvisada de materiais presentes no local, ou travar uma saída. Não pode ser usado para atacar diretamente."},{"nome":"Suspensão","selo":"Controle","vinculo":"Alto","gestos":"Bloquear + Transmutar + Bloquear","gatilho":"Terceiro Olho","efeito":"Você anula uma ação que acabou de acontecer nessa rodada, a sua ou a de outro personagem. O agente e o alvo rerrolam todos os dados e mantêm os novos resultados. Não pode suspender a mesma ação duas vezes."},{"nome":"Cárcere Lógico","selo":"Controle","vinculo":"Alto","gestos":"Bloquear + Transmutar + Proclamar","gatilho":"Terceiro Olho","efeito":"Escolha um inimigo visível. Por 2 rodadas, ele só pode realizar uma categoria de ação que você definir na conjuração: apenas mover, apenas atacar ou apenas falar. Qualquer outra coisa não acontece."},{"nome":"Véu","selo":"Pesadelo","vinculo":"Baixo","gestos":"Criar + Transmutar","gatilho":"Visão","efeito":"Você cria uma ilusão que afeta um alvo. A ilusão é real para ele até que ele sofra dano físico ou passe em um teste de Propósito ND 2."},{"nome":"Eco","selo":"Pesadelo","vinculo":"Baixo","gestos":"Proclamar + Transmutar","gatilho":"Audição","efeito":"Quando um alvo falha em qualquer teste como resultado de uma penalidade que você causou, ele sofre −1D adicional no próximo teste que realizar."},{"nome":"Recriação Mental","selo":"Pesadelo","vinculo":"Médio","gestos":"Sentir + Sentir","gatilho":"Tato","efeito":"Tocando uma superfície, objeto ou pessoa, você revive uma cena do passado relacionada a esse ponto de contato. O Narrador descreve os eventos como uma memória, detalhada, mas não necessariamente completa."},{"nome":"Manifestação","selo":"Pesadelo","vinculo":"Médio","gestos":"Invocar + Criar + Proclamar","gatilho":"Terceiro Olho","efeito":"Você pergunta ao Narrador qual é o maior medo de um alvo específico dentro do campo visual. A resposta é obrigatória e honesta. Em seguida, essa coisa aparece, com 4 Vitalidade, causando 2 de dano por rodada a qualquer inimigo que consiga vê-la. Não afeta aliados."},{"nome":"Sussurro Falso","selo":"Pesadelo","vinculo":"Baixo","gestos":"Proclamar + Transmutar","gatilho":"Audição","efeito":"Um alvo ouve com perfeita clareza uma frase curta que você define, como se viesse da fonte em que ele mais confia. Dura um instante, o suficiente para plantar a dúvida."},{"nome":"Terror Profundo","selo":"Pesadelo","vinculo":"Médio","gestos":"Invocar + Sentir + Proclamar","gatilho":"Visão","efeito":"Um alvo encara o próprio medo: deve passar em Propósito ND 2 ou ficar Atordoado por uma rodada."},{"nome":"Abençoar Arma","selo":"Tormento","vinculo":"Baixo","gestos":"Proclamar + Transmutar","gatilho":"Tato","efeito":"Você encanta sua arma através do toque. A arma causa +1 de dano, recebe um efeito adicional definido pelo Narrador conforme o contexto, e você pode usar a perícia Domínio no lugar de Briga ou Pontaria em ataques com ela. Dura uma cena."},{"nome":"Combustão","selo":"Tormento","vinculo":"Baixo","gestos":"Invocar + Proclamar","gatilho":"Visão","efeito":"Causa 2 de dano em todos os alvos inimigos dentro de uma área de 2 metros ao redor de um ponto que você pode ver. O dano é emocional tanto quanto físico, o Narrador pode descrever efeitos visíveis."},{"nome":"Motivação do Combate","selo":"Tormento","vinculo":"Médio","gestos":"Invocar + Proclamar + Criar","gatilho":"Terceiro Olho","efeito":"Até o fim da cena, sempre que você acertar um ataque corpo a corpo, remove 1 de Corrupção Assentada imediatamente."},{"nome":"Círculo de Absorção","selo":"Tormento","vinculo":"Médio","gestos":"Invocar + Sentir + Bloquear","gatilho":"Terceiro Olho","efeito":"Forma um círculo espiritual ao seu redor com raio de 3 metros. No início de cada rodada enquanto o círculo estiver ativo, todos os inimigos dentro sofrem 1 de dano e você cura 1 Vitalidade por inimigo afetado. Dura até o fim da cena."},{"nome":"Impacto Reduzido","selo":"Tormento","vinculo":"Médio","gestos":"Bloquear + Transmutar","gatilho":"Tato","efeito":"Reação. Quando você sofre dano, pode conjurar imediatamente como reação, reduz o dano à metade."},{"nome":"Apoteose","selo":"Tormento","vinculo":"Alto","gestos":"Proclamar + Invocar + Proclamar + Proclamar","gatilho":"Terceiro Olho","efeito":"Por uma rodada, todo dano que você causa é dobrado. Todo dano que você recebe também é dobrado. Você não pode recuar, negociar ou usar Cifras não-ofensivas durante esse estado. Ao fim da rodada, você sofre metade do dano total que causou, arredondado para cima."},{"nome":"Brasa Viva","selo":"Tormento","vinculo":"Baixo","gestos":"Invocar + Transmutar","gatilho":"Tato","efeito":"Sua próxima arma ou golpe nesta cena queima: além do dano normal, o alvo sofre 1d4 por uma rodada adicional."},{"nome":"Catarse Coletiva","selo":"Tormento","vinculo":"Alto","gestos":"Proclamar + Invocar + Criar","gatilho":"Terceiro Olho","efeito":"Toda a dor acumulada explode para fora. Cause a todos os inimigos a até 4 metros um dano igual a 1d6 mais 1d6 para cada nível de Vitalidade que você já perdeu nesta cena."},{"nome":"Interferência","selo":"Causalidade","vinculo":"Baixo","gestos":"Transmutar + Bloquear","gatilho":"Visão","efeito":"Force um inimigo a rolar novamente um teste que acabou de passar nessa rodada. Ele deve ficar com o segundo resultado, seja melhor ou pior."},{"nome":"Cifra Oculta","selo":"Causalidade","vinculo":"Baixo","gestos":"","gatilho":"","efeito":"O gesto e o gatilho não são documentados. O Narrador revela ambos no primeiro momento em que o personagem tenta usar sua Cifra de Causalidade, e o que"},{"nome":"Convergência","selo":"Causalidade","vinculo":"Médio","gestos":"Criar + Invocar + Transmutar","gatilho":"Terceiro Olho","efeito":"Dois eventos que já estão acontecendo na cena colidem de uma forma que beneficia seu grupo. O Narrador s define o que colide e como, mas o resultado deve ser favorável. Você não controla o quê. Apenas o quando."},{"nome":"Improbabilidade","selo":"Causalidade","vinculo":"Médio","gestos":"Proclamar + Criar + Proclamar","gatilho":"Terceiro Olho","efeito":"Você declara uma ação fisicamente improvável, mas não sobrenatural. O Narrador valida se é possível, e se for, ela acontece. Não pode prejudicar aliados diretamente. O Narrador pode adicionar uma complicação como contrapartida."},{"nome":"Dado Final","selo":"Causalidade","vinculo":"Alto","gestos":"Proclamar + Invocar + Criar + Transmutar","gatilho":"Audição","efeito":"Um evento improvável e favorável acontece. O Narrador define o quê, mas deve ser significativo, inesperado, e favorável ao grupo. Não pode matar personagens nem resolver arcos principais automaticamente. O dado cai. O resultado é real."},{"nome":"Empurrão do Acaso","selo":"Causalidade","vinculo":"Baixo","gestos":"Transmutar","gatilho":"Terceiro Olho","efeito":"Depois que um aliado vê o resultado de um teste, ele relança um único dado daquele teste e fica com o novo valor."},{"nome":"Coincidência Fatal","selo":"Causalidade","vinculo":"Médio","gestos":"Criar + Invocar","gatilho":"Audição","efeito":"O ambiente conspira contra um inimigo: o Narrador descreve um acidente plausível que causa 1d8 de dano ou impõe a condição Caído ao alvo, à sua escolha."}],"culturas":[{"nome":"Teala","pericia":"Performance ou Conhecimento","traco":"Herança Filosófica","tracoTexto":"Uma vez por cena, quando realizar um teste de Conhecimento ou Lógica, você pode declarar que está recorrendo a algo que estudou. Se o fizer, adicione +1D ao teste. Se falhar mesmo assim, o Narrador deve oferecer uma pista incompleta, você sabe o suficiente para saber que está errado."},{"nome":"Hon-Ye","pericia":"Resistência ou Briga","traco":"Controle sob Pressão","tracoTexto":"Quando seu personagem estiver no estado Machucado ou Ferido, uma vez por cena você pode ignorar a penalidade de dados em um único teste de ataque ou reação. O corpo de Hon-Ye foi treinado para funcionar quando a mente já desistiu."},{"nome":"Mendro","pericia":"Destreza ou Conhecimento","traco":"Mãos e Mente","tracoTexto":"Você pode realizar testes de Conhecimento para identificar, modificar ou improvisar soluções técnicas mesmo sem equipamento adequado, com penalidade de −1D. Além disso, quando encontrar um equipamento desconhecido ou uma tecnologia não documentada, você pode perguntar ao Narrador uma pergunta sobre como funciona, a resposta deve ser honesta."},{"nome":"Orian","pericia":"Percepção ou Manipulação","traco":"Filho das Sombras","tracoTexto":"Em ambientes urbanos, uma vez por cena você pode tentar se esconder sem cobertura estrutural, bastam sombras, multidões ou ruído visual suficiente. Além disso, você nunca é surpreendido em locais urbanos: mesmo que o Narrador declare que o grupo foi pego desprevenido, você não sofre essa condição."},{"nome":"Calem","pericia":"Lógica ou Conhecimento","traco":"Mente Analítica","tracoTexto":"Quando falhar em um teste de Lógica, uma vez por cena você pode reformular imediatamente: relance todos os dados que não atingiram sucesso. O segundo resultado é definitivo. Além disso, quando analisar um local de alta Distorção, você automaticamente identifica a assinatura do Selo presente sem precisar de um teste."},{"nome":"Louina","pericia":"Intuição ou Consciência","traco":"Eco da Telura","tracoTexto":"Você percebe instintivamente a presença de Distorção elevada, corrupção ou anomalias etéreas num raio de alguns metros, mesmo sem realizar um teste, o Narrador deve te indicar quando algo não está certo. Além disso, quando estiver dentro do Labirinto, você começa com +1D nos testes de Espírito durante os desafios."},{"nome":"Fainn","pericia":"Atletismo ou Conhecimento, Sobrevivência","traco":"Instinto de Fronteira","tracoTexto":"Você pode rastrear qualquer entidade, humana, aberração ou etérea, através de rastros físicos ou de Espírito, sem necessidade de perícia especializada. Testes de rastrei recebem +1D. Além disso, você nunca sofre penalidades de terreno em ambientes naturais ao se movimentar."},{"nome":"Alta Velana","pericia":"Carisma ou Lábia","traco":"Língua de Prata","tracoTexto":"Quando usar Carisma ou Lábia em contextos de negociação, política ou comércio, trate um resultado de Falha como Sucesso Parcial, você não consegue tudo que queria, mas consegue algo. O Narrador define o que."},{"nome":"Kalak","pericia":"Consciência ou Conhecimento, especialidade ligada aos Deuses Primordiais ou às tradições antigas","traco":"Sangue Antigo","tracoTexto":"Você tem acesso intuitivo a conhecimentos sobre os Deuses Primordiais que outros Ascendidos precisam buscar e ativamente. Uma vez por sessão, pode perguntar ao Narrador uma verdade sobre um Deus Primordial, um Selo ou a cosmologia do mundo, a resposta deve ser honesta, mas não necessariamente completa. Além disso, efeitos de Manipulação e Intimidação de fontes externas a Kalak sofrem −1D contra você."},{"nome":"Veina","pericia":"Domínio ou Conhecimento, Cifras e Sigilos","traco":"Fluência Natural","tracoTexto":"Em Veina, Catalogada é uma palavra que os outros usam. Cifras de Vínculo Baixo que você conhece podem ser conjuradas sem satisfazer o gatilho sensorial, você as internalizou ao ponto em que o gesto basta. Além disso, você sempre encontra fonte: qualquer Cifra de Vínculo Baixo ou Médio que exista em Veina está disponível para você aprender, sem teste e sem favor, restando apenas o custo em XP e Corrupção."},{"nome":"Sienna","pericia":"Resistência ou Atletismo","traco":"Fronteira Viva","tracoTexto":"Você não sofre penalidades por condições ambientais extremas, frio, calor, altitude, privação de sono por até 48 horas. Além disso, uma vez por cena, quando seria reduzido a 0 Vitalidade por dano de qualquer fonte ambiental, queda, exposição, colapso estrutural, você permanece em 1 Vitalidade. Sobreviver é o que Sienna ensina antes de qualquer outra coisa. ê"},{"nome":"Narsim","pericia":"Lógica ou qualquer perícia de Espírito","traco":"Adaptação","tracoTexto":"Uma vez por sessão, você pode substituir a perícia o exigida por um teste por qualquer outra perícia que você tenha ao menos Grau 1, declarando como a abordagem diferente faz sentido na situação. O Narrador deve validar a narrativa, mas tem dificuldade em negar se a justificativa for razoável. Narsim ensina que não existe uma única forma de fazer qualquer coisa."},{"nome":"Terras Perdidas de Mireia","pericia":"Intuição ou Estabilidade","traco":"Toque de Mireia","tracoTexto":"As marés celestiais que Mireia comanda deixaram uma marca em você. Uma vez por sessão, você pode declarar que a lua está em posição favorável, o Narrador não pode negar isso narrativamente. Durante essa cena, todos os seus testes de Espírito recebem +1D e qualquer Cifra que você conjure não gera Corrupção, independente do Vínculo."}],"antecedentes":[{"nome":"Artista","pericia":"Performance","traco":"Presença de Palco","tracoTexto":"Quando você tem a atenção de um ou mais personagens, aliados ou não, e realiza qualquer ação que envolva expressão direta (falar, performar, demonstrar), pode realizar um teste de Carisma ND 2. Se passar, todos que estavam atentos recebem −1D em testes de resistência contra suas próximas tentativas de Influência até o fim da cena. Você não precisa estar em um palco. Precisa estar sendo observado."},{"nome":"Acadêmico","pericia":"Conhecimento, Atualidades","traco":"Fundamentado","tracoTexto":"Uma vez por cena, quando realizar um teste de Lógica ou Conhecimento em situação em que sua formação acadêmica é claramente relevante, você pode declarar a fonte, um texto, uma pesquisa, uma metodologia. Se fizer isso, adicione +1D ao teste. Se falhar mesmo assim, o Narrador deve oferecer ao menos uma informação parcialmente correta sobre o tema, você sabe o suficiente para saber que está incompleto."},{"nome":"Amnésico","pericia":"Uma à sua escolha, e o jogador deve justificar brevemente com o Narrador porque faz sentido dado o mistério do personagem","traco":"Quem Sou Eu?","tracoTexto":"Uma vez por cena, você pode focar em um objeto, i local, pessoa ou situação e realizar um teste de Consciência ND 2. Se passar, você vislumbra um fragmento do seu passado relacionado ao foco, uma memória que o Narrador define com base no que faria sentido para a história. Os detalhes são reais, mas não necessariamente completos. Se falhar, o fragmento surge de qualquer forma, mas distorcido. Verdade e ficção misturadas."},{"nome":"Atleta","pericia":"Atletismo","traco":"Corpo Primeiro","tracoTexto":"Uma vez por cena, pode receber +1D em qualquer teste de Movimentação nessa rodada. Além disso, você nunca sofre penalidades de terreno por condições físicas que seria razoável supor que um atleta de alto nível treinou, superfícies irregulares, obstáculos urbanos, corrida prolongada."},{"nome":"Barra Pesada","pericia":"Briga","traco":"Socar Nunca é Demais","tracoTexto":"Você recebe +1 de dano em todos os ataques desarmados. Além disso, quando imobilizar um alvo, pode usar uma Ação Livre para realizar um ataque desarmado contra ele imediatamente, sem custo adicional."},{"nome":"Cientista","pericia":"Conhecimento, Ciências (defina a área com o Narrador)","traco":"Método Científico","tracoTexto":"Sempre que realizar um teste de Lógica em situação em que uma abordagem metodológica e analítica é aplicável, investigação de cena, análise de fenômeno, identificação de padrão, você pode substituir Lógica por Conhecimento (Ciências). Além disso, quando analisar uma aberração ou fenômeno etéreo, pode perguntar ao Narrador uma pergunta de natureza funcional, o que isso faz, como funciona, o que o ativa. A resposta é sempre parcialmente verdadeira."},{"nome":"Especialista de Saúde","pericia":"Conhecimento, Medicina","traco":"Método Avançado","tracoTexto":"Quando usar um Kit de Medicina ou habilidade de cura e falhar, pode tentar novamente imediatamente com os mesmos dados, sem penalidades. Além disso, uma vez por cena, pode estabilizar um personagem que acabou de perder um nível de Vitalidade como Ação Livre se estiver adjacente a ele, sem necessidade de teste."},{"nome":"Investigador","pericia":"Lógica","traco":"Olhos de Águia","tracoTexto":"Quando falhar em um teste de Lógica ou Percepção, pode tentar novamente imediatamente. O segundo resultado é definitivo. Além disso, você nunca deixa de notar contradições, sempre que um personagem (NPC ou jogador) mentir para você em uma interação direta, o Narrador deve te dar um sinal não verbal de que algo não está certo, mesmo que você não saiba o quê."},{"nome":"Militar","pericia":"Pontaria","traco":"Distintivo","tracoTexto":"Você possui identificação funcional de autoridade, ou algo /* Lista única de Talentos. Cada um carrega a Chave de quem pode comprar —
   hoje todas as Chaves são de Arquétipo, porque é o que a revisão publicou.
   Peso é sempre igual ao custo em XP; não guardamos o campo duas vezes. */
const TALENTOS = ARQUETIPOS.flatMap(a =>
  a.talentos.map(t => ({nome:t.nome, xp:t.xp, ativada:t.ativada, texto:t.texto, chave:a.nome}))
);

/* "Passo Curto" existe no Combatente Etéreo e no Infiltrado, com efeitos
   diferentes. Nome sozinho não identifica um Talento: a chave entra junto. */
function achaTalento(nome, chave){
  return TALENTOS.find(t => t.nome === nome && (!chave || t.chave === chave));
}

const SKILLS = {
  corpo:       ["Atletismo","Briga","Destreza","Movimentação","Resistência"],

  espirito:    ["Consciência","Domínio","Estabilidade","Intuição","Propósito"],
  influencia:  ["Adestramento","Carisma","Intimidação","Lábia","Performance"]
};
const ATTR_LABEL = {corpo:"Corpo",raciocinio:"Raciocínio",espirito:"Espírito",influencia:"Influência"};

const VIT_LEVELS = [
  {n:5,nome:"Saudável",pen:"Nenhuma"},

  {n:3,nome:"Ferido",pen:"−1D em todos os testes",warn:true},

/* A Linhagem responde às duas perguntas: quanto o corpo aguenta e quanto
   Caos cabe dentro. Ninguém é bom nas duas. */
const LINHAGEM_STATS = {
  "Angelical":{vit:8,  limiar:10},
  "Dracônico":{vit:10, limiar:8},
  "Lunar":    {vit:6,  limiar:12},

/* A Capacidade não se compra. Vem do estágio de Ascensão, e cada estágio

const LINHAGENS = ["Angelical (padrão)","Dracônico","Lunar","Bestial"];

};

/* A Corrupção não tem tabela de estados própria. A escada é a proporção
   entre ela e o Limiar, e o Limiar vem da Linhagem — por isso o mesmo
   número de Corrupção significa coisas diferentes em corpos diferentes. */
/* As casas da barra de Corrupção.

   A Assentada é a única coisa que o jogador marca, e ele marca clicando —
   um campo numérico ao lado da barra pedia que a mesma informação fosse
   lida em dois lugares e digitada num terceiro.

   A Ativada não se clica: ela vem dos Talentos acesos e muda quando o
   jogador acende ou apaga um. Por isso ocupa as casas seguintes com trama
   em vez de tinta cheia — está lá, conta contra o Limiar, mas quem manda
   nela é o painel de Talentos. */
function celulasCorrupcao(c){
  const limiar = limiarDe(c);
  const assentada = Number(c.corrAssentada) || 0;
  const ativada = ativadaDe(c);
  return Array.from({length:limiar},(_,i) => {
    const v = i + 1;
    const faixa = v >= limiar ? "max" : v > 2*limiar/3 ? "hi" : v > limiar/3 ? "mid" : "";
    const estado = v <= assentada ? "assentada"
                 : v <= assentada + ativada ? "ativada" : "";
    const rotulo = estado === "ativada"
      ? "Ativada " + v + " — vem de Talento aceso; clicar marca Assentada até aqui"
      : "Assentada " + v + (v === assentada ? " — clique para baixar" : "");
    return `<button class="corr-c ${estado} ${faixa}" data-corr="${v}"
      title="${esc(rotulo)}" aria-label="${esc(rotulo)}"></button>`;
  }).join("");
}
function corrState(v, limiar){
  const L = limiar || 10;
  if(v<=0)      return {t:"Limpo",      d:"Nenhum efeito."};
  if(v<=L/3)    return {t:"Marcado",    d:"Aberrações te detectam com mais facilidade. Percepções começam a mudar."};
  if(v<=2*L/3)  return {t:"Contaminado",d:"−1D em testes de Influência. Aberrações são atraídas por você. O Narrador pode introduzir complicações ligadas à sua presença."};
  if(v< L)      return {t:"Corrompido", d:"Sinais físicos graves. −1D em testes de Espírito. O Narrador pode exigir testes para manter controle sob tensão."};
  return {t:"Limiar", d:"O Narrador determina a consequência definitiva, conforme a sua Linhagem."};
}

/* ---------- derivações de Linhagem, Corrupção e Capacidade ----------
   Ficam juntas porque contam uma coisa só: quanto cabe em você e quanto
   já está ocupado. */

const linChave  = c => String(c.linhagem || "").replace(/\s*\(padrão\)/,"");
const linStats  = c => LINHAGEM_STATS[linChave(c)] || LINHAGEM_STATS["Angelical"];
const vitMaxDe  = c => linStats(c).vit;
const limiarDe  = c => linStats(c).limiar;

const capacidadeDe = c => CAPACIDADE[c.ascensao] || CAPACIDADE["Vislumbre"];

/* Um Talento só pesa e só cobra Ativada enquanto estiver aceso. Os demais
   continuam na ficha, dormentes. */
const talentosAtivos = c => (c.talentos || []).filter(t => t.ativo);
const pesoUsado = c => talentosAtivos(c).reduce((s,t) => s + (Number(t.xp)||0), 0);
const ativadaDe = c => talentosAtivos(c).reduce((s,t) => s + (Number(t.ativada)||0), 0);

/* Duas Corrupções, e as duas contam igual contra o Limiar. A Assentada é o
   que ficou e só sai em Local Seguro ou no contato com uma Âncora. A Ativada
   é o que você está carregando por escolha, e sai quando o Talento apaga. */
const corrTotal = c => (Number(c.corrAssentada)||0) + ativadaDe(c);

/* ---------- experiência ----------
   O gasto não é digitado: ele é a soma do que está na ficha. Todo Talento
   custa o próprio XP — aceso ou dormente, porque dormente continua comprado
   — e toda Cifra custa o XP do seu Vínculo. Assim o jogador só anota o que
   ganhou, e a conta do que sobra se faz sozinha. */
const xpDeCifra = f => Number(f.xp) || 0;
const xpGasto = c =>
  (c.talentos || []).reduce((s,t) => s + (Number(t.xp)||0), 0) +
  (c.cifras   || []).reduce((s,f) => s + xpDeCifra(f), 0);
const xpLivre = c => (Number(c.xp)||0) - xpGasto(c);
