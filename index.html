</div>

<script>
/* Catálogo do livro, extraído do PDF oficial por extrai_dados.js.
   Doze Arquétipos com doze Talentos cada, vinte Talentos Gerais,
   cento e vinte Cifras, dez Antecedentes, catorze Traços e seis Bênçãos. */
const DADOS = {"versao":"0.73","arquetipos":[{"nome":"Bastião","familia":"Baluarte","atributo":"corpo","resumo":"A pessoa que resolve não saindo do lugar. Não necessariamente batendo: ocupando, aguentando, e continuando de pé quando não deveria.","forma":"Ainda de Pé","passiva":"Você ignora a penalidade de Face do seu próprio estado de Vitalidade. O corpo protesta e trabalha do mesmo jeito.","ativa":"Quando você perderia um nível de Vitalidade, declare: você não perde. Seus Pontos de Vitalidade voltam a 3.","limite":"A passiva cobre a Face e não cobre o resto. Gravemente Ferido continua tirando a reação dele, e é a única coisa no mundo que ainda o desmonta. Um Bastião nesse estado é uma parede que não sabe mais desviar.","prateleira":[{"nome":"Corpo Interposto","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Colocar se entre um aliado adjacente e um ataque destinado a ele é Ação Livre e não consome sua reação. O ataque passa a ser resolvido contra você. Uma vez por rodada, e você precisa estar adjacente ao aliado, sem estar Caído nem Imobilizado.","patamar":"I","grau":1,"xp":2,"fonte":"Bastião"},{"nome":"Peso Transferido","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Derrubar ou empurrar um alvo que você acabou de acertar é Ação Livre, sem teste oposto. Corpo a corpo, contra alvo de tamanho comparável ao seu, uma vez por Foco.","patamar":"I","grau":1,"xp":2,"fonte":"Bastião"},{"nome":"Chamar Atenção","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Forçar um inimigo que consiga ver você a ficar Provocado é Ação Livre, sem teste. Uma vez por Foco, um alvo por vez, e não funciona em nada que não tenha vontade própria.","patamar":"I","grau":1,"xp":2,"fonte":"Bastião"},{"nome":"Guarda Que Não Abre","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Ao reagir com Bloquear, role o dado de Atributo duas vezes e use o melhor resultado. Só em Bloquear, nunca em Esquivar ou Revidar.","patamar":"II","grau":3,"xp":4,"fonte":"Bastião"},{"nome":"Não Cede","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes de Fortitude nunca resultam Terrível. Um 1 conta como Falha comum.","patamar":"II","grau":3,"xp":4,"fonte":"Bastião"},{"nome":"Postura Firme","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Se você não se moveu no seu Foco anterior, o primeiro ataque contra você nesta rodada sofre 1 Face a menos. O efeito some no instante em que você se move, mesmo com Ação Livre.","patamar":"II","grau":3,"xp":4,"fonte":"Bastião"},{"nome":"Argumento Físico","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Influência por Corpo em testes de Intimidação. A ameaça precisa ser fisicamente crível e imediata. Não funciona por escrito, à distância, nem contra quem já viu você perder.","patamar":"III","grau":5,"xp":6,"fonte":"Bastião"},{"nome":"Muro Consciente","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Fortitude para notar aproximação hostil, e você nunca fica Desprevenido. Só contra o que se aproxima fisicamente. Não detecta Cifra, Distorção nem intenção.","patamar":"III","grau":5,"xp":6,"fonte":"Bastião"},{"nome":"Casca Grossa","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Propósito por Fortitude para resistir a Manipulação, Intimidação e pressão psicológica. Você não fica imune. Fica difícil de mover, que é diferente.","patamar":"III","grau":5,"xp":6,"fonte":"Bastião"},{"nome":"Ninguém Passa","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Até o fim da cena, nenhuma criatura hostil atravessa o espaço adjacente a você sem antes vencer um teste oposto de Atletismo contra a sua Fortitude. Falhando, o movimento dela termina ali. Ação Livre, uma vez por cena, e termina se você ficar Caído, Inconsciente, ou se você mesmo se mover.","patamar":"IV","grau":7,"xp":8,"fonte":"Bastião"},{"nome":"Âncora de Carne","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Até o fim da cena, aliados adjacentes a você não podem ser movidos contra a vontade nem atingidos por efeito de área. Ação Livre, uma vez por cena, e termina se você cair. Não protege contra ataque direcionado.","patamar":"IV","grau":7,"xp":8,"fonte":"Bastião"},{"nome":"Peso do Mundo","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Um ataque destinado a qualquer aliado que você consiga ver é resolvido contra você. Não importa a distância: a alma vai até lá e volta com o golpe dentro. Uma vez por cena, declarado antes da rolagem, e você precisa estar consciente e capaz de reagir.","patamar":"IV","grau":7,"xp":8,"fonte":"Bastião"}]},{"nome":"Batedor","familia":"Baluarte","atributo":"corpo","resumo":"A pessoa que resolve quebrando. Não tem cuidado com o próprio corpo e não tem cuidado com a própria alma, e é por isso que consegue coisas que ninguém consegue.","forma":"Preço do Corpo","passiva":"Você nunca testa para continuar agindo sob dor, medo, exaustão ou Corrupção alta. Onde outro personagem rolaria para não recuar, você simplesmente continua.","ativa":"Converta uma falha sua que acabou de acontecer em sucesso simples. Tome 2 de Corrupção Recente.","limite":"Ele não escolhe quando parar, e o jogo não vai obrigar. A ativa é a única habilidade dos doze que enche o Limiar por escolha do jogador, e nada no sistema impede que ele a use até o fim.","prateleira":[{"nome":"Sem Freio","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Aproximar se de um alvo visível a distância curta ou média é Ação Livre, desde que a sua Ação Padrão daquele Foco seja um ataque contra ele. O trajeto precisa estar transitável. Terreno impossível continua impossível.","patamar":"I","grau":1,"xp":2,"fonte":"Batedor"},{"nome":"Mão Suja","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Arrancar, quebrar ou tomar um objeto das mãos de alguém que você acabou de acertar é Ação Livre, sem teste. Objeto que caiba em uma mão, uma vez por Foco.","patamar":"I","grau":1,"xp":2,"fonte":"Batedor"},{"nome":"Pancada Seca","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Quebrar uma porta, uma cobertura, uma janela ou qualquer obstáculo que ceda a força bruta é Ação Livre. Sempre faz barulho. Sempre destrói.","patamar":"I","grau":1,"xp":2,"fonte":"Batedor"},{"nome":"Golpe Fechado","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus ataques corpo a corpo nunca resultam Terrível. Um 1 conta como Falha comum. Não vale para arma de fogo nem arremesso.","patamar":"II","grau":3,"xp":4,"fonte":"Batedor"},{"nome":"Braço que Não Erra","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Ao declarar uma Sequência, role o dado de Perícia duas vezes e use o melhor resultado. Só quando você declara dois golpes ou mais.","patamar":"II","grau":3,"xp":4,"fonte":"Batedor"},{"nome":"Alma na Mão","modo":"Passivo","carga":1,"corrupcao":0,"efeito":"A arma branca que você empunha conta como imbuída enquanto este Talento estiver ativo. O dano dela não é reduzido contra aberração, e nenhuma criatura etérea pode ignorar o golpe alegando não ter corpo. Só arma branca. Alma não anda em bala.","patamar":"II","grau":3,"xp":4,"fonte":"Batedor"},{"nome":"Rasgo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Destreza por Briga para abrir, arrombar, cortar ou remover qualquer coisa que esteja no caminho. Sempre destrói o que foi aberto, e sempre faz barulho. Não serve para nada que precise continuar inteiro.","patamar":"III","grau":5,"xp":6,"fonte":"Batedor"},{"nome":"Assinatura","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Domínio por Fortitude no teste de Domínio, quando a Cifra for conjurada com contato físico ou pelo próprio corpo. Não vale para Cifra à distância, de área ou de percepção.","patamar":"III","grau":5,"xp":6,"fonte":"Batedor"},{"nome":"Abrir Caminho","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Movimentação por Briga para atravessar um espaço ocupado por inimigos. Você passa quebrando: cada inimigo atravessado fica Caído, e você termina o movimento adjacente ao último deles.","patamar":"III","grau":5,"xp":6,"fonte":"Batedor"},{"nome":"Primeiro e Último","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Seu primeiro ataque da cena acontece antes de qualquer outra ação, e o alvo não pode reagir a ele. Uma vez por cena, contra um alvo que ainda não agiu, e você precisa estar consciente e não Desprevenido.","patamar":"IV","grau":7,"xp":8,"fonte":"Batedor"},{"nome":"Mais Um","modo":"Ativo","carga":0,"corrupcao":2,"efeito":"Ao terminar sua Ação Padrão, faça outra Ação Padrão imediatamente. Uma vez por cena, e as duas precisam acontecer no mesmo Foco.","patamar":"IV","grau":7,"xp":8,"fonte":"Batedor"},{"nome":"Nada Sobra","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Declare que o seu golpe destrói o que ele acertar: um objeto, uma barreira, uma arma, uma cobertura. Contra uma criatura, o ataque ignora qualquer reação. Uma vez por cena, declarado antes de rolar, e não funciona contra o que você não consegue alcançar com o corpo.","patamar":"IV","grau":7,"xp":8,"fonte":"Batedor"}]},{"nome":"Ligeiro","familia":"Baluarte","atributo":"corpo","resumo":"A pessoa que resolve não estando onde deveria estar. Distância, saída, rota, o passo que ninguém viu.","forma":"Nunca Encurralado","passiva":"Você nunca fica sem saída. Sempre que o Narrador descrever um lugar como fechado, ele é obrigado a te informar uma rota de fuga, mesmo que seja terrível: um cano, uma queda, uma parede fina, uma pessoa que você teria que empurrar.","ativa":"Declare que você já não está mais ali. Você aparece em qualquer ponto visível para o qual houvesse rota plausível, e o que estava acontecendo com você erra.","limite":"Ele sai. Não leva ninguém. Toda vez que a saída aparece, o Ligeiro precisa decidir se some sozinho, e o resto da equipe assiste.","prateleira":[{"nome":"Passo Curto","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Aproximar se de um alvo visível a distância curta é Ação Livre. Uma vez por Foco, e o trajeto precisa estar desimpedido.","patamar":"I","grau":1,"xp":2,"fonte":"Ligeiro"},{"nome":"Saída Rápida","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Levantar de Caído, entrar em cobertura ou trocar de uma cobertura para outra adjacente é Ação Livre. Uma dessas três por Foco, não as três.","patamar":"I","grau":1,"xp":2,"fonte":"Ligeiro"},{"nome":"Reposicionar","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Depois de resolver sua Ação Padrão, mover se uma distância curta é Ação Livre. Só depois da Ação Padrão, nunca antes, uma vez por Foco.","patamar":"I","grau":1,"xp":2,"fonte":"Ligeiro"},{"nome":"Trajeto Limpo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Terreno irregular, obstáculo urbano, escuridão e multidão não impõem penalidade ao seu deslocamento, e você não fica Caído por efeito de área. Não vale para terreno que exija equipamento, como escalada vertical ou submersão.","patamar":"II","grau":3,"xp":4,"fonte":"Ligeiro"},{"nome":"Nunca Parado","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Ao reagir com Esquivar, role o dado de Atributo duas vezes e use o melhor resultado. Não funciona se você estiver Imobilizado ou sem espaço para onde ir.","patamar":"II","grau":3,"xp":4,"fonte":"Ligeiro"},{"nome":"Nunca no Mesmo Lugar","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Se você se moveu no seu Foco anterior, ataques à distância contra você sofrem 1 Face a menos. Perde o efeito em qualquer rodada em que você não tenha se movido.","patamar":"II","grau":3,"xp":4,"fonte":"Ligeiro"},{"nome":"Distância Lida","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Lógica por Movimentação para avaliar posicionamento, e você sabe sem teste se alcança um alvo antes que ele aja. Só sobre espaço que você consegue ver.","patamar":"III","grau":5,"xp":6,"fonte":"Ligeiro"},{"nome":"Mão na Corrida","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Destreza por Movimentação para pegar, soltar, entregar ou trocar qualquer coisa enquanto se desloca. Parado, você é tão desastrado quanto qualquer um.","patamar":"III","grau":5,"xp":6,"fonte":"Ligeiro"},{"nome":"Leitura de Terreno","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Movimentação para encontrar saídas, passagens e o caminho mais rápido entre dois pontos. Só sobre o espaço. Não encontra pessoas, objetos escondidos nem armadilhas.","patamar":"III","grau":5,"xp":6,"fonte":"Ligeiro"},{"nome":"Ninguém Segura","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Até o fim da cena, você não pode ser Imobilizado, agarrado, preso nem impedido de se mover. Efeitos que tentem fazer isso simplesmente falham. Ação Livre, uma vez por cena, e não impede dano nem condições que não sejam de contenção.","patamar":"IV","grau":7,"xp":8,"fonte":"Ligeiro"},{"nome":"Levo Comigo","modo":"Ativo","carga":1,"corrupcao":0,"efeito":"Mova se até qualquer ponto visível e leve junto um aliado adjacente, ou um objeto que você consiga carregar. Uma vez por cena, o aliado precisa aceitar, e o destino precisa ser alcançável a pé.","patamar":"IV","grau":7,"xp":8,"fonte":"Ligeiro"},{"nome":"Já Estava Lá","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Interrompa a ação de qualquer personagem e declare que você alcançou um ponto ou um alvo dentro do seu campo de visão. Sem teste e sem custo de ação. A ação interrompida se resolve depois, com você já no lugar. Uma vez por cena, e o destino precisa estar visível e alcançável a pé. Prospector O atributo é Raciocínio. São os três que resolvem tendo chegado antes: na informação, na leitura, ou na porta.","patamar":"IV","grau":7,"xp":8,"fonte":"Ligeiro"}]},{"nome":"Sentinela","familia":"Prospector","atributo":"raciocinio","resumo":"A pessoa que resolve mantendo os outros de pé. Sabe o estado de todo mundo, sabe quando alguém está prestes a quebrar, e chega antes de quebrar.","forma":"Correção de Rumo","passiva":"Você sabe o estado aproximado de Vitalidade, Corrupção e condições de todos os aliados que consegue ver. Sem teste e sem perguntar.","ativa":"Um teste que acabou de ser rolado, seu ou de um aliado, é rolado de novo. O segundo resultado vale.","limite":"Ele corrige o que já aconteceu e não impede que aconteça. E ele só tem uma correção por cena, o que significa que na maior parte do tempo o Sentinela sabe exatamente quem vai morrer e assiste.","prateleira":[{"nome":"Mão Treinada","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Estabilizar um aliado adjacente que acabou de perder um nível de Vitalidade é Ação Livre, sem teste. Uma vez por Foco, e o aliado precisa estar consciente ou recém caído, nunca no nível 0.","patamar":"I","grau":1,"xp":2,"fonte":"Sentinela"},{"nome":"Triagem","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Dizer a um aliado que consiga ouvir você o que ele deve fazer para não piorar é Ação Livre. Ele remove uma condição à sua escolha entre Provocado, Atordoado e Caído. Uma vez por Foco, um aliado por vez.","patamar":"I","grau":1,"xp":2,"fonte":"Sentinela"},{"nome":"Bolsa Aberta","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Sacar, entregar ou aplicar um item de socorro é Ação Livre, inclusive se o item estiver nas Costas. Só item de socorro. Arma continua exigindo Ação Padrão.","patamar":"I","grau":1,"xp":2,"fonte":"Sentinela"},{"nome":"Diagnóstico","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você sabe, sem teste, exatamente quantos Pontos de Vitalidade e quanta Corrupção qualquer criatura que você consiga ver ainda aguenta. Não funciona em nada que não tenha corpo.","patamar":"II","grau":3,"xp":4,"fonte":"Sentinela"},{"nome":"Presença Firme","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Aliados adjacentes a você nunca resultam Terrível em testes de Propósito. Você precisa estar consciente e visível para eles.","patamar":"II","grau":3,"xp":4,"fonte":"Sentinela"},{"nome":"Método","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes para tratar, estabilizar ou diagnosticar nunca resultam Terrível, e uma falha nunca piora o estado do paciente. Só em tratamento. Não vale para ataque nem para reação.","patamar":"II","grau":3,"xp":4,"fonte":"Sentinela"},{"nome":"Leitura de Corpo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Conhecimento para saber se alguém está ferido, doente, drogado, mentindo sobre o próprio estado ou perto do Limiar. Só sobre o estado do corpo e da alma. Não lê intenção.","patamar":"III","grau":5,"xp":6,"fonte":"Sentinela"},{"nome":"Ordem de Marcha","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Lógica por Lábia para coordenar um grupo, distribuir tarefas ou estabelecer prioridade em uma cena de emergência. Precisa que as pessoas queiram ser coordenadas.","patamar":"III","grau":5,"xp":6,"fonte":"Sentinela"},{"nome":"Mão que Segura","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Domínio por Conhecimento no teste de Domínio, quando a Cifra tiver como alvo o corpo de outra pessoa. Só Cifra dirigida a corpo alheio. Não vale em você mesmo.","patamar":"III","grau":5,"xp":6,"fonte":"Sentinela"},{"nome":"Ainda Dá Tempo","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Um aliado que chegaria ao nível 0 de Vitalidade para no nível 1, Inconsciente. Uma vez por cena, e você precisa conseguir alcançar essa pessoa antes do fim do seu próximo Foco. Se não alcançar, ela morre assim mesmo.","patamar":"IV","grau":7,"xp":8,"fonte":"Sentinela"},{"nome":"Segunda Opinião","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Depois que um teste de aliado for resolvido, declare que ele fez outra coisa. O teste é substituído por outro, de outra perícia, contra o mesmo problema. Uma vez por cena, e o aliado precisa aceitar.","patamar":"IV","grau":7,"xp":8,"fonte":"Sentinela"},{"nome":"Costura de Alma","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Transfira para si mesmo qualquer quantidade de Corrupção Recente de um aliado que você consiga tocar. Ela passa a ser sua, e passa a ser Assentada. Uma vez por cena, e não existe forma de recusar depois de declarado.","patamar":"IV","grau":7,"xp":8,"fonte":"Sentinela"}]},{"nome":"Pesquisador","familia":"Prospector","atributo":"raciocinio","resumo":"A pessoa que resolve percebendo. O detalhe fora do lugar, a contradição, a coisa que ninguém disse.","forma":"O Que Não Fecha","passiva":"Você nunca fica Desprevenido, e o Narrador é obrigado a te avisar quando algo na cena não está certo, sem dizer o quê.","ativa":"Faça uma pergunta concreta sobre a cena. O Narrador responde honestamente. Pode responder pouco. Não pode responder falso.","limite":"Perceber não é agir. O Pesquisador enxerga a armadilha, a mentira e o traidor, e continua precisando de outra pessoa para fazer alguma coisa a respeito.","prateleira":[{"nome":"Olho Rápido","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Examinar um objeto, um corpo ou um trecho de cena é Ação Livre em vez de Ação Padrão. Uma vez por Foco, e só sobre o que está ao alcance da vista.","patamar":"I","grau":1,"xp":2,"fonte":"Pesquisador"},{"nome":"Anotação de Campo","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Marcar um alvo que você consiga ver é Ação Livre. Até o fim da cena, você sabe onde ele está mesmo sem enxergar. Um alvo por vez, e a marca cai se ele sair da sua percepção por uma cena inteira.","patamar":"I","grau":1,"xp":2,"fonte":"Pesquisador"},{"nome":"Já Contei","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Perguntar ao Narrador quantas criaturas hostis existem em uma cena, e onde estão as saídas, é Ação Livre e não exige teste. Uma vez por cena, e só sobre o que seria possível notar de onde você está.","patamar":"I","grau":1,"xp":2,"fonte":"Pesquisador"},{"nome":"Nada Passa","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes de Percepção nunca resultam Terrível, e você não pode ser surpreendido por algo que estivesse ao alcance da sua visão. Não protege contra o que veio de fora do seu campo de percepção.","patamar":"II","grau":3,"xp":4,"fonte":"Pesquisador"},{"nome":"Padrão Reconhecido","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Depois de ver uma criatura ou uma Cifra agir uma vez, testes seus contra aquela mesma coisa recebem 1 Face pelo resto da cena. Uma coisa por vez, e precisa ser exatamente a mesma.","patamar":"II","grau":3,"xp":4,"fonte":"Pesquisador"},{"nome":"Memória de Trabalho","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você lembra sem teste de qualquer detalhe de uma cena em que esteve, incluindo o que não prestou atenção na hora. Só o que estava ao alcance dos seus sentidos. Você não inventa o que não viu.","patamar":"II","grau":3,"xp":4,"fonte":"Pesquisador"},{"nome":"Cálculo de Rota","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Movimentação por Lógica para prever para onde alguém vai, interceptar um trajeto ou escolher o melhor ponto de espera. Sobre movimento alheio, nunca sobre o seu.","patamar":"III","grau":5,"xp":6,"fonte":"Pesquisador"},{"nome":"Perguntar Certo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Manipulação por Lógica quando o seu objetivo for extrair informação em vez de convencer. Só informação. Não muda a opinião de ninguém.","patamar":"III","grau":5,"xp":6,"fonte":"Pesquisador"},{"nome":"Assinatura de Cena","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Domínio por Percepção para identificar quem conjurou uma Cifra, quando, e a partir de onde. Só identificar. Não permite copiar nem desfazer nada.","patamar":"III","grau":5,"xp":6,"fonte":"Pesquisador"},{"nome":"Ponto Cego","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Declare uma fraqueza concreta em algo que você observou nesta cena. O Narrador precisa confirmar e ela passa a ser verdade. Uma vez por cena. Precisa ser fisicamente plausível e não pode ser fatal por si só.","patamar":"IV","grau":7,"xp":8,"fonte":"Pesquisador"},{"nome":"Eu Já Sabia","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Cancele completamente uma surpresa, emboscada ou revelação hostil, declarando que você tinha percebido antes e se preparou. Uma vez por cena. Não desfaz dano já sofrido.","patamar":"IV","grau":7,"xp":8,"fonte":"Pesquisador"},{"nome":"Fio Puxado","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Faça três perguntas ao Narrador sobre qualquer coisa ligada à cena atual, incluindo o que não está presente. Ele responde com verdade e sem enfeite. Uma vez por arco. Você vê o que puxou a partir do outro lado, e isso deixa marca.","patamar":"IV","grau":7,"xp":8,"fonte":"Pesquisador"}]},{"nome":"Espião","familia":"Prospector","atributo":"raciocinio","resumo":"A pessoa que resolve já estando dentro. Credencial, sistema, registro, alguém que atende quando ele liga.","forma":"Porta dos Fundos","passiva":"Diante de qualquer sistema, registro ou organização, você sabe sem teste o que ele guarda, quem tem acesso legítimo, e quanto tempo leva até alguém notar uma intrusão.","ativa":"Declare que você já tem acesso: uma credencial que passa, uma conta que ninguém desativou, um nome na lista, alguém lá dentro que atende. Funciona uma vez. Depois disso vira registro, e registros são consultados.","limite":"Tudo que ele usa deixa rastro. O Espião é o único dos doze cuja habilidade piora com o uso, e o Narrador escolhe quando a conta chega.","prateleira":[{"nome":"Crachá","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Apresentar uma credencial e passar por uma checagem de rotina é Ação Livre, sem teste. Uma vez por cena, e só em lugar onde alguém como você teria motivo para estar.","patamar":"I","grau":1,"xp":2,"fonte":"Espião"},{"nome":"Já Estava Aberto","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Abrir uma fechadura simples, um terminal comum ou uma porta comercial é Ação Livre. Não funciona em nada que alguém tenha se dado o trabalho de proteger de verdade.","patamar":"I","grau":1,"xp":2,"fonte":"Espião"},{"nome":"Troca de Pele","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Mudar de identidade aparente, incluindo roupa, postura e sotaque, é Ação Livre. Uma vez por cena, e não funciona diante de quem já viu o seu rosto nesta mesma cena.","patamar":"I","grau":1,"xp":2,"fonte":"Espião"},{"nome":"Nunca Levantei Suspeita","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes para se passar por outra pessoa nunca resultam Terrível, e uma falha significa apenas que não acreditaram, nunca que perceberam a farsa. Só em disfarce e identidade.","patamar":"II","grau":3,"xp":4,"fonte":"Espião"},{"nome":"Rota de Retirada","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você sempre sabe qual é a saída mais discreta de qualquer lugar em que entrou pela porta da frente. Não funciona se você foi levado sem ver o caminho.","patamar":"II","grau":3,"xp":4,"fonte":"Espião"},{"nome":"Nome na Lista","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você e um aliado à sua escolha constam em qualquer registro de rotina que o Narrador tenha estabelecido, como lista de convidados, folha de ponto ou manifesto de carga. Só registro de rotina. Não fura segurança de verdade.","patamar":"II","grau":3,"xp":4,"fonte":"Espião"},{"nome":"Boca de Corredor","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Conhecimento por Lábia para saber o que uma organização anda fazendo, quem está insatisfeito ali dentro e o que mudou recentemente. Só sobre gente e política interna. Não revela documento nem número.","patamar":"III","grau":5,"xp":6,"fonte":"Espião"},{"nome":"Passe Técnico","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Destreza por Lógica para arrombar, burlar sistema ou desmontar um mecanismo de segurança. Precisa de tempo e de ferramenta, e não funciona sob ataque.","patamar":"III","grau":5,"xp":6,"fonte":"Espião"},{"nome":"Sotaque Emprestado","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Performance por Manipulação para se passar por alguém de uma origem, classe ou profissão específica. Precisa que você já tenha observado alguém daquele tipo antes.","patamar":"III","grau":5,"xp":6,"fonte":"Espião"},{"nome":"Porta Aberta","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Declare que existe uma segunda entrada para o lugar onde vocês estão, e que ela não está vigiada agora. Uma vez por cena. O Narrador define para onde ela dá, e não precisa ser conveniente.","patamar":"IV","grau":7,"xp":8,"fonte":"Espião"},{"nome":"Nunca Estive Aqui","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Apague o registro da sua passagem por um lugar. Câmeras não têm você, testemunhas não lembram, o log não marca. Uma vez por arco. Não apaga o que você fez, só que foi você.","patamar":"IV","grau":7,"xp":8,"fonte":"Espião"},{"nome":"Gente Minha","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Declare que alguém presente na cena trabalha para você e sempre trabalhou. O Narrador define quem, entre os personagens que já estavam ali. Uma vez por arco. Essa pessoa tem os próprios interesses e vai cobrar. Canalizador O atributo é Espírito. São os três para quem a alma sai com facilidade, cada um por uma boca diferente.","patamar":"IV","grau":7,"xp":8,"fonte":"Espião"}]},{"nome":"Arquivista","familia":"Canalizador","atributo":"espirito","resumo":"A pessoa que resolve entendendo a língua. Ele não sabe mais Cifras que os outros. Ele sabe ler, e ler é copiar.","forma":"Marginália","passiva":"Você lê qualquer Cifra sendo conjurada, qualquer inscrição, qualquer sigilo. Sabe o que faz e a quem se endereça, sem teste.","ativa":"Uma Cifra conjurada na sua presença pode ser dita de volta por você antes do fim da cena. Mesmo que você não a conheça. Mesmo acima do seu Vínculo. A Corrupção é cobrada normalmente.","limite":"Ele precisa que alguém fale primeiro. Numa sala silenciosa, o Arquivista é um estudioso com um caderno.","prateleira":[{"nome":"Nota Rápida","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Identificar uma Cifra em curso, uma inscrição ou uma assinatura de Pilar é Ação Livre. Só o que estiver ao alcance da vista.","patamar":"I","grau":1,"xp":2,"fonte":"Arquivista"},{"nome":"Consulta","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Faça ao Narrador uma pergunta sobre a natureza de uma aberração, de uma Distorção ou de um fenômeno etéreo presente. A resposta é sempre parcialmente verdadeira. Uma vez por cena, e é Ação Livre.","patamar":"I","grau":1,"xp":2,"fonte":"Arquivista"},{"nome":"Mão Emprestada","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Forneça a um aliado adjacente o gatilho sensorial que falta a ele. Você articula, ele diz, e a Cifra existe. Ação Livre, uma vez por Foco, e ele precisa saber a Cifra.","patamar":"I","grau":1,"xp":2,"fonte":"Arquivista"},{"nome":"Ortografia","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes de Domínio nunca resultam Terrível. Um 1 conta como Falha comum.","patamar":"II","grau":3,"xp":4,"fonte":"Arquivista"},{"nome":"Glossário","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes para identificar qualquer coisa etérea nunca produzem informação falsa. Uma falha significa apenas que você não sabe.","patamar":"II","grau":3,"xp":4,"fonte":"Arquivista"},{"nome":"Assinatura Lida","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você percebe toda Cifra ativa, fonte de Distorção e aberração no seu campo de visão, sem teste e sem gatilho sensorial. Só o que está à vista. Não atravessa parede.","patamar":"II","grau":3,"xp":4,"fonte":"Arquivista"},{"nome":"Leitura Fria","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Conhecimento para notar Cifra sustentada, ilusão e disfarce etéreo. Só o que é feito de alma. Não detecta mentira comum.","patamar":"III","grau":5,"xp":6,"fonte":"Arquivista"},{"nome":"Tradução","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Lábia por Conhecimento ao negociar com qualquer coisa que opere pela língua: um conjurador, uma aberração com fala, um Semblante. Não funciona com gente comum.","patamar":"III","grau":5,"xp":6,"fonte":"Arquivista"},{"nome":"Erudição Aplicada","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Domínio por Conhecimento no teste de Domínio de Cifras de Vínculo Baixo. Você conhece a frase bem demais para se esforçar ao dizer ela. Só Vínculo Baixo.","patamar":"III","grau":5,"xp":6,"fonte":"Arquivista"},{"nome":"Cordão Tenso","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Uma Cifra acontecendo à sua vista simplesmente não alcança. Você a fecha. Não afeta nada nem ninguém. Uma vez por cena, e você precisa conseguir ver quem está conjurando.","patamar":"IV","grau":7,"xp":8,"fonte":"Arquivista"},{"nome":"Errata","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Altere um parâmetro de uma Cifra que outra pessoa está conjurando: o alvo, a direção ou a amplitude. Uma vez por cena, e você precisa ter identificado a Cifra antes de ela se resolver.","patamar":"IV","grau":7,"xp":8,"fonte":"Arquivista"},{"nome":"Autoridade Ortográfica","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Declare que uma Cifra Catalogada que você conhece é, na verdade, anterior aos Pilares. Nesta conjuração ela não é endereçada a ninguém, não gera Corrupção, e nenhum Pilar pode recusar. Uma vez por arco. Você está discutindo com a Cúpula sobre ortografia, e alguém vai reparar.","patamar":"IV","grau":7,"xp":8,"fonte":"Arquivista"}]},{"nome":"Invocador","familia":"Canalizador","atributo":"espirito","resumo":"A pessoa que resolve mandando outra coisa na frente. A alma dele sai, faz, e volta.","forma":"Sempre Dois","passiva":"Você mantém uma invocação menor permanentemente, sem custo de Capacidade e sem Corrupção. Ela carrega, observa, alcança, abre e distrai. Não luta, não tem ficha e não sofre dano.","ativa":"Mande que ela fique no seu lugar. Ela absorve inteiramente um efeito destinado a você, ataque, Cifra ou condição, e se desfaz. Volta na próxima cena.","limite":"A invocação não decide nada. Ela faz o que foi dito, exatamente como foi dito, e um Invocador impreciso recebe de volta exatamente o que pediu.","prateleira":[{"nome":"Coleira Curta","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Ordenar a sua invocação, dar tarefa nova ou redirecionar é Ação Livre. Ela executa exatamente o que foi dito.","patamar":"I","grau":1,"xp":2,"fonte":"Invocador"},{"nome":"Olho Emprestado","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Ver e ouvir pelo que você invocou é Ação Livre, e dura enquanto você quiser. Enquanto estiver vendo por ela, você não vê pelos próprios olhos.","patamar":"I","grau":1,"xp":2,"fonte":"Invocador"},{"nome":"Chamado Curto","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Conjurar uma Cifra de Invocar de Vínculo Baixo é Ação Livre. Uma vez por cena, e continua exigindo teste de Domínio.","patamar":"I","grau":1,"xp":2,"fonte":"Invocador"},{"nome":"Contrato Firme","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"A sua invocação não pode ser dispersada, banida, comandada nem convencida por outra pessoa. Ela ainda pode ser destruída se tiver corpo.","patamar":"II","grau":3,"xp":4,"fonte":"Invocador"},{"nome":"Não Some","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes de Domínio para Cifras de Invocar nunca resultam Terrível. Um 1 conta como Falha comum.","patamar":"II","grau":3,"xp":4,"fonte":"Invocador"},{"nome":"Duas Bocas","modo":"Passivo","carga":1,"corrupcao":0,"efeito":"A sua invocação articula o gatilho sensorial por você. Mãos presas, escuridão e mordaça não impedem as suas Cifras de Invocar. Só as de Invocar, e a invocação precisa estar presente.","patamar":"II","grau":3,"xp":4,"fonte":"Invocador"},{"nome":"Extensão","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Domínio por Pontaria ao conjurar uma Cifra à distância através da sua invocação. Ela precisa ter linha de visão para o alvo, e você para ela.","patamar":"III","grau":5,"xp":6,"fonte":"Invocador"},{"nome":"Voz de Dono","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Manipulação por Domínio para comandar criaturas etéreas que não sejam suas. Elas obedecem por reconhecimento, não por vontade, e param no instante em que você para de dizer.","patamar":"III","grau":5,"xp":6,"fonte":"Invocador"},{"nome":"Trabalho Delegado","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua qualquer perícia física por Domínio quando a tarefa for executada pela sua invocação em vez de por você. Ela tem as limitações que tem. Não faz o que não conseguiria fazer.","patamar":"III","grau":5,"xp":6,"fonte":"Invocador"},{"nome":"Contrato Maior","modo":"Ativo","carga":3,"corrupcao":0,"efeito":"Invoque uma criatura de verdade, com ficha, que luta ao seu lado até o fim da cena. O Narrador constrói ela conforme o seu Pilar. Uma vez por cena, e ela tem os próprios critérios sobre o que considera uma ordem razoável.","patamar":"IV","grau":7,"xp":8,"fonte":"Invocador"},{"nome":"Dois Lugares","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Troque de posição com a sua invocação instantaneamente, a qualquer distância, desde que você consiga ver ela ou ver por ela. Uma vez por cena.","patamar":"IV","grau":7,"xp":8,"fonte":"Invocador"},{"nome":"Enxame","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Divida a sua invocação em várias menores até o fim da cena. Elas agem juntas, cobrem uma área e não lutam. Uma vez por cena, e enquanto estiverem divididas nenhuma delas pode absorver nada por você.","patamar":"IV","grau":7,"xp":8,"fonte":"Invocador"}]},{"nome":"Intérprete","familia":"Canalizador","atributo":"espirito","resumo":"A pessoa que resolve com a arte. Onde os outros articulam com as mãos, ele articula com tudo: voz, corpo, instrumento, a sala inteira olhando.","forma":"Enquanto Eu Toco","passiva":"Enquanto você estiver performando, o gatilho sensorial de qualquer Cifra sua está satisfeito. Mãos amarradas, escuridão, silêncio imposto: nada disso te impede de articular.","ativa":"A próxima Cifra que você conjurar nesta cena alcança todos que conseguem ver ou ouvir a sua performance. Você escolhe quem fica de fora.","limite":"Ele precisa ser percebido. Um Intérprete que não pode ser visto nem ouvido é a única pessoa deste capítulo que fica sem nada.","prateleira":[{"nome":"Palco Improvisado","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Começar ou retomar uma performance é Ação Livre, e você não precisa de instrumento nem de espaço. A voz e o corpo bastam.","patamar":"I","grau":1,"xp":2,"fonte":"Intérprete"},{"nome":"Deixa","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Dê a um aliado que consiga ver ou ouvir você uma Ação Livre imediata. Uma vez por Foco, um aliado por vez.","patamar":"I","grau":1,"xp":2,"fonte":"Intérprete"},{"nome":"Refrão","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Conjurar uma Cifra Corrente enquanto você estiver performando é Ação Livre. Só Correntes.","patamar":"I","grau":1,"xp":2,"fonte":"Intérprete"},{"nome":"Afinação","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Enquanto estiver performando, seus testes de Domínio nunca resultam Terrível. Um 1 conta como Falha comum.","patamar":"II","grau":3,"xp":4,"fonte":"Intérprete"},{"nome":"Não Para","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Dano não interrompe a sua performance. Quem quiser calar você precisa vencer um teste oposto contra a sua Performance como Ação Padrão.","patamar":"II","grau":3,"xp":4,"fonte":"Intérprete"},{"nome":"Repertório","modo":"Passivo","carga":1,"corrupcao":0,"efeito":"Uma Cifra sustentada não ocupa a sua concentração enquanto você estiver performando. Você pode sustentar uma e conjurar outra. Vale para uma Cifra sustentada por vez.","patamar":"II","grau":3,"xp":4,"fonte":"Intérprete"},{"nome":"Leitura de Sala","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Performance para saber o que uma plateia quer, teme ou está prestes a fazer. Precisa de mais de meia dúzia de pessoas.","patamar":"III","grau":5,"xp":6,"fonte":"Intérprete"},{"nome":"Voz que Alcança","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Domínio por Performance no teste de Domínio, quando a Cifra for conjurada durante uma performance. Se a performance parar, o Talento não se aplica.","patamar":"III","grau":5,"xp":6,"fonte":"Intérprete"},{"nome":"Corpo Todo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Destreza por Performance em qualquer tarefa que exija precisão de mãos. Você faz com o corpo inteiro o que os outros fazem com os dedos, e é mais lento e mais bonito.","patamar":"III","grau":5,"xp":6,"fonte":"Intérprete"},{"nome":"Silêncio","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Até o fim do seu próximo Foco, ninguém presente consegue articular Cifra nenhuma. A sua performance ocupa o espaço inteiro e não sobra gesto para mais ninguém. Uma vez por cena, e vale para você também.","patamar":"IV","grau":7,"xp":8,"fonte":"Intérprete"},{"nome":"Peça em Três Atos","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Uma Cifra que você conjura se resolve em três momentos distintos da cena, escolhidos por você conforme ela avança. Uma vez por cena, e cada resolução alcança um terço do efeito.","patamar":"IV","grau":7,"xp":8,"fonte":"Intérprete"},{"nome":"Última Fala","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Conjure uma Cifra de um Vínculo acima do que a sua Ascensão aguenta. Você retém o dobro da Corrupção que reteria, sem chance de reduzir. Uma vez por cena, e você precisa conhecer a Cifra: este Talento fura o portão da Ascensão, nunca o da Confiança. Regente O atributo é Influência. São os três que resolvem fazendo outra pessoa resolver.","patamar":"IV","grau":7,"xp":8,"fonte":"Intérprete"}]},{"nome":"Manipulador","familia":"Regente","atributo":"influencia","resumo":"A pessoa que resolve movendo alguém. Um de cada vez, e no momento exato.","forma":"Precedente","passiva":"Suas tentativas sociais fracassadas não fecham portas. Quando não dá certo, o alvo não percebe que houve tentativa.","ativa":"Escolha alguém que possa ver e ouvir você. Ele age imediatamente, fora da ordem do Foco, fazendo uma coisa concreta que você pediu. Um aliado age de graça; um inimigo faz e só depois entende por quê. Não pode ser algo que o mate nem que traia o que ele mais protege.","limite":"Nada disso funciona no que não tem vontade própria. Aberração não obedece, distorção não escuta, e uma porta trancada continua trancada.","prateleira":[{"nome":"Uma Palavra","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Fazer uma tentativa de Manipulação, Lábia ou Intimidação contra um alvo que consiga ouvir você é Ação Livre. Uma vez por Foco, e o alvo precisa ter vontade própria.","patamar":"I","grau":1,"xp":2,"fonte":"Manipulador"},{"nome":"Botão Certo","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Perguntar ao Narrador o que uma pessoa presente mais quer neste momento é Ação Livre. Uma vez por cena, e a resposta é o desejo imediato, não o profundo.","patamar":"I","grau":1,"xp":2,"fonte":"Manipulador"},{"nome":"Semear","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Plantar uma ideia em alguém com quem você já está conversando é Ação Livre. Ela não obriga a nada. Só passa a estar lá, e a pessoa vai achar que foi dela.","patamar":"I","grau":1,"xp":2,"fonte":"Manipulador"},{"nome":"Nunca Foi Tentativa","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes sociais nunca resultam Terrível, e uma falha nunca revela que você estava tentando alguma coisa.","patamar":"II","grau":3,"xp":4,"fonte":"Manipulador"},{"nome":"Cara de Verdade","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Testes para detectar que você está mentindo sofrem 1 Face a menos. Não protege contra Cifra que leia a alma.","patamar":"II","grau":3,"xp":4,"fonte":"Manipulador"},{"nome":"Rachadura","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Depois de falhar contra um alvo, você conhece uma vulnerabilidade concreta dele. Testes seus contra aquela pessoa recebem 1 Face pelo resto da cena. Um alvo por vez, e a falha precisa ter acontecido.","patamar":"II","grau":3,"xp":4,"fonte":"Manipulador"},{"nome":"Cálculo de Gente","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Lógica por Manipulação para prever o que uma pessoa vai fazer, deduzir quem mentiu ou reconstruir a intenção por trás de um ato. Sobre gente, nunca sobre coisa.","patamar":"III","grau":5,"xp":6,"fonte":"Manipulador"},{"nome":"Peso da Voz","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Intimidação por Manipulação quando a ameaça for social em vez de física: um cargo, uma reputação, uma vida que pode ser desmontada. Não funciona com quem não tem nada a perder.","patamar":"III","grau":5,"xp":6,"fonte":"Manipulador"},{"nome":"Confissão","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Lábia para saber o que alguém está escondendo, desde que você esteja conversando com essa pessoa. Você descobre que existe algo escondido e o formato dele, não o conteúdo.","patamar":"III","grau":5,"xp":6,"fonte":"Manipulador"},{"nome":"Segunda Voz","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Um personagem que agiu neste Foco refaz a ação de outro jeito, do jeito que você sugeriu. Uma vez por cena, e a nova ação precisa ser algo que aquela pessoa faria se pensasse melhor.","patamar":"IV","grau":7,"xp":8,"fonte":"Manipulador"},{"nome":"Ninguém Discorda","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Até o fim da cena, ninguém presente contradiz você em voz alta. Continuam pensando o que pensavam, e continuam podendo agir contra você. Só não falam. Uma vez por cena.","patamar":"IV","grau":7,"xp":8,"fonte":"Manipulador"},{"nome":"Dono da Conversa","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Declare o que uma pessoa presente acredita sobre você, e passa a ser verdade para ela até o fim do arco. Uma vez por arco. Não pode contradizer algo que ela viu com os próprios olhos.","patamar":"IV","grau":7,"xp":8,"fonte":"Manipulador"}]},{"nome":"Estrategista","familia":"Regente","atributo":"influencia","resumo":"A pessoa que resolve tendo arranjado antes. Favor, combinado, gente que fez porque ele pediu na semana passada.","forma":"Já Combinado","passiva":"Toda vez que o grupo entra em uma situação para a qual você teve tempo de preparar, cada aliado começa sabendo um fato concreto que você estabeleceu. Você escreve os fatos, um por aliado.","ativa":"Declare que alguém presente já estava arranjado por você. Está esperando, está te devendo, ou foi avisado do que fazer. O Narrador define quanto isso vale, e precisa ser real.","limite":"Ele precisa de tempo e precisa ter estado ali antes, de alguma forma. Levado a um lugar que ele não escolheu, sem aviso, o Estrategista é uma pessoa comum com opiniões.","prateleira":[{"nome":"Briefing","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Passar uma instrução concreta para toda a equipe é Ação Livre, mesmo em combate, e todos que ouvirem sabem exatamente o que fazer. Uma vez por cena.","patamar":"I","grau":1,"xp":2,"fonte":"Estrategista"},{"nome":"Já Providenciei","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Declarar que um item comum e não restrito está com o grupo é Ação Livre. Uma vez por cena. Nada que exija requisição, licença ou Confiança.","patamar":"I","grau":1,"xp":2,"fonte":"Estrategista"},{"nome":"Ponto de Encontro","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Estabelecer um ponto de reagrupamento é Ação Livre, e todos que ouviram sabem onde fica mesmo sem enxergar. Um ponto por vez.","patamar":"I","grau":1,"xp":2,"fonte":"Estrategista"},{"nome":"Plano B","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Uma vez por cena, quando um aliado falha em um teste que fazia parte de um plano que você estabeleceu, ele repete o dado de Perícia. Precisa ter havido um plano dito em voz alta.","patamar":"II","grau":3,"xp":4,"fonte":"Estrategista"},{"nome":"Contagem","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você sabe sem teste quantas pessoas há em um lugar, quanto tempo falta para alguém chegar e quanto tempo o grupo tem antes de a situação virar. Não prevê o que essas pessoas vão fazer.","patamar":"II","grau":3,"xp":4,"fonte":"Estrategista"},{"nome":"Nada Improvisado","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Testes seus e de aliados para executar algo que você preparou com antecedência nunca resultam Terrível. Precisa de tempo de preparação estabelecido na ficção.","patamar":"II","grau":3,"xp":4,"fonte":"Estrategista"},{"nome":"Terreno Estudado","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Lógica para conhecer a planta de um lugar, as rotas, os pontos cegos e por onde vem reforço. Precisa de qualquer informação prévia, ainda que ruim.","patamar":"III","grau":5,"xp":6,"fonte":"Estrategista"},{"nome":"Cadeia de Favores","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Lábia por Lógica ao acionar alguém que já te deve alguma coisa. Sobre quem deve. Com estranho, você continua sendo você.","patamar":"III","grau":5,"xp":6,"fonte":"Estrategista"},{"nome":"Comando de Campo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Intimidação por Lábia para fazer um grupo obedecer uma ordem imediata em situação de perigo. Funciona uma vez por situação. Depois disso eles pensam.","patamar":"III","grau":5,"xp":6,"fonte":"Estrategista"},{"nome":"Estava no Plano","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Declare que uma complicação que acabou de aparecer estava prevista, e diga qual providência você tomou. O Narrador precisa aceitar se for plausível. Uma vez por cena.","patamar":"IV","grau":7,"xp":8,"fonte":"Estrategista"},{"nome":"Todos em Posição","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Reposicione todos os aliados que consigam ouvir você para qualquer lugar alcançável da cena, imediatamente e fora da ordem do Foco. Uma vez por cena, e cada um precisa aceitar.","patamar":"IV","grau":7,"xp":8,"fonte":"Estrategista"},{"nome":"Isso Já Estava Decidido","modo":"Ativo","carga":2,"corrupcao":0,"efeito":"Declare uma condição que já foi providenciada antes desta cena começar: uma porta destrancada, um veículo esperando, uma pessoa que não apareceu para o turno. Uma vez por arco. Não pode desfazer o que já foi mostrado na mesa.","patamar":"IV","grau":7,"xp":8,"fonte":"Estrategista"}]},{"nome":"Agitador","familia":"Regente","atributo":"influencia","resumo":"A pessoa que resolve com muitos. Não move um: usa quem já estava lá.","forma":"Ninguém Vê um Só","passiva":"Você nunca é identificado individualmente dentro de uma aglomeração. Testemunhas lembram que havia gente, e não lembram de você.","ativa":"Um grupo de desconhecidos presentes vira cobertura, obstáculo ou distração, à sua escolha, até o fim da cena. Eles não sabem que estão trabalhando para você, e nunca vão saber.","limite":"Ele depende de haver gente. Numa sala com quatro pessoas conhecidas, o Agitador não tem multidão, não tem anonimato e não tem nada.","prateleira":[{"nome":"Puxar Assunto","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Fazer uma multidão olhar para algo que não seja você é Ação Livre. Uma vez por cena, e precisa haver mais de meia dúzia de pessoas.","patamar":"I","grau":1,"xp":2,"fonte":"Agitador"},{"nome":"Sumir na Massa","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Entrar em uma aglomeração e desaparecer nela é Ação Livre. Você deixa de ser um alvo válido até agir de novo.","patamar":"I","grau":1,"xp":2,"fonte":"Agitador"},{"nome":"Boca a Boca","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Soltar uma informação em um lugar público de forma que ela circule sozinha é Ação Livre. Você não controla o formato que ela toma.","patamar":"I","grau":1,"xp":2,"fonte":"Agitador"},{"nome":"Ninguém Lembra","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Testemunhas em ambiente com gente nunca conseguem descrever você com precisão. Não funciona diante de quem já te conhecia.","patamar":"II","grau":3,"xp":4,"fonte":"Agitador"},{"nome":"Multidão Amiga","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você nunca sofre penalidade de deslocamento por gente no caminho, e nunca fica Caído por efeito que dependa de aglomeração.","patamar":"II","grau":3,"xp":4,"fonte":"Agitador"},{"nome":"Já Estavam Bravos","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Seus testes para incitar, dispersar ou redirecionar um grupo nunca resultam Terrível, desde que exista uma in entes. Cifra Catalogada continua exigindo Ação Padrão.","patamar":"I","grau":1,"xp":2,"fonte":"Geral"},{"nome":"Faro de Broto","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você sabe sem teste a direção e a distância aproximada do Local Seguro mais próximo. Não funciona em zona de Distorção alta.","patamar":"I","grau":1,"xp":2,"fonte":"Geral"},{"nome":"Bolso Fundo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Escolha um item pequeno ao comprar este Talento. Ele está sempre em um slot de Bolso, mesmo que você não tenha declarado que o trouxe. Um item só, definido uma vez e nunca trocado, e nada que seja arma de fogo.","patamar":"I","grau":1,"xp":2,"fonte":"Geral"},{"nome":"Passo Medido","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Levantar de Caído, sacar algo das Costas ou trocar a arma que está nas Mãos passa a ser Ação Livre. Uma dessas três por Foco, não as três.","patamar":"I","grau":1,"xp":2,"fonte":"Geral"},{"nome":"Boca Fechada","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você sabe sem teste o que não se pergunta em um lugar: qual assunto derruba a conversa, quem manda ali, e o que acontece se você insistir. Só em lugar com gente, e não funciona com quem já decidiu te machucar.","patamar":"I","grau":1,"xp":2,"fonte":"Geral"},{"nome":"Sangue Frio","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Testes de Propósito para resistir a medo, horror ou presença de aberração nunca resultam Terrível. Um 1 conta como Falha comum. Não vale contra Manipulação nem Cifra.","patamar":"II","grau":3,"xp":4,"fonte":"Geral"},{"nome":"Fôlego de Alma","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Toda vez que você retém Corrupção Recente, retém 1 a menos, mínimo zero. Não afeta Assentada nem Carga.","patamar":"II","grau":3,"xp":4,"fonte":"Geral"},{"nome":"Palavra Guardada","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Um Contato com uma Âncora não é registrado pela sua Afiliação. Uma vez por arco, declarado na hora e não depois.","patamar":"II","grau":3,"xp":4,"fonte":"Geral"},{"nome":"Cara de Poucos","modo":"Ativo","carga":0,"corrupcao":0,"efeito":"Uma vez por cena, você não precisa testar para que alguém acredite em uma mentira simples sobre quem você é ou o que está fazendo ali. Só funciona com quem não te conhece e não tem motivo prévio para desconfiar.","patamar":"II","grau":3,"xp":4,"fonte":"Geral"},{"nome":"Pé no Chão","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Você não pode ser derrubado, empurrado ou movido contra a vontade por efeito que não seja dano direto. Não protege contra Cifra que mova o próprio chão.","patamar":"II","grau":3,"xp":4,"fonte":"Geral"},{"nome":"Alfabetização de Campo","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Conhecimento por Domínio ao identificar uma Cifra, uma inscrição ou uma assinatura de Pilar. Só para identificar. Não permite conjurar nada.","patamar":"III","grau":5,"xp":6,"fonte":"Geral"},{"nome":"Voz Que Atravessa","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Lábia por Propósito ao falar com uma alma que não atravessou, ou com uma aberração que ainda tenha fala. A coisa precisa ser capaz de responder, e a maioria não é.","patamar":"III","grau":5,"xp":6,"fonte":"Geral"},{"nome":"Corpo Como Ferramenta","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Destreza por Atletismo em qualquer tarefa que possa ser resolvida com força em vez de precisão. O Narrador julga se cabe, e costuma quebrar o que estava sendo aberto.","patamar":"III","grau":5,"xp":6,"fonte":"Geral"},{"nome":"Cheiro de Estrada","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Percepção por Conhecimento para saber o que aconteceu em um lugar nas últimas horas. Só rastro físico. Não lê alma nem intenção.","patamar":"III","grau":5,"xp":6,"fonte":"Geral"},{"nome":"Mão que Costura","modo":"Passivo","carga":0,"corrupcao":0,"efeito":"Substitua Conhecimento por Destreza para estabilizar alguém ou tratar um ferimento no campo. Não substitui tratamento
