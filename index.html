dar, carregar coisa leve. Eles não lutam e vão embora se ficarem em perigo real."},{"nome":"Cicatriz Antiga","pilar":"Origem","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Tato","efeito":"Tocando um corpo, vivo ou morto, você sabe tudo que já feriu aquela pessoa e quando. Não diz quem fez, e não funciona em quem morreu há mais de uma semana."},{"nome":"Carne Nova","pilar":"Origem","vinculo":"Médio","tipo":"Ativa","sigilos":["Transmutar","Criar"],"gatilho":"Tato","efeito":"Um membro perdido, um órgão danificado ou um sentido destruído volta a existir ao longo de alguns dias. Precisa de contato diário. O que volta nunca é exatamente igual ao que era."},{"nome":"Segunda Boca","pilar":"Origem","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Voz","efeito":"Crie no seu corpo um órgão que ele não tinha: um olho nas costas, uma mão a mais, uma boca no antebraço. Até o fim da cena. Some depois, e as pessoas que viram não esquecem."},{"nome":"Florescimento","pilar":"Origem","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Uma área do tamanho de uma praça vira campo fértil. Toda criatura viva ali recupera 1 Ponto de Vitalidade por Foco. Cai se você sair da área, e nada volta ao que era depois."},{"nome":"Enxame Vital","pilar":"Origem","vinculo":"Médio","tipo":"Sustentada","sigilos":["Invocar"],"gatilho":"Audição","efeito":"Uma massa de criaturas pequenas ocupa uma área e a torna intransitável: quem atravessar sofre 1 Face a menos em tudo até sair. Elas não causam dano e se dispersam se atacadas com fogo ou área."},{"nome":"Amigo Místico","pilar":"Origem","vinculo":"Médio","tipo":"Sustentada","sigilos":["Invocar","Proclamar"],"gatilho":"Voz","efeito":"Invoque um companheiro etéreo com forma própria, que age nos seus Focos e obedece ordens ditas. Ele não conjura. Enquanto ele existir, você não pode sustentar outra Cifra."},{"nome":"Empréstimo de Anos","pilar":"Origem","vinculo":"Médio","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Você envelhece alguns anos e outra pessoa rejuvenesce a mesma quantidade. É permanente para os dois. O Narrador decide o que isso faz com um corpo velho demais."},{"nome":"Barreira Viva","pilar":"Origem","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar","Bloquear"],"gatilho":"Visão","efeito":"Uma parede de matéria viva cresce onde você apontar, do tamanho de um corredor. Bloqueia passagem e visão. Pode ser cortada, queimada ou escalada com tempo."},{"nome":"Retorno","pilar":"Origem","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar","Criar"],"gatilho":"Voz","efeito":"Alguém que morreu nesta cena volta a viver, no nível 1 de Vitalidade. A alma precisa não ter atravessado ainda, o que depois da última onda quase sempre é verdade. Ela volta sem uma coisa, e o Narrador escolhe qual."},{"nome":"Berço","pilar":"Origem","vinculo":"Alto","tipo":"Sustentada","sigilos":["Criar","Proclamar"],"gatilho":"Voz","efeito":"Até o fim da cena, nada dentro do raio de uma sala grande pode ser reduzido ao nível 0 de Vitalidade. Vale para inimigos. O Pilar não distingue quem merece viver."},{"nome":"Genealogia","pilar":"Origem","vinculo":"Alto","tipo":"Ativa","sigilos":["Sentir","Proclamar"],"gatilho":"Tato","efeito":"Tocando alguém, você conhece a linhagem daquela pessoa inteira, geração por geração, até onde o sangue lembra. Descobre o que foi escondido, o que foi registrado errado, e de qual dos três povos do Prelúdio aquele corpo desceu. Funciona em vivo e em morto recente. O que você descobre não sai da sua cabeça, e algumas famílias matam por menos."},{"nome":"A Primeira Palavra","pilar":"Origem","vinculo":"Alto","tipo":"Ativa","sigilos":["Criar","Proclamar"],"gatilho":"Voz","efeito":"Crie vida nova, com corpo próprio e vontade própria, que existe depois que você for embora. O Narrador constrói junto com você. Ela não te obedece, não te agradece, e não some. Uma vez por arco, e você vai ter que conviver com o que fez."},{"nome":"Estancar","pilar":"Extinção","vinculo":"Baixo","tipo":"Ativa","sigilos":["Bloquear"],"gatilho":"Tato","efeito":"Um efeito contínuo que esteja agindo sobre o alvo tocado para. Sangramento, veneno, queimadura, fogo, Cifra sustentada de Vínculo Baixo. Uma coisa por vez, e o dano já sofrido continua sofrido."},{"nome":"Última Hora","pilar":"Extinção","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Visão","efeito":"Olhando um corpo morto, você sabe quando morreu, do quê, e qual foi a última coisa que ele percebeu. Não mostra rosto de assassino, e não funciona depois que a alma atravessa."},{"nome":"Ponto Final","pilar":"Extinção","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Uma conversa, uma negociação ou uma discussão acaba. Todos os presentes param de falar sobre aquilo e não voltam ao assunto nesta cena. Não impede ninguém de agir. Só de continuar dizendo."},{"nome":"Ferrugem","pilar":"Extinção","vinculo":"Baixo","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Um objeto envelhece décadas em um Foco. Metal cede, corda apodrece, fechadura se desfaz. Só objeto sem alma dentro, e não funciona em Item Espiritual."},{"nome":"Passagem","pilar":"Extinção","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Uma alma que não atravessou finalmente atravessa. Ela some, em paz, e não vira Distorção. Uma alma por vez, e ela precisa querer. Muitas não querem."},{"nome":"Apagar Rastro","pilar":"Extinção","vinculo":"Baixo","tipo":"Ativa","sigilos":["Bloquear","Transmutar"],"gatilho":"Tato","efeito":"Tudo que indica que alguém esteve em um lugar deixa de existir: pegada, cheiro, fio de cabelo, calor no assento. Não apaga o que foi visto por gente, nem o que foi registrado por máquina."},{"nome":"Peso do Fim","pilar":"Extinção","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Sentir"],"gatilho":"Visão","efeito":"Até o fim da cena, você sabe quantos Pontos de Vitalidade cada criatura visível ainda tem. Não funciona no que não pode morrer."},{"nome":"Corte Seco","pilar":"Extinção","vinculo":"Baixo","tipo":"Reação","sigilos":["Bloquear"],"gatilho":"Tato","efeito":"Quando uma Cifra sustentada de outra pessoa entrar no seu alcance, ela cai. Uma vez por cena, e só Vínculo Baixo."},{"nome":"Silêncio de Um","pilar":"Extinção","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Bloquear"],"gatilho":"Audição","efeito":"Um alvo à sua vista deixa de produzir qualquer som, incluindo a voz. Até o fim da cena. Ele continua conseguindo articular Cifras que não dependam de voz."},{"nome":"Encerrar","pilar":"Extinção","vinculo":"Médio","tipo":"Ativa","sigilos":["Bloquear","Proclamar"],"gatilho":"Voz","efeito":"Qualquer Cifra sustentada, invocação ou efeito contínuo à sua vista termina. Vínculo Médio ou menor. Contra Vínculo Alto, você precisa vencer um teste oposto de Domínio."},{"nome":"Herdeiro de Ninguém","pilar":"Extinção","vinculo":"Médio","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Um objeto perde a ligação com o dono anterior. Item Espiritual vinculado se solta, arma marcada deixa de ser marcada, herança deixa de reconhecer sangue. Permanente, e ninguém consegue refazer o vínculo antigo."},{"nome":"A Coisa Que Você Não Lembra","pilar":"Extinção","vinculo":"Médio","tipo":"Ativa","sigilos":["Bloquear"],"gatilho":"Voz","efeito":"Um alvo esquece um evento específico dos últimos dias. Ele não sente falta, e nada dentro dele indica que houve apagamento. Um evento por alvo. Se alguém contar de novo, ele acredita."},{"nome":"Corte do Véu","pilar":"Extinção","vinculo":"Médio","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Uma criatura etérea ou aberração passa a ter corpo pelo resto da cena. Pode ser ferida por matéria comum, e também pode ser presa, agarrada e derrubada. Contra o que já tinha corpo, não faz nada."},{"nome":"Erosão","pilar":"Extinção","vinculo":"Médio","tipo":"Sustentada","sigilos":["Transmutar"],"gatilho":"Visão","efeito":"Uma estrutura à sua vista começa a ceder: parede racha, viga entorta, chão afunda. Ela desaba ao fim de alguns Focos, e todo mundo percebe que está desabando. Não funciona no que estiver sob outra Cifra."},{"nome":"Aceitar","pilar":"Extinção","vinculo":"Médio","tipo":"Ativa","sigilos":["Sentir","Proclamar"],"gatilho":"Tato","efeito":"Um alvo tocado para de resistir a uma coisa que ele já perdeu: um luto, um vício, uma obsessão, uma perseguição. Por um dia, aquilo não pesa. É alívio, não cura, e volta."},{"nome":"Sepultura Portátil","pilar":"Extinção","vinculo":"Médio","tipo":"Sustentada","sigilos":["Bloquear","Criar"],"gatilho":"Tato","efeito":"Um corpo morto não apodrece, não é detectado e não solta a alma enquanto durar. Você carrega. Enquanto sustentar, a alma dentro não atravessa, e ela sabe disso."},{"nome":"A Última Frase","pilar":"Extinção","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare que uma coisa acabou, e ela acaba: uma Cifra de qualquer Vínculo, uma invocação, um Labirinto Próprio projetado, um efeito que dure. Não funciona contra pessoa. Uma vez por cena."},{"nome":"Corvino Escuta","pilar":"Extinção","vinculo":"Alto","tipo":"Ativa","sigilos":["Sentir","Proclamar"],"gatilho":"Audição","efeito":"Faça três perguntas a alguém que morreu no local onde você está. Ela responde com verdade, e responde de má vontade. A alma precisa não ter atravessado. Uma vez por arco."},{"nome":"Ceifa","pilar":"Extinção","vinculo":"Alto","tipo":"Ativa","sigilos":["Bloquear","Proclamar"],"gatilho":"Visão","efeito":"Uma criatura à sua vista que já esteja no nível 1 de Vitalidade termina. Sem teste, sem reação, sem dano. Não funciona em quem estiver acima do nível 1, e você retém o dobro da Corrupção do teste de Domínio."},{"nome":"Esquecido","pilar":"Extinção","vinculo":"Alto","tipo":"Ativa","sigilos":["Bloquear","Proclamar"],"gatilho":"Voz","efeito":"Uma pessoa deixa de existir na memória do mundo por um arco: registros ficam ilegíveis, conhecidos não a reconhecem, o nome dela some das listas. Ela continua existindo fisicamente, e sabe exatamente o que aconteceu. Uma vez por arco, e pode ser usada em você mesmo."},{"nome":"Selo Menor","pilar":"Controle","vinculo":"Baixo","tipo":"Ativa","sigilos":["Bloquear"],"gatilho":"Tato","efeito":"Uma porta, tampa, recipiente ou fechadura fica selada. Abrir exige vencer um teste oposto contra o seu Domínio. Um selo por vez, e você sabe no instante em que alguém tenta."},{"nome":"Cláusula","pilar":"Controle","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare uma regra simples e verificável em voz alta. Quem violar a regra sofre 1 Face a menos na ação que a violou. Vale para você também, e vale até o fim da cena."},{"nome":"Marca de Registro","pilar":"Controle","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar","Sentir"],"gatilho":"Visão","efeito":"Marque um objeto ou um lugar. Você sabe, a qualquer distância, se ele foi movido, aberto ou tocado, e quantas vezes. Não diz por quem. Dura até você marcar outra coisa."},{"nome":"Linha","pilar":"Controle","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Criar","Bloquear"],"gatilho":"Visão","efeito":"Trace uma linha no chão do comprimento de um corredor. Atravessar exige uma Ação Padrão e um teste oposto contra o seu Domínio. A linha é visível para todos, e é isso que a torna eficaz."},{"nome":"Inventário","pilar":"Controle","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Visão","efeito":"Você sabe tudo que uma pessoa à sua vista está carregando e em qual slot do corpo. Não diz o que as coisas fazem, e não vê o que estiver dentro de um Selo."},{"nome":"Ordem de Marcha","pilar":"Controle","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare em que ordem os aliados vão agir na próxima rodada. Eles agem nessa ordem, ignorando o passe de Foco, desde que todos aceitem. Uma vez por cena."},{"nome":"Palavra Dada","pilar":"Controle","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Duas partes declaram um acordo em voz alta. A partir daí, as duas sabem imediatamente se a outra quebrou o combinado, onde estiverem. Não impede ninguém de quebrar. Só torna impossível esconder."},{"nome":"Prumo","pilar":"Controle","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Tato","efeito":"Tocando qualquer coisa construída, você sabe se ela está dentro da norma, se foi adulterada, e onde. Vale para estrutura, documento, mecanismo e Cifra inscrita."},{"nome":"Trava","pilar":"Controle","vinculo":"Baixo","tipo":"Reação","sigilos":["Bloquear"],"gatilho":"Tato","efeito":"Quando um mecanismo ao seu alcance for acionado por outra pessoa, ele não é. A arma não dispara, a porta não abre, o botão não responde. Uma vez por cena, e só mecanismo, nunca corpo."},{"nome":"Depoimento","pilar":"Controle","vinculo":"Médio","tipo":"Ativa","sigilos":["Proclamar","Sentir"],"gatilho":"Voz","efeito":"Declare que o alvo está sob depoimento. Ele fica sabendo. A partir daí, ele não consegue dizer nada que saiba ser falso, e você faz três perguntas. Ele continua dono das próprias palavras. Pode escolher o que enfatizar, pode responder de um jeito tecnicamente verdadeiro e completamente inútil, pode responder outra pergunta que você não fez, e pode simplesmente calar. O silêncio é permitido. O que ele não pode é mentir. E você percebe cada vez que ele cala, e sobre o quê. Um alvo por cena, e ele lembra de tudo depois."},{"nome":"Jurisdição","pilar":"Controle","vinculo":"Médio","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare uma regra e uma área do tamanho de um salão. Dentro dela, quem violar a regra sofre 2 Faces a menos e você sabe imediatamente quem foi. Vale para você. Cai se você sair da área."},{"nome":"Protocolo","pilar":"Controle","vinculo":"Médio","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Todos os aliados que ouvirem executam a mesma ação combinada ao mesmo tempo, fora da ordem do Foco. Precisa ser uma ação simples e igual para todos, e cada um precisa ser capaz de fazê la."},{"nome":"Confisco","pilar":"Controle","vinculo":"Médio","tipo":"Ativa","sigilos":["Bloquear","Transmutar"],"gatilho":"Tato","efeito":"Um objeto para de funcionar para qualquer pessoa que não seja você. Arma não dispara, ferramenta não corta, Item Espiritual fica inerte. Dura um dia, e o dono percebe na hora."},{"nome":"Precedente","pilar":"Controle","vinculo":"Médio","tipo":"Ativa","sigilos":["Sentir","Proclamar"],"gatilho":"Audição","efeito":"Sobre qualquer regra, lei ou norma, você sabe quem já a violou naquele lugar, quantas vezes, e o que aconteceu com essas pessoas. Só sobre regra escrita ou publicamente conhecida."},{"nome":"Suspensão","pilar":"Controle","vinculo":"Médio","tipo":"Sustentada","sigilos":["Bloquear"],"gatilho":"Visão","efeito":"Uma criatura à sua vista fica presa repetindo o último ato que iniciou, sem completar nunca. Ela percebe, e não consegue parar. Vence um teste oposto de Propósito por Foco para sair."},{"nome":"Cadeia","pilar":"Controle","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar","Bloquear"],"gatilho":"Visão","efeito":"Correntes etéreas prendem um alvo, que fica Imobilizado. Sair exige vencer um teste oposto contra o seu Domínio como Ação Padrão. Cai se você conjurar outra coisa."},{"nome":"A Lei","pilar":"Controle","vinculo":"Alto","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare uma regra. Dentro do alcance da sua voz, ela não é violável: quem tentar simplesmente não consegue completar a ação. A regra precisa ser uma proibição concreta, não uma obrigação, e vale para você sem exceção. Até o fim da cena."},{"nome":"Réu","pilar":"Controle","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar","Bloquear"],"gatilho":"Visão","efeito":"Declare uma categoria de ação e um alvo. Por um arco inteiro, aquela pessoa não consegue fazer aquilo. Não mentir, não sair de uma cidade, não tocar em arma, não conjurar. Ela sabe, todo mundo que olhar sabe, e ela vai passar o arco tentando reverter. Uma vez por arco."},{"nome":"Contrato Absoluto","pilar":"Controle","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Duas partes que consentem em voz alta ficam presas a um acordo. Quem quebrar perde um nível de Vitalidade permanentemente e o outro fica sabendo. Precisa de consentimento real dos dois. Ninguém consegue conjurar isso em quem não concordou."},{"nome":"Arquivo","pilar":"Controle","vinculo":"Alto","tipo":"Ativa","sigilos":["Sentir","Proclamar"],"gatilho":"Tato","efeito":"Tocando uma pessoa, você lê tudo que já foi oficialmente registrado sobre ela: nome verdadeiro, Afiliação, Confiança, ocorrências, o que a Cúpula guarda e o que o Olho anotou. Você não lê o que ela é. Lê o que escreveram sobre ela, o que às vezes é pior. Uma vez por arco."},{"nome":"Sussurro","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Audição","efeito":"Você ouve, na voz da própria pessoa, a coisa que um alvo à sua vista está temendo neste momento. Só o medo imediato, nunca o profundo. Ele não percebe."},{"nome":"Vulto","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Crie uma figura silenciosa e imóvel onde você conseguir ver. Ela não faz som, não deixa marca e não interage. Quem tocar percebe que não é nada. Até o fim da cena."},{"nome":"Eco","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Ativa","sigilos":["Criar"],"gatilho":"Audição","efeito":"Um som acontece em um ponto à sua escolha dentro do alcance da voz. Passos, tiro, choro, alguém chamando por um nome. Não pode ser mais alto do que um grito."},{"nome":"Rosto Errado","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Transmutar"],"gatilho":"Visão","efeito":"Por uma cena, quem olha para você não consegue fixar seus traços. Descrições saem contraditórias, retratos não fecham, testemunhas discordam. Você continua visível."},{"nome":"Insônia","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Um alvo não consegue dormir pelo resto da noite, por mais exausto que esteja. Uma noite por uso, e ele nunca associa isso a você."},{"nome":"Presságio","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Visão","efeito":"Você sente que algo ruim vai acontecer em breve e de qual direção vem. Não diz o quê nem quando. Se não houver nada vindo, você sente isso também."},{"nome":"Grito","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Um alvo que consiga ouvir você sofre 1 Face a menos na próxima ação dele. Não funciona duas vezes na mesma pessoa na mesma cena."},{"nome":"Coisa no Canto","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Um alvo passa a ver alguma coisa no canto do olho que some quando ele olha direto. Testes de Percepção dele sofrem 1 Face a menos até o fim da cena. Ele sabe que é Cifra e isso não ajuda."},{"nome":"Ninar","pilar":"Pesadelo","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Audição","efeito":"Alguém que já esteja exausto, ferido ou drogado adormece. Não funciona em quem está alerta, e qualquer barulho alto acorda."},{"nome":"Confidência","pilar":"Pesadelo","vinculo":"Médio","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Tato","efeito":"Você entra na cabeça do alvo sem avisar e colhe o que quiser sobre um assunto: o que ele sabe, o que ele esconde, o que ele decidiu não contar a ninguém. Ele não é perguntado. Ele não responde. Ele não fica sabendo, nem durante nem depois. Você lê e sai. O que você tira vem cru, do jeito que estava guardado, e coisa guardada raramente está organizada. O Narrador entrega a informação com as lacunas e as distorções que aquela pessoa carrega, porque é isso que está lá dentro. Um alvo por cena, e você precisa estar tocando ele."},{"nome":"Segunda Cena","pilar":"Pesadelo","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar","Proclamar"],"gatilho":"Visão","efeito":"Escolha um personagem que possa ver ou ouvir você e descreva a cena como ele passa a percebê la. Até o fim do seu próximo Foco, é isso que existe para ele, e ele age de acordo. Dano ou choque forte quebra imediatamente."},{"nome":"Pavor","pilar":"Pesadelo","vinculo":"Médio","tipo":"Ativa","sigilos":["Proclamar","Sentir"],"gatilho":"Voz","efeito":"Um alvo encara aquilo que evita pensar. Ele fica Provocado por quem quer que esteja mais perto dele, ou foge, à escolha dele. Vence um teste de Propósito para sair. Não funciona no que não tem memória."},{"nome":"Sonho Compartilhado","pilar":"Pesadelo","vinculo":"Médio","tipo":"Ativa","sigilos":["Criar","Proclamar"],"gatilho":"Audição","efeito":"Você entra no sono de alguém que já viu você e conversa. O que for combinado ali vale ao acordar, e nenhum dos dois consegue provar que aconteceu. A pessoa precisa estar dormindo de verdade."},{"nome":"Delírio","pilar":"Pesadelo","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Uma área do tamanho de um salão fica sem confiabilidade: portas mudam de lugar, vozes vêm do lado errado, distâncias mentem. Testes de Percepção e de Movimentação ali sofrem 1 Face a menos. Vale para você."},{"nome":"Esperança","pilar":"Pesadelo","vinculo":"Médio","tipo":"Ativa","sigilos":["Criar","Proclamar"],"gatilho":"Voz","efeito":"Todos os aliados que ouvirem recebem 1 Face em todos os testes até o fim da rodada. Uma vez por cena. É a única Cifra de Pesadelo que não machuca ninguém, e é a mais difícil de explicar para quem pergunta de qual Pilar ela é."},{"nome":"O Que Você Queria","pilar":"Pesadelo","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Um alvo vê, em algum ponto da cena, a coisa que ele mais deseja, e ela parece alcançável. Ele sabe que pode ser mentira e vai assim mesmo. Quebra ao ser tocada."},{"nome":"A Fantasia","pilar":"Pesadelo","vinculo":"Alto","tipo":"Sustentada","sigilos":["Criar","Proclamar"],"gatilho":"Voz","efeito":"Uma área do tamanho de um quarteirão entra em um sonho. Você define as regras daquele sonho ao conjurar, e todos dentro obedecem a essas regras sem perceber que estão obedecendo. Até o fim da cena, ou até alguém acordar. Uma vez por arco, e vale para você."},{"nome":"Terror","pilar":"Pesadelo","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Visão","efeito":"Um alvo à sua vista foge e continua fugindo até o fim da cena, e não consegue voltar nem se aproximar do lugar. Ele não escolhe a direção. Não funciona em quem não tem para onde ir, e essas pessoas são as piores de encurralar."},{"nome":"Casa Dele","pilar":"Pesadelo","vinculo":"Alto","tipo":"Ativa","sigilos":["Sentir","Invocar"],"gatilho":"Tato","efeito":"Você entra no Labirinto Próprio de outra pessoa, esteja ela projetando ou não. Vê o que ela é por dentro, e ela vê que você está lá. Sair exige que um dos dois queira. Uma vez por arco, e ninguém sai da experiência achando a mesma coisa sobre a outra pessoa."},{"nome":"Acordar","pilar":"Pesadelo","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Tudo que dependa de sonho, ilusão, delírio, medo imposto ou crença induzida à sua vista termina imediatamente, de qualquer Vínculo, inclusive as suas. Ninguém resiste. Uma vez por cena, e é a Cifra que a Penumbra proíbe os próprios membros de aprender."},{"nome":"Fagulha Vermelha","pilar":"Tormento","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Tato","efeito":"Uma chama vermelha escura nasce onde você tocar e queima por dois Focos, causando 1d6 de dano por Foco a quem estiver em contato. Não pode ser apagada por meio comum. Enquanto durar, você perde 1 Ponto de Vitalidade por Foco. Dispensar é Ação Livre."},{"nome":"Ranger","pilar":"Tormento","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Audição","efeito":"Você sabe quem na cena está com mais raiva, com mais dor e mais perto de quebrar. Os três podem ser pessoas diferentes. Não diz o motivo."},{"nome":"Estilhaço","pilar":"Tormento","vinculo":"Baixo","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Um objeto que você toca se despedaça em fragmentos cortantes que atingem todo mundo adjacente a ele, causando 1d6. Precisa ser algo rígido, e você perde o objeto."},{"nome":"Marca de Dor","pilar":"Tormento","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Tato","efeito":"Até o fim da cena, o alvo tocado sente em dobro qualquer dor que sofrer. Testes dele para resistir a dor sofrem 2 Faces a menos. Não aumenta o dano recebido. Só o que ele sente."},{"nome":"Não Recua","pilar":"Tormento","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Um alvo que ouça você não consegue recuar, fugir nem se render nesta cena. Vale para inimigo e para aliado, e quem escolhe é você."},{"nome":"Fúria Curta","pilar":"Tormento","vinculo":"Baixo","tipo":"Ativa","sigilos":["Criar"],"gatilho":"Voz","efeito":"Até o fim da rodada, você recebe 1 Face em ataques e sofre 1 Face a menos em reações. Não pode ser conjurada duas vezes seguidas."},{"nome":"Cicatriz Aberta","pilar":"Tormento","vinculo":"Baixo","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Uma ferida que já foi curada se abre de novo. O alvo perde 2 Pontos de Vitalidade e não pode ser tratado por Cifra pelo resto da cena. Precisa haver uma cicatriz."},{"nome":"Grito de Guerra","pilar":"Tormento","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Audição","efeito":"Todos os aliados que ouvirem removem imediatamente Provocado, medo e qualquer efeito que os faça hesitar. Uma vez por cena, e todo mundo num raio grande escuta você."},{"nome":"Ferro Quente","pilar":"Tormento","vinculo":"Baixo","tipo":"Sustentada","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"A arma branca que você empunha fica em brasa. Ela causa 2 de dano a mais e cauteriza: quem for ferido por ela não pode ser tratado por Cifra até o fim da cena. Só arma branca."},{"nome":"Chamas Vermelhas","pilar":"Tormento","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar","Proclamar"],"gatilho":"Tato","efeito":"As Chamas nascem onde você tocar e não param sozinhas. A cada Foco, causam 1d10 a tudo que estiver em contato e se espalham para uma coisa adjacente, à escolha do Narrador, não à sua. Elas não distinguem o que queimam. Aliado, cobertura, refém, você. Enquanto durar, você perde 1 Ponto de Vitalidade por Foco. Dispensar é Ação Livre, e o que já pegou continua queimando até consumir o que pegou."},{"nome":"Euforia","pilar":"Tormento","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Voz","efeito":"Uma área do tamanho de um salão: ninguém dentro consegue recuar, esperar, se render ou passar um Foco sem agir. Todos recebem 1 Face em ataque e 1 Face a menos em reação. Vale para você, e cai se você sair."},{"nome":"Desespero","pilar":"Tormento","vinculo":"Médio","tipo":"Ativa","sigilos":["Proclamar","Sentir"],"gatilho":"Visão","efeito":"Um alvo à sua vista perde a esperança de resolver aquilo. Ele sofre 2 Faces a menos e não pode usar Ação Livre nenhuma até o fim da cena. Vence um teste de Propósito por Foco para sair. Não funciona em quem já perdeu tudo."},{"nome":"Ruína","pilar":"Tormento","vinculo":"Médio","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Visão","efeito":"Uma estrutura à sua vista desaba: parede, ponte, escada, veículo parado. Quem estiver em cima ou embaixo sofre 2d10 e fica Caído. Não funciona no que estiver sustentado por outra Cifra."},{"nome":"Sangue por Sangue","pilar":"Tormento","vinculo":"Médio","tipo":"Sustentada","sigilos":["Transmutar"],"gatilho":"Tato","efeito":"Até o fim da cena, todo Ponto de Vitalidade que você perder vira 1 de dano no último inimigo que te feriu, onde quer que ele esteja. Ele sabe de onde vem. Não funciona se você não estiver perdendo nada."},{"nome":"Nada a Perder","pilar":"Tormento","vinculo":"Médio","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Até o fim da cena, você recebe 1 Face em tudo para cada nível de Vitalidade abaixo de Saudável em que estiver. No nível 1 você não recebe nada, porque no nível 1 ninguém recebe nada."},{"nome":"Tempestade Curta","pilar":"Tormento","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Uma área do tamanho de um cômodo é castigada por vento, estilhaço e brasa. Quem começar um Foco ali sofre 1d10. Você escolhe a área, não escolhe quem entra, e ela não se move."},{"nome":"O Que Não Se Apaga","pilar":"Tormento","vinculo":"Alto","tipo":"Sustentada","sigilos":["Criar","Proclamar"],"gatilho":"Tato","efeito":"As Chamas Vermelhas nascem e não obedecem a você. A cada Foco causam 2d10, se espalham para duas coisas adjacentes, e não podem ser dispensadas. Elas param quando não sobrar nada ao alcance para queimar, ou quando você cair no nível 1 de Vitalidade. Enquanto durar, você perde 2 Pontos de Vitalidade por Foco. Uma vez por arco. Ninguém conjura isso duas vezes na mesma semana, e quem conjura uma vez costuma ser lembrado por isso."},{"nome":"Colapso","pilar":"Tormento","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Visão","efeito":"Toda Cifra sustentada, invocação, barreira, cobertura e estrutura dentro do alcance da sua voz desaba ao mesmo tempo. Cada criatura na área sofre 2d12 e fica Caída. Vale para as suas. Uma vez por cena."},{"nome":"O Fundo","pilar":"Tormento","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar","Sentir"],"gatilho":"Voz","efeito":"Um alvo à sua vista volta ao pior momento da vida dele e fica lá até o fim da cena. Ele não age, não reage e não percebe o que acontece em volta. Uma vez por arco. O Narrador decide o que aquela pessoa carrega, e a mesa fica sabendo junto com ela."},{"nome":"Resposta de Tormento","pilar":"Tormento","vinculo":"Alto","tipo":"Ativa","sigilos":["Invocar","Proclamar"],"gatilho":"Voz","efeito":"Até o fim da cena você não erra: todos os seus ataques acertam sem teste, causam o dobro do dano, e nenhuma reação funciona contra você. Ao fim da cena você perde dois três de Vitalidade e retém 4 de Corrupção Assentada. Não existe teste, escolha ou Talento que reduza isso."},{"nome":"Moeda Guardada","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir","Proclamar"],"gatilho":"Tato","efeito":"Role um dado agora, do tamanho que você quiser entre os que sabe rolar, e guarde o resultado. Até o fim da cena, você pode usar esse resultado no lugar de um dado de qualquer teste seu. Um resultado guardado por vez, e você não pode olhar de novo antes de decidir."},{"nome":"Tropeço","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Visão","efeito":"Um acidente pequeno acontece com um alvo à sua vista: o pé escorrega, a alça arrebenta, a mira treme. Ele sofre 1 Face a menos na ação atual, ou fica Caído se estiver em movimento. À escolha do Narrador, não sua."},{"nome":"Coincidência","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare uma coincidência pequena e plausível, e ela já aconteceu. A porta estava destrancada. O guarda foi ao banheiro. Havia um cabo daquele tipo na caixa. Uma por cena, e o Narrador pode recusar se não for plausível, nunca se for apenas inconveniente."},{"nome":"Mão Torta","pilar":"Causalidade","vinculo":"Baixo","tipo":"Reação","sigilos":["Bloquear"],"gatilho":"Visão","efeito":"Um objeto falha na mão de alguém que você consiga ver: trava, escorrega, cai, emperra. A ação que dependia dele não acontece. Uma vez por cena, e não funciona em nada que não seja objeto."},{"nome":"Dedo no Ar","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Visão","efeito":"Dadas duas opções concretas, você sabe qual tem mais chance de dar certo. Não sabe o quanto, e não sabe o que vai dar errado na que você escolher."},{"nome":"Sorte de Principiante","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Criar"],"gatilho":"Tato","efeito":"Seu próximo teste em uma perícia na qual você tem especialização 0 rola o dado de Atributo duas vezes, e você usa os dois. Só em perícia que você não treinou. Uma vez por cena."},{"nome":"Fio Solto","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Sentir"],"gatilho":"Tato","efeito":"Você percebe qual detalhe desta cena vai dar errado. O Narrador diz qual, e não diz como nem quando. Uma vez por cena."},{"nome":"Ricochete","pilar":"Causalidade","vinculo":"Baixo","tipo":"Reação","sigilos":["Transmutar"],"gatilho":"Visão","efeito":"Um ataque à distância que acabou de errar acerta outra coisa. O Narrador escolhe o quê, entre alvos plausíveis, e pode escolher você. Uma vez por cena."},{"nome":"Aposta Pequena","pilar":"Causalidade","vinculo":"Baixo","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare em voz alta um resultado específico que você espera desta cena. Se acontecer, você recebe 1 Face em tudo pelo resto dela. Se não acontecer, sofre 1 Face a menos. Uma aposta por cena, e você não pode apostar em algo que já esteja decidido."},{"nome":"Redistribuição","pilar":"Causalidade","vinculo":"Médio","tipo":"Ativa","sigilos":["Transmutar"],"gatilho":"Visão","efeito":"Troque entre si os resultados de dois testes que já foram rolados nesta cena, seus ou de outras pessoas. Os efeitos são recalculados. Uma vez por cena, e os dois testes precisam já ter sido narrados, não apenas rolados."},{"nome":"Roleta","pilar":"Causalidade","vinculo":"Médio","tipo":"Sustentada","sigilos":["Criar"],"gatilho":"Visão","efeito":"Uma área do tamanho de um salão: todo Terrível conta como Sucesso Duplo e todo Sucesso Duplo conta como Terrível, para todo mundo. Até o fim da cena. Vale para você, e ninguém dentro consegue prever nada."},{"nome":"A Culpa é de Outro","pilar":"Causalidade","vinculo":"Médio","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Uma consequência que acabou de recair sobre você recai sobre outra pessoa presente. O dano, a condição, a queda, a acusação. Uma vez por cena, e a pessoa precisa estar em posição de plausivelmente ter sido a causa."},{"nome":"Improviso","pilar":"Causalidade","vinculo":"Médio","tipo":"Ativa","sigilos":["Criar","Transmutar"],"gatilho":"Tato","efeito":"O que estiver na sua mão vira a coisa que você precisava agora. Uma chave, uma corda, uma bandagem, uma arma improvisada. Dura uma cena e depois volta a ser o que era. Não vira nada que dependa de mecanismo fino nem de munição."},{"nome":"Duas Vezes o Mesmo Dia","pilar":"Causalidade","vinculo":"Médio","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"O último Foco que aconteceu, de qualquer pessoa, acontece de novo. Quem agiu age outra vez, e pode agir diferente. Uma vez por cena, e você não escolhe de quem é o Foco: é sempre o último."},{"nome":"Cadeia de Acidentes","pilar":"Causalidade","vinculo":"Médio","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Visão","efeito":"Até o fim da cena, toda vez que alguém falhar em um teste dentro da sua vista, um acidente adicional acontece com essa pessoa. O Narrador narra. Vale para você e para os seus."},{"nome":"Empurrão do Acaso","pilar":"Causalidade","vinculo":"Médio","tipo":"Ativa","sigilos":["Invocar"],"gatilho":"Voz","efeito":"Alguma coisa que não estava prevista chega à cena agora. Uma pessoa, um veículo, um animal, uma patrulha, um desabamento. O Narrador decide o quê e de que lado. Uma vez por arco."},{"nome":"O Dado em Queda","pilar":"Causalidade","vinculo":"Alto","tipo":"Sustentada","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Até o fim da cena, antes de cada teste seu, declare se quer o melhor ou o pior resultado possível. Escolhendo o melhor, ambos os dados contam como Sucesso Duplo. Escolhendo o pior, ambos contam como Terrível, e você guarda uma escolha de melhor para usar depois. Você precisa escolher pior pelo menos uma vez a cada três testes. Se recusar, a Cifra cai e você retém 3 de Corrupção Assentada."},{"nome":"Isso Nunca Aconteceu","pilar":"Causalidade","vinculo":"Alto","tipo":"Ativa","sigilos":["Bloquear","Proclamar"],"gatilho":"Voz","efeito":"O último Foco inteiro é desfeito. Ninguém agiu, nada foi rolado, nada aconteceu, e a pessoa que tinha o Foco o recebe de novo. Uma vez por arco. Só você lembra do que foi desfeito, e você lembra para sempre."},{"nome":"Convergência","pilar":"Causalidade","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar","Sentir"],"gatilho":"Visão","efeito":"Declare que três coisas separadas que já existiam na ficção se encontram agora, neste lugar. O Narrador escolhe quais três, entre coisas que a mesa já conhece, e organiza o encontro. Uma vez por arco. Pode ser a melhor coisa que já te aconteceu."},{"nome":"Togata Aposta","pilar":"Causalidade","vinculo":"Alto","tipo":"Ativa","sigilos":["Proclamar"],"gatilho":"Voz","efeito":"Declare o que você quer que aconteça, sem limite de escala. O Narrador rola um único dado escondido. Se sair alto, acontece exatamente como você pediu. Se sair baixo, acontece o contrário exato, com o mesmo tamanho. Você não sabe qual foi o resultado até ver. Uma vez por arco, e nenhuma Cifra, Talento, Bênção ou Traço altera essa rolagem. Togata não trapaceia, e não deixa ninguém trapacear."}],"antecedentes":[{"nome":"Guia de Luz","resumo":"Você conduzia o rito. Crema o corpo, recolhe as cinzas, leva ao lugar que mais importou, enterra e canta em língua antiga. Exige diploma, exige registro na Sociedade dos Ceifadores, e não pode ser exercido antes dos vinte e um anos. Você cobrava caro e sabia exatamente o que significava a família que não tinha como pagar. Toda vez, você sabia.","pericia":"Propósito","conhecimento":"Ritos","habilidade":"Ofício da Passagem","efeito":"Você enxerga há quanto tempo uma alma está presa, sem teste. Uma vez por Foco, pode dirigir a palavra a uma que esteja à vista e obter uma resposta curta, ainda que ela não queira responder. Depois da última onda, a fila ficou mais longa, e elas sabem disso."},{"nome":"Colhedor","resumo":"Você tinha licença. Subia nos brotos da Árvore antes do sol e voltava com silvário na mochila, sabendo que a folha bruta mata e que o óleo paga o mês. O trabalho é legal, é fiscalizado, e existe extração ilegal na mesma encosta em que você trabalhava. Você aprendeu a reconhecer os dois de longe.","pericia":"Destreza","conhecimento":"Silvário","habilidade":"Mão Calejada","efeito":"Você manuseia folha bruta sem se envenenar, e identifica óleo adulterado pelo cheiro, sem teste. Uma vez por Foco, pode dizer se uma planta, um broto ou um solo foi tocado por alma recente."},{"nome":"Acadêmico","resumo":"Universidade, arquivo, campo. Você passou anos aprendendo a diferença entre o que está documentado e o que é verdadeiro, e descobriu que essas duas coisas quase nunca coincidem por completo. Depois da última onda o setor acadêmico cresceu, e você sabe por quê: ninguém entende o que aconteceu, e entender virou emprego.","pericia":"Lógica","conhecimento":"Arquivo","habilidade":"Fundamentado","efeito":"Uma vez por Foco, declare a fonte, um texto, um método, uma pesquisa, e você não precisa testar para lembrar de algo que está documentado em algum lugar. O Narrador diz o que a fonte dizia. Se a fonte estiver errada, você repete o erro com confiança."},{"nome":"Operário","resumo":"Chão de fábrica. Turno, crachá, três gerações no mesmo tipo de trabalho. Mendro fabrica o instrumental de todo mundo, entrega no prazo, e sabe uma coisa que não pode dizer. Você provavelmente montou, com as próprias mãos, alguma peça do equipamento que hoje carrega.","pericia":"Fortitude","conhecimento":"Manufatura","habilidade":"Linha de Montagem","efeito":"Olhando qualquer objeto manufaturado, você sabe sem teste como ele foi feito, onde ele falha primeiro e quanto custou produzir. Uma vez por Foco, pode desmontar ou sabotar uma peça de maquinário como Ação Livre."},{"nome":"Clínico","resumo":"Corpo humano. Medicina, enfermagem, paramedicina, qualquer especialidade que coloca outra pessoa literalmente nas suas mãos. Em Elinia isso significa operar com bisturi e Cifra Corrente na mesma hora, e saber qual das duas resolve. Você sabe a diferença entre uma situação que tem solução e uma que não tem, e sabe rápido.","pericia":"Percepção","conhecimento":"Medicina","habilidade":"Mão Treinada","efeito":"Uma vez por Foco, estabilize como Ação Livre e sem teste um personagem adjacente que acabou de perder um nível de Vitalidade. Você também sabe, olhando, se uma ferida foi feita por matéria comum ou por alma."},{"nome":"Uniformizado","resumo":"Estrutura institucional de segurança. Força pública, guarda de sindicato, o exército de Orian, ou segurança privada bem paga. Você conhece protocolo, conhece gente, e conhece a distância entre o que a lei diz e o que acontece. Você não precisa ter saído em bons termos.","pericia":"Pontaria","conhecimento":"Procedimento","habilidade":"Credencial","efeito":"Você possui identificação funcional, ou algo convincente o bastante. Uma vez por Foco, em lugar onde essa autoridade seja reconhecida, você obtém passagem, informação de rotina ou cooperação imediata sem teste. Funciona até alguém decidir conferir."},{"nome":"Corretor","resumo":"Alta Velana. Porto, corretora, Casa da Moeda. Você trabalhou onde o Estre passa antes de virar preço, e ficou com uma parte legítima dele. Alta Velana não perdeu ninguém na última onda e sabe exatamente quantos os outros perderam. Você aprendeu a ler o mundo assim.","pericia":"Lábia","conhecimento":"Mercado","habilidade":"Preço Real","efeito":"Você sabe sem teste quanto qualquer coisa vale de verdade, incluindo o que não tem preço de tabela: um favor, um silêncio, uma informação. Uma vez por Foco, sabe se a pessoa à sua frente está mentindo sobre valor."},{"nome":"Palco","resumo":"Você vive de audiência. Música, teatro, discurso, a forma muda e o impacto não. Sabe o que significa estar diante de gente e transformar atenção em alguma coisa que dura depois que você sai. À noite Elinia tem boate, bebida e festa, e alguém precisa estar em cima do palco.","pericia":"Performance","conhecimento":"Repertório","habilidade":"Sala Cheia","efeito":"Uma vez por Foco, você prende a atenção de todos que conseguem ver ou ouvir você, sem teste, pelo tempo de uma frase. O que eles fazem com isso é problema seu. Enquanto tiver atenção, você não precisa testar para ser ouvido."},{"nome":"Atravessador","resumo":"Você movia o que não deveria ser movido. Sienna congelada, rota de contrabando, gente que precisava sumir e caixa que precisava chegar. Talvez você tenha ido até Moex. Talvez você só tenha entregado na fronteira e não perguntado. É trabalho, e é o trabalho que a Cúpula finge que não existe porque precisa dele.","pericia":"Movimentação","conhecimento":"Rotas","habilidade":"Por Onde Entra","efeito":"Olhando qualquer lugar, você sabe sem teste como uma coisa entra e sai dali sem passar pela porta. Uma vez por Foco, pode declarar que conhece alguém naquela cadeia. Um nome, um posto, uma pessoa que deve favor a quem te deve favor."},{"nome":"Sem Registro","resumo":"Você tem perícias. Sabe usar o corpo, a cabeça e as mãos com uma eficiência que não se desenvolve por acaso. O problema é que não sabe de onde veio nada disso: alguma coisa apagou o contexto e deixou as capacidades intactas. Todo mundo em Elinia tem um Conhecimento. Você é a única pessoa que não sabe qual é o seu.","pericia":"uma à sua escolha, justificada com o Narrador dentro do mistério","conhecimento":"indefinido","habilidade":"Ele existe e você o usa sem saber nomear","efeito":"Quando o assunto aparece em jogo, o Narrador decide se você sabe, e a resposta vai revelando de que assunto se trata. Quem Sou Eu. Uma vez por Foco, foque em um objeto, lugar, pessoa ou situação. Você recebe um fragmento do seu passado ligado àquele foco. É real, e é incompleto. O Narrador escolhe qual fragmento."}],"tracos":{"alma":[{"nome":"O Útero","pilar":"Origem","efeito":"Toda criatura viva dentro do raio recupera 1 Ponto de Vitalidade no início de cada Foco. Nada dentro do raio pode ser reduzido ao nível 0 de Vitalidade enquanto o Labirinto durar."},{"nome":"O Fim da Frase","pilar":"Extinção","efeito":"Nenhuma Cifra sustentada, invocação ou efeito contínuo sobrevive dentro do raio. Eles caem ao entrar, e nada novo se sustenta ali dentro."},{"nome":"A Cláusula","pilar":"Controle","efeito":"Ao projetar, declare uma regra simples e verificável. Quem violar a regra dentro do raio sofre 2 Faces a menos na ação que a violou. A regra vale para você também."},{"nome":"A Sala do Fundo","pilar":"Pesadelo","efeito":"Toda criatura dentro do raio percebe, o tempo todo, a coisa que ela mais evita pensar. Ninguém enxerga a de mais ninguém. Testes de Propósito ali dentro sofrem 1 Face a menos."},{"nome":"A Euforia","pilar":"Tormento","efeito":"Ninguém dentro do raio consegue recuar, se render, esperar ou passar um Foco sem agir. Todos, inclusive você, recebem 1 Face em ataque e 1 Face a menos em reação."},{"nome":"A Moeda no Ar","pilar":"Causalidade","efeito":"Dentro do raio, todo Terrível conta como Falha comum e todo Sucesso Duplo conta como sucesso simples. As pontas somem, e sobra o meio."}],"pessoais":[{"nome":"Silêncio de Fora","pilar":"","efeito":"Nada do que acontece dentro do raio pode ser visto, ouvido ou detectado de fora, por sentido comum ou por Cifra. De dentro para fora, você continua enxergando."},{"nome":"Sem Portas","pilar":"","efeito":"Ninguém entra nem sai do raio sem vencer um teste oposto contra o seu Domínio. Vale para você também, e é por isso que este Traço assusta mesmo quem o escolheu."},{"nome":"Testemunha","pilar":"","efeito":"Você percebe tudo que acontece dentro do raio, incluindo o que está atrás de obstáculo, no escuro ou escondido. Você não pode desligar isso enquanto o Labirinto durar."},{"nome":"Peso","pilar":"","efeito":"Deslocamento dentro do raio custa uma Ação Padrão em vez de Ação Livre. Você é a única exceção."},{"nome":"Chão Que Lembra","pilar":"","efeito":"O lugar guarda o que já aconteceu ali. Ao projetar, o Narrador descreve um evento passado do local, e ele acontece de novo em segundo plano, visível para todos. Não causa dano. Muda o que as pessoas sabem."},{"nome":"Fundação","pilar":"","efeito":"O raio conta como Local Seguro enquanto durar: aberrações não entram voluntariamente e você pode reconfigurar Talentos. Não permite Repouso, e não remove Corrupção."},{"nome":"Névoa","pilar":"","efeito":"Ninguém dentro do raio enxerga além de uma distância curta. Todos ficam Cegos para o que estiver além disso, e você também."},{"nome":"Eco","pilar":"","efeito":"Toda Cifra Corrente conjurada dentro do raio acontece duas vezes. A segunda é fora do seu controle, e o Narrador escolhe onde ela cai."}]},"bencaos":[{"nome":"A Segunda Vez","pilar":"Origem","efeito":"Uma vez por arco, alguém que morreu na sua presença não morreu. O Narrador descreve como, e a pessoa volta com alguma coisa a menos."},{"nome":"A Palavra Final","pilar":"Extinção","efeito":"Uma vez por arco, declare que uma coisa acabou: um efeito, uma criatura, um vínculo, uma perseguição. Ela acaba. Não pode ser algo que dependa da vontade de uma pessoa viva."},{"nome":"A Exceção","pilar":"Controle","efeito":"Uma vez por arco, uma regra do mundo não se aplica a você por uma cena. O Narrador e você definem qual, e ela precisa ser uma regra, não uma conveniência."},{"nome":"O Sonho Emprestado","pilar":"Pesadelo","efeito":"Uma vez por arco, você entra no sono de alguém que já viu você e conversa com essa pessoa. O que for combinado ali vale ao acordar, e nenhum dos dois consegue provar que aconteceu."},{"nome":"A Chama Curta","pilar":"Tormento","efeito":"Uma vez por arco, por uma cena, todos os seus dados sobem 2 Faces e você não pode reagir, recuar nem parar. Ao fim, você perde um nível de Vitalidade."},{"nome":"A Moeda Devolvida","pilar":"Causalidade","efeito":"Uma vez por arco, um resultado já narrado é trocado pelo oposto. O Narrador escolhe o que mais se quebra no caminho."}]};

];

/* -------------------------------------------------------- 2. o que se grava */

const LS_FICHAS  = "devaneio:fichas:v2";

const uid = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (v, min, max, pad) => {
  const n = Number(v);
  if (!Number.isFinite(n)) return pad;
  return Math.min(max, Math.max(min, Math.round(n)));
};

function fichaEmBranco() {
  const pericias = {};
  TODAS_PERICIAS.forEach(p => { pericias[p] = 0; });
  return {
    id: uid(),
    nome: "", jogador: "",
    linhagem: "Angelical",
    cultura: "", patrimonio: "Comum", estre: "",
    antecedente: "", conhecimento: "",
    afiliacao: "O Olho",

    ascensao: "Vislumbre",

      { origem: "Cultura",     nome: "", efeito: "" },
      { origem: "Antecedente", nome: "", efeito: "" },
      { origem: "Pilar",       nome: "", efeito: "" },
    ],
    cifras: [],                   /* {nome, pilar, vinculo, tipo, sigilos, gatilho, efeito} */
    labTracos: [], labNota: "",
    recolhidos: [],               /* painéis que este personagem não precisa ver */
    ancoras: [
      { nome: "", acredita: "", faria: "", queimada: false },
      { nome: "", acredita: "", faria: "", queimada: false },
    ],
    contatos: 0,

    divida: "", dividaSegunda: "", indicacoes: "",
    ressonancia: 0, bencaos: [],
    equip: { maos: "", cintura: "", bolsos: "", costas: "" },
    xpTotal: 0, xpOutros: 0,
    notas: "",
  };
}

/* Toda ficha que entra — do armazenamento, de um arquivo ou de uma versão
   anterior — passa por aqui. Campo que falta derruba a tela inteira na hora
   de desenhar, e quem está do outro lado lê isso como "perdi tudo". */
function normaliza(bruta) {
  const base = fichaEmBranco();
  if (!bruta || typeof bruta !== "object") return base;
  const f = Object.assign(base, bruta);

  /* Object.assign não distingue "o campo não veio" de "o campo veio igual ao
     padrão", e todo padrão aqui é 0 ou "". Sem ler do bruto pelo nome antigo,
     a ficha da revisão anterior abria zerada e parecendo intacta — que é o
     pior jeito de perder dado. */
  const antigo = (...nomes) => {
    for (const n of nomes) if (bruta[n] != null && bruta[n] !== "") return bruta[n];
    return undefined;
  };

  f.id = typeof bruta.id === "string" && bruta.id ? bruta.id : uid();
  f.nome = String(f.nome || "");
  f.linhagem = LINHAGENS[String(f.linhagem).replace(/\s*\(padrão\)/, "")] ? String(f.linhagem).replace(/\s*\(padrão\)/, "") : "Angelical";
  f.afiliacao = AFILIACOES[f.afiliacao] ? f.afiliacao : (f.afiliacao === "O Coletivo" ? "O Coletivo do Eco" : "O Olho");
  const pilarBruto = antigo("pilar", "selo");
  f.pilar = PILARES[pilarBruto] ? pilarBruto : "Origem";
  f.ascensao = NOMES_ASCENSAO.includes(f.ascensao) ? f.ascensao : "Vislumbre";
  f.patrimonio = PATRIMONIOS.includes(f.patrimonio) ? f.patrimonio : "Comum";
  f.arquetipo = DADOS.arquetipos.some(a => a.nome === f.arquetipo) ? f.arquetipo : "";

  const at = Object.assign({}, base.attrs, bruta.attrs || {});
  f.attrs = {};
  ATRIBUTOS.forEach(a => { f.attrs[a.chave] = num(at[a.chave], 1, 5, 1); });

  /* A revisão anterior tinha vinte perícias em outros quatro grupos. O que
     sobreviveu à 0.73 é recuperado pelo nome; Resistência virou Fortitude. */
  const velhas = Object.assign({}, bruta.skills || {}, bruta.pericias || {});
  if (velhas["Resistência"] != null && velhas["Fortitude"] == null) velhas["Fortitude"] = velhas["Resistência"];
  f.pericias = {};
  TODAS_PERICIAS.forEach(p => { f.pericias[p] = num(velhas[p], 0, 4, 0); });

  const conc = (f.concessoes && typeof f.concessoes === "object") ? f.concessoes : {};
  f.concessoes = {
    cultura: TODAS_PERICIAS.includes(conc.cultura) ? conc.cultura : "",
    antecedente: TODAS_PERICIAS.includes(conc.antecedente) ? conc.antecedente : "",
  };
  f.culturaLivre = !!f.culturaLivre;
  /* ficha antiga já trazia Antecedente escolhido, mas nenhuma concessão */
  if (!f.concessoes.antecedente && f.antecedente) {
    const ant = DADOS.antecedentes.find(x => x.nome === f.antecedente);
    if (ant && TODAS_PERICIAS.includes(ant.pericia)) f.concessoes.antecedente = ant.pericia;
  }

  f.vitNivel = num(antigo("vitNivel", "vitLvl"), 0, 5, 5);
  f.vitPontos = num(antigo("vitPontos", "vitPts"), 0, 99, LINHAGENS[f.linhagem].vit);
  f.corrRecente = num(f.corrRecente, 0, 99, 0);
  f.corrAssentada = num(f.corrAssentada, 0, 99, 0);

  f.graus = (f.graus && typeof f.graus === "object") ? f.graus : {};
  Object.keys(f.graus).forEach(k => {
    const g = f.graus[k] || {};
    f.graus[k] = { xp: num(g.xp, 0, 9999, 0), marcas: Array.isArray(g.marcas) ? g.marcas.slice(0, 4) : [] };
  });

  f.talentos = (Array.isArray(f.talentos) ? f.talentos : []).map(t => ({
    nome: String(t.nome || ""), fonte: String(t.fonte || "Geral"),
    patamar: String(t.patamar || "I"), xp: num(t.xp, 0, 99, 2),
    carga: num(t.carga, 0, 9, 0), modo: t.modo === "Passivo" ? "Passivo" : "Ativo",
    efeito: String(t.efeito || ""), ativo: !!t.ativo,
  })).filter(t => t.nome);

  f.correntes = (Array.isArray(f.correntes) ? f.correntes : base.correntes)
    .map(c => ({ origem: String(c.origem || ""), nome: String(c.nome || ""), efeito: String(c.efeito || "") }));
  while (f.correntes.length < 3) f.correntes.push({ origem: "", nome: "", efeito: "" });

  f.cifras = (Array.isArray(f.cifras) ? f.cifras : []).map(c => ({
    nome: String(c.nome || ""),
    pilar: PILARES[c.pilar] ? c.pilar : (PILARES[c.selo] ? c.selo : "Origem"),
    vinculo: VINCULOS[c.vinculo] ? c.vinculo : "Baixo",
    tipo: String(c.tipo || ""),
    sigilos: Array.isArray(c.sigilos) ? c.sigilos : String(c.gestos || c.sigilos || "").split(/\s*\+\s*|\s+e\s+/).filter(Boolean),
    gatilho: String(c.gatilho || ""), efeito: String(c.efeito || ""),
  })).filter(c => c.nome);

  f.labTracos = (Array.isArray(f.labTracos) ? f.labTracos : []).filter(t => typeof t === "string");
  f.recolhidos = (Array.isArray(f.recolhidos) ? f.recolhidos : []).filter(t => typeof t === "string");
  f.ancoras = (Array.isArray(f.ancoras) ? f.ancoras : base.ancoras).map(a => ({
    nome: String(a.nome || ""),
    acredita: String(a.acredita != null ? a.acredita : (a.cre || "")),
    faria: String(a.faria || ""),
    queimada: !!a.queimada,
  }));
  while (f.ancoras.length < 2) f.ancoras.push({ nome: "", acredita: "", faria: "", queimada: false });

  f.contatos = num(f.contatos, 0, 99, 0);
  f.confiancaTeto = num(f.confiancaTeto, 0, 20, 0);
  f.confiancaReserva = num(f.confiancaReserva, 0, 20, 0);
  f.acessos = num(f.acessos, 0, 99, 0);
  f.ressonancia = num(f.ressonancia, 0, 3, 0);
  f.bencaos = (Array.isArray(f.bencaos) ? f.bencaos : []).map(b => ({
    nome: String(b.nome || ""), pilar: String(b.pilar || ""), efeito: String(b.efeito || ""),
  })).filter(b => b.nome);

  const eq = Object.assign({}, base.equip, f.equip || {});
  f.equip = {}; SLOTS.forEach(s => { f.equip[s.chave] = String(eq[s.chave] || ""); });
  if (!f.equip.bolsos && Array.isArray(bruta.inventario) && bruta.inventario.length) {
    f.equip.bolsos = bruta.inventario.map(i => (typeof i === "string" ? i : i && i.nome) || "").filter(Boolean).join(", ");
  }

  f.xpTotal = num(antigo("xpTotal", "xp"), 0, 99999, 0);
  f.xpOutros = num(f.xpOutros, 0, 99999, 0);
  f.notas = String(f.notas || "");
  f.divida = String(f.divida || "");
  f.dividaSegunda = String(antigo("dividaSegunda", "dividaLinhas") || "");
  return f;
}

/* ------------------------------------------------------------ 3. derivados */

const fichaAtiva = () => db.fichas.find(f => f.id === db.ativa) || db.fichas[0] || null;

const arquetipoDe = f => DADOS.arquetipos.find(a => a.nome === f.arquetipo) || null;
const grauDe = f => f.graus[f.arquetipo] || { xp: 0, marcas: [] };

function nivelGrau(xpAcumulado) {
  let g = 1;
  for (let i = 0; i < GRAU_XP.length; i++) if (xpAcumulado >= GRAU_XP[i]) g = i + 1;
  return g;
}
const proximoGrau = xp => {
  const g = nivelGrau(xp);
  return g >= 8 ? null : { grau: g + 1, falta: GRAU_XP[g] - xp, em: GRAU_XP[g] };
};

/* As Marcas pertencem ao Arquétipo que as ganhou. Um corpo se desacostuma. */
const marcasDe = f => (grauDe(f).marcas || []).slice(0, Math.floor(nivelGrau(grauDe(f).xp) / 2));
const contaMarca = (f, tipo) => marcasDe(f).filter(m => m === tipo).length;

const vitMax   = f => LINHAGENS[f.linhagem].vit + contaMarca(f, "corpo");
const limiarDe = f => LINHAGENS[f.linhagem].limiar + contaMarca(f, "cordao");

/* Cultura e Antecedente concedem um nível de perícia cada. O nível gratuito
   não é comprado e não pode ser gasto: ele mora na fonte, e some junto com
   ela quando o jogador troca de Antecedente. Por isso f.pericias guarda só
   o que foi comprado, e quem soma é aqui. */
const FONTES_CONCESSAO = [
  { chave: "cultura", rot: "Cultura" },
  { chave: "antecedente", rot: "Antecedente" },
];
const concedidoEm = (f, pericia) =>
  FONTES_CONCESSAO.filter(x => f.concessoes[x.chave] === pericia).length;

/* "Não fura o teto": o nível gratuito soma e para no teto do estágio. */
function periciaTotal(f, pericia) {
  const teto = estagioDe(f).tetoEsp;
  return Math.min(teto, (f.pericias[pericia] || 0) + concedidoEm(f, pericia));
}
/* Caiu numa perícia que você já treinou? O livro diz que não se perde: vira
   ponto livre, e quem realoca é o jogador. A ficha só avisa que ele existe. */
function pontosLivres(f) {
  const teto = estagioDe(f).tetoEsp;
  const vistas = new Set(FONTES_CONCESSAO.map(x => f.concessoes[x.chave]).filter(Boolean));
  let sobra = 0;
  vistas.forEach(p => {
    sobra += Math.max(0, (f.pericias[p] || 0) + concedidoEm(f, p) - teto);
  });
  return sobra;
}

const estagioDe   = f => ASCENSAO.find(a => a.nome === f.ascensao) || ASCENSAO[0];
const capacidadeDe = f => estagioDe(f).cap;

const talentosAcesos = f => f.talentos.filter(t => t.ativo);
const pesoAceso = f => talentosAcesos(f).reduce((s, t) => s + (t.xp || 0), 0);
const cargaAcesa = f => talentosAcesos(f).reduce((s, t) => s + (t.carga || 0), 0);

const corrTotal = f => f.corrRecente + f.corrAssentada + cargaAcesa(f);

function estadoCorrupcao(f) {
  const t = corrTotal(f), l = limiarDe(f);
  if (t <= 0) return { nome: "Limpo", efeito: "Nada instalado. Aproveite, porque não dura.", grave: false };
  if (t >= l) return { nome: "No Limiar", grave: true, efeito: "O Narrador determina a consequência definitiva, conforme a sua Linhagem. Você não escolhe." };
  if (t > l * 2 / 3) return { nome: "Corrompido", grave: true, efeito: "Sinais físicos graves. −1 Face em testes de Espírito, e o Narrador pode exigir testes para você manter controle." };
  if (t > l / 3) return { nome: "Distorcido", grave: false, efeito: "−1 Face em testes de Influência. Aberrações são atraídas por você." };
  return { nome: "Marcado", grave: false, efeito: "Aberrações te detectam com mais facilidade. Percepções começam a mudar." };
}

/* A Prontidão decide apenas quem começa. Depois disso ela não faz mais nada. */
function prontidaoDe(f) {
  const a = arquetipoDe(f);
  const base = a ? (f.attrs[a.atributo] || 0) : 0;
  return base + periciaTotal(f, "Movimentação");
}

/* Alfabetização não mede poder. Mede acesso à língua, e sai de Domínio. */
function alfabetizacaoDe(f) {
  const d = periciaTotal(f, "Domínio");
  if (d >= 3 && f.ressonancia >= 1) return { nome: "Escritor", nota: "Compõe sequências novas. Especialização 3 em Domínio e Ressonância 1 — e um Semblante que ratifique, porque sem interlocutor você escreveu uma carta e não endereçou." };
  if (d >= 2) return { nome: "Leitor", nota: "Identifica Sigilos, Vínculo e Pilar de qualquer Cifra sinalizada à vista, sem teste, desde que consiga ver as mãos. Aprende Catalogada em metade do tempo narrativo." };
  return { nome: "Falante", nota: "Executa o que aprendeu, com competência real e nenhuma teoria por baixo. É a esmagadora maioria de Elinia, e funciona perfeitamente bem assim." };
}

const xpDeCifra = c => (VINCULOS[c.vinculo] || VINCULOS.Baixo).xp;
const xpAutomatico = f =>
  f.talentos.reduce((s, t) => s + (t.xp || 0), 0) +
  f.cifras.reduce((s, c) => s + xpDeCifra(c), 0);
const xpLivre = f => f.xpTotal - xpAutomatico(f) - f.xpOutros;

/* Um Talento comprado nunca é perdido; o que existe é o que cabe aceso. */
const temTalento = (f, nome) => f.talentos.some(t => t.nome === nome);

/* ---------------------------------------------------- 4. ler e gravar */

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function carrega() {
  let cru = null;
  try { cru = localStorage.getItem(LS_FICHAS); } catch (e) { cru = null; }

  /* A revisão anterior gravava sob outra chave. Copia antes de tocar em
     qualquer coisa: nada é apagado antes de a cópia nova existir. */
  if (!cru) {
    try {
      const velho = localStorage.getItem(LS_ANTIGO);
      if (velho) { cru = velho; localStorage.setItem(LS_FICHAS, velho); }
    } catch (e) { /* armazenamento bloqueado; segue com ficha nova */ }
  }

  if (cru) {
    try {
      const o = JSON.parse(cru);
      const lista = Array.isArray(o) ? o : (o.fichas || o.chars || []);
      db.fichas = lista.map(normaliza);
      db.ativa = o.ativa || o.activeId || (db.fichas[0] && db.fichas[0].id) || null;
      db.lixeira = Array.isArray(o.lixeira || o.trash) ? (o.lixeira || o.trash).map(normaliza) : [];
    } catch (e) { db = { fichas: [], ativa: null, lixeira: [] }; }
  }
  if (!db.fichas.length) { const f = fichaEmBranco(); db.fichas = [f]; db.ativa = f.id; }
  if (!db.fichas.some(f => f.id === db.ativa)) db.ativa = db.fichas[0].id;
}

let gravaTimer = null, ultimoBackup = 0;
function grava() {
  marcaEstado("gravando");
  clearTimeout(gravaTimer);
  gravaTimer = setTimeout(escreve, 320);
}
function escreve() {
  try {
    const bloco = JSON.stringify({ versao: 2, fichas: db.fichas, ativa: db.ativa, lixeira: db.lixeira });
    localStorage.setItem(LS_FICHAS, bloco);
    if (Date.now() - ultimoBackup > 60000) { localStorage.setItem(LS_BACKUP, bloco); ultimoBackup = Date.now(); }
    marcaEstado("gravado");
  } catch (e) {
    marcaEstado("erro");
  }
}
function marcaEstado(s) {
  const el = $("#estadoGravacao"); if (!el) return;
  el.textContent = s === "erro"
    ? "não deu para gravar — exporte um backup"
    : (s === "gravando" ? "gravando…" : "gravado");
  el.dataset.erro = s === "erro" ? "1" : "0";
}

/* caminho tipo "attrs.corpo" ou "ancoras.0.nome" */
function escreveCaminho(obj, caminho, valor) {
  const p = caminho.split(".");
  let alvo = obj;
  for (let i = 0; i < p.length - 1; i++) {
    const k = /^\d+$/.test(p[i]) ? Number(p[i]) : p[i];
    if (alvo[k] == null) alvo[k] = /^\d+$/.test(p[i + 1]) ? [] : {};
    alvo = alvo[k];
  }
  const ult = /^\d+$/.test(p[p.length - 1]) ? Number(p[p.length - 1]) : p[p.length - 1];
  alvo[ult] = valor;
}
function leCaminho(obj, caminho) {
  return caminho.split(".").reduce((o, k) => (o == null ? o : o[/^\d+$/.test(k) ? Number(k) : k]), obj);
}

let avisoTimer = null;
function avisa(texto, ms, rotulo, acao) {
  const cx = $("#aviso"), tx = $("#avisoTexto"), bt = $("#avisoAcao");
  tx.textContent = texto;
  clearTimeout(avisoTimer);
  if (rotulo && acao) {
    bt.hidden = false; bt.textContent = rotulo;
    bt.onclick = () => { cx.hidden = true; acao(); };
  } else { bt.hidden = true; bt.onclick = null; }
  cx.hidden = false;
  avisoTimer = setTimeout(() => { cx.hidden = true; }, ms || 4200);
}

function campo(rot, caminho, valor, tipo, extra) {

  return `<label class="campo"><span class="campo__rot">${esc(rot)}</span>` +
    `<input class="ent${t === "number" ? " ent--num" : ""}" type="${t}" data-campo="${caminho}" value="${esc(valor)}" ${extra || ""}></label>`;
}
function seletor(rot, caminho, valor, opcoes, vazio) {
  const ops = (vazio ? [""] : []).concat(opcoes)
    .map(o => `<option value="${esc(o)}"${o === valor ? " selected" : ""}>${esc(o || "—")}</option>`).join("");
  return `<label class="campo"><span class="campo__rot">${esc(rot)}</span>` +
    `<select class="ent" data-campo="${caminho}">${ops}</select></label>`;
}
function area(rot, caminho, valor, linhas) {
  return `<label class="campo"><span class="campo__rot">${esc(rot)}</span>` +
    `<textarea class="ent" rows="${linhas || 3}" data-campo="${caminho}">${esc(valor)}</textarea></label>`;
}
/* Um contador serve só para o recorte não rimar: quem rasga uma pilha de
   papel à mão não rasga duas folhas igual, e metade delas sai torta no topo
   também. É decoração, e por isso sai inteira na impressão. */
let recorte = 0;
/* Em mesa, marcar um ponto é um gesto por turno. Digitar é abrir o teclado,
   apagar o que estava e conferir se ficou certo — três gestos, e o último
   ninguém faz. Então todo número pequeno vira casa que se clica, e clicar na
   última casa cheia volta uma. */
function medidor(acao, total, tipoDe, extras) {
  const o = extras || {};
  let h = `<div class="medidor${o.classe ? " " + o.classe : ""}">`;
  for (let i = 1; i <= total; i++) {
    const terco = o.tercos && (i === Math.round(total / 3) || i === Math.round(total * 2 / 3));
    h += `<button class="medidor__casa naoimprime" type="button" data-acao="${acao}" data-n="${i}"` +
      ` data-tipo="${tipoDe(i)}" data-terco="${terco ? 1 : 0}"` +
      (o.campo ? ` data-campo="${o.campo}"` : "") +
      ` aria-label="${esc(o.rot || "marcar")} ${i}">${o.numerar ? i : ""}</button>`;
  }
  return h + `</div>`;
}

/* − n + para o que não cabe numa trilha: XP e contadores longos */
function contador(rot, campo, valor, min, max, nota) {
  return `<div class="contador">` +
    `<span class="contador__rot">${esc(rot)}</span>` +
    `<button class="passo naoimprime" type="button" data-acao="passoNum" data-campo="${campo}" data-d="-1" data-min="${min}" data-max="${max}" aria-label="Baixar ${esc(rot)}">−</button>` +
    `<b class="contador__valor">${valor}</b>` +
    `<button class="passo naoimprime" type="button" data-acao="passoNum" data-campo="${campo}" data-d="1" data-min="${min}" data-max="${max}" aria-label="Subir ${esc(rot)}">+</button>` +
    (nota ? `<span class="contador__nota">${esc(nota)}</span>` : "") +
  `</div>`;
}

/* A chave de recolhimento sai do próprio título. Renomear um painel perde o
   estado dele uma vez e ele volta aberto, que é um preço barato por não ter
   uma segunda lista de nomes para manter em dia. */
const chaveDe = t => t.toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function painel(titulo, nota, corpo, op) {
  const o = op || {};
  const chave = chaveDe(titulo);
  const recolhido = (fichaAtiva() || {}).recolhidos && fichaAtiva().recolhidos.includes(chave);
  recorte++;
  const topoRasgado = recorte % 3 === 2;
  /* fita onde a colagem pede: não em todo painel, senão vira padrão */
  const fita = o.fita || ["", "", "so", "", "ne", "", "", "se", "", "", "no", ""][recorte % 12] || "";
  /* A folha é o papel: é ela que entorta, que pega grão e que rasga.
     O conteúdo fica reto em cima dela, porque texto em camada rotacionada
     perde o encaixe na grade de pixels e sai borrado — e uma tarja impressa
     reta sobre papel cortado torto é o que um zine é de verdade. */
  return `<section class="painel${o.prata ? " painel--prata" : ""}${o.largo ? " painel--largo" : ""}"` +
    ` data-recolhido="${recolhido ? 1 : 0}">` +
    `<span class="painel__folha" aria-hidden="true">` +
      (topoRasgado ? `<span class="rasgo rasgo--topo naoimprime"></span>` : "") +
      `<span class="rasgo rasgo--pe naoimprime"></span>` +
    `</span>` +
    (fita && !recolhido ? `<span class="fita fita--${fita} naoimprime" aria-hidden="true"></span>` : "") +
    `<div class="painel__topo"><h3 class="painel__nome">${esc(titulo)}</h3>` +
    (nota ? `<span class="painel__nota" title="${esc(nota)}">${esc(nota)}</span>` : "") +
    `<button class="painel__olho naoimprime" type="button" data-acao="recolhe" data-chave="${chave}"` +
    ` aria-expanded="${recolhido ? "false" : "true"}"` +
    ` title="${recolhido ? "Abrir" : "Recolher"} ${esc(titulo)}">${recolhido ? "▸" : "▾"}</button>` +
    `</div><div class="painel__corpo">${corpo}</div></section>`;
}

function faixaAtributos(f) {
  const teto = estagioDe(f).tetoAtr;
  let corpo = `<div class="atrs">` + ATRIBUTOS.map(a => {
    const v = f.attrs[a.chave];
    return `<div class="atr"><div class="atr__rot">${esc(a.sigla)}</div>` +
      `<b class="atr__dado">${DADO_ATRIBUTO[v]}</b>` +
      `<div class="atr__rot">${esc(a.rot)} ${v}</div>` +
      `<div class="atr__passos">` +
        `<button class="passo" type="button" data-acao="atr" data-alvo="${a.chave}" data-d="-1"${v <= 1 ? " disabled" : ""} aria-label="Baixar ${esc(a.rot)}">−</button>` +
        `<button class="passo" type="button" data-acao="atr" data-alvo="${a.chave}" data-d="1"${v >= teto ? " disabled" : ""} aria-label="Subir ${esc(a.rot)}">+</button>` +
      `</div></div>`;
  }).join("") + `</div>` +
  `<p class="margem">Teto de <b>${teto}</b> no ${esc(f.ascensao)}. O D20 só existe no Iluminado, e quem chega lá não é mais exatamente uma pessoa.</p>`;
  const acima = ATRIBUTOS.filter(x => f.attrs[x.chave] > teto);
  if (acima.length) corpo += `<p class="margem"><b>Acima do teto:</b> ${esc(acima.map(x => x.rot).join(", "))}. A ficha não confisca nada — mas no ${esc(f.ascensao)} esse dado não deveria estar na mesa.</p>`;
  return painel("Atributos", "1D do Atributo + 1D da Perícia", corpo);
}

function faixaVitalidade(f) {
  const max = vitMax(f);
  const est = VITALIDADE.find(v => v.n === f.vitNivel) || VITALIDADE[0];
  const corpo =
    `<div class="vit__degraus">` + [5, 4, 3, 2, 1].map(n => {
      const v = VITALIDADE.find(x => x.n === n) || {};
      return `<button class="degrau" type="button" data-acao="vit" data-n="${n}" ` +
        `data-cheio="${f.vitNivel >= n ? 1 : 0}" data-risco="${v.risco ? 1 : 0}" ` +
        `data-atual="${f.vitNivel === n ? 1 : 0}" title="${esc(v.nome)} — ${esc(v.pen)}">${n}</button>`;
    }).join("") + `</div>` +
    `<div class="vit__estado"><b class="vit__nome">${esc(est.nome)}</b>` +
      `<span class="vit__pen">${esc(est.pen)}</span></div>` +
    `<div class="slot__rot"><span>Pontos de Vitalidade</span><b>${f.vitPontos} de ${max}</b></div>` +
    medidor("vitPts", max, i => i <= f.vitPontos ? "cheio" : "vazio", { classe: "medidor--papel", rot: "Ponto de Vitalidade" }) +
    `<div class="linha-bts naoimprime"><button class="bt bt--fino" type="button" data-acao="vitCheia">encher tudo</button></div>` +
    `<p class="margem">Zerou os pontos, cai um nível e a reserva volta ao máximo. Chegou ao <b>0</b>, acabou — e não é o tipo de coisa que repouso conserta.</p>` +
    (f.vitNivel === 2 ? `<p class="margem"><b>Este é o degrau que mata gente.</b> A Face você aguenta. Não poder reagir significa que o próximo golpe entra inteiro, e o combate deste jogo não perdoa golpe que entra inteiro.</p>` : "") +
    (f.vitNivel === 1 ? `<p class="margem"><b>Inconsciente.</b> Alguém vai ter que te carregar, e quem te carrega não está atirando.</p>` : "") +
    (f.vitNivel === 0 ? `<p class="margem"><b>Fora da mesa.</b> Foi bom enquanto durou. Guarde a ficha: o Narrador tem permissão de trazer essa pessoa de volta na frente de quem sobrou, e nada disso é ressurreição.</p>` : "");
  return painel("Vitalidade", `Linhagem ${f.linhagem} · ${max} por nível`, corpo);
}

function faixaCorrupcao(f) {
  const l = limiarDe(f), rec = f.corrRecente, ass = f.corrAssentada, car = cargaAcesa(f);
  const t = rec + ass + car;
  const est = estadoCorrupcao(f);
  /* A trilha mede o Limiar inteiro, e as casas se pintam na ordem em que a
     alma entrou: Assentada no começo, Carga em cima dela, Recente por
     último. É a Recente que sobe e desce toda cena, então é ela que o
     clique move. Carga não se clica: quem manda nela é o painel de
     Talentos, e Assentada tem o próprio contador porque quase não se mexe. */
  const tipoDe = i => i <= ass ? "ass" : i <= ass + car ? "car" : i <= t ? "rec" : "vazio";
  const corpo =
    medidor("corr", l, tipoDe, { tercos: true, rot: "Corrupção" }) +
    `<div class="corr__resumo">` +
      `<b class="corr__num">${t} <span>de ${l}</span></b>` +
      `<span class="corr__estado" data-grave="${est.grave ? 1 : 0}">${esc(est.nome)}</span>` +
    `</div>` +
    `<div class="corr__legenda">` +
      `<span><i data-tipo="ass"></i>Assentada ${ass}</span>` +
      `<span><i data-tipo="car"></i>Carga ${car}</span>` +
      `<span><i data-tipo="rec"></i>Recente ${rec}</span>` +
    `</div>` +
    `<p class="margem">${esc(est.efeito)}</p>` +
    contador("Assentada", "corrAssentada", ass, 0, 99, "não sai com descanso comum") +
    `<div class="linha-bts naoimprime">` +
      `<button class="bt bt--fino" type="button" data-acao="repousoRapido">Repouso rápido</button>` +
      `<button class="bt bt--fino" type="button" data-acao="repousoCompleto">Repouso completo</button>` +
      `<button class="bt bt--fino" type="button" data-acao="repousoArvore">Árvore Prateada</button>` +
    `</div>` +
    `<p class="margem">Alma não é combustível, é acúmulo. Você não gasta: você desloca, e ela fica onde parou.</p>`;
  return painel("Corrupção", `Limiar ${l} · ${f.linhagem}`, corpo, { prata: true });
}

        `</span>` +
        `<span class="per__dado" data-tem="${total > 0 ? 1 : 0}">${DADO_PERICIA[total]}</span>` +

          `<button class="passo" type="button" data-acao="per" data-alvo="${esc(p)}" data-d="1"${total >= teto ? " disabled" : ""} aria-label="Subir ${esc(p)}">+</button>` +

    }).join("") + `</div>`
  ).join("") + `</div>` +
  `<p class="margem">Perícia sem Especialização funciona com o atributo sozinho. A diferença entre tentar e saber fazer é real, e é exatamente um dado. Teto <b>${teto}</b> agora; nenhuma perícia chega ao D20, nunca.</p>` +
  (TODAS_PERICIAS.some(p => f.pericias[p] > teto)

  (pontosLivres(f)

  return painel("Perícias", `Conhecimento: ${f.conhecimento || "—"}`, corpo, { largo: true });
}

  /* Cultura fora da lista do livro existe — o Capítulo 9 não saiu ainda.
