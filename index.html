const LS_KEY = "caos-eminente:fichas:v1";
const LS_BAK = "caos-eminente:fichas:backup";
let db = {chars:[], activeId:null, trash:[]};

function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* número seguro: nunca deixa NaN, string ou lixo entrar na ficha */
function clampNum(v, min, max, fallback){
  const n = Number(v);
  if(!Number.isFinite(n)) return fallback;
  return Math.min(max, Math.max(min, Math.round(n)));
}

/* ============================================================
   CONCESSÕES
   Cultura e Antecedente dão um grau de perícia e um traço. O traço
   é derivado da escolha (nunca copiado para a ficha, então nunca
   dessincroniza). O grau é aplicado de verdade, e por isso fica
   registrado quem o deu — para poder ser retirado ao trocar.
   ============================================================ */

const TODAS_PERICIAS = Object.values(SKILLS).flat();

/* "Performance ou Conhecimento" -> ["Performance","Conhecimento"]
   "Conhecimento, Atualidades"   -> ["Conhecimento"]
   "Lógica ou qualquer perícia de Espírito" -> Lógica + as cinco de Espírito
   "Uma à sua escolha, ..."      -> todas */
function periciasConcedidas(txt){
  if(!txt) return [];
  if(/^Uma à sua escolha/i.test(txt)) return TODAS_PERICIAS.slice();
  const achadas = [];
  for(const parte of txt.split(/\s+ou\s+/i)){
    const grupo = parte.match(/qualquer perícia de (Corpo|Raciocínio|Espírito|Influência)/i);
    if(grupo){
      const chave = {corpo:"corpo",raciocínio:"raciocinio",espírito:"espirito",influência:"influencia"}[grupo[1].toLowerCase()];
      SKILLS[chave].forEach(p => achadas.push(p));
      continue;
    }
    const p = TODAS_PERICIAS.find(x => parte.trim().startsWith(x));
    if(p) achadas.push(p);
  }
  return [...new Set(achadas)];
}

function fonteDe(tipo, c){
  return tipo === "cultura"
    ? DADOS.culturas.find(x => x.nome === c.cultura)
    : DADOS.antecedentes.find(x => x.nome === c.antecedente);
}

/* aplica o grau concedido, retirando antes o que a escolha anterior deu */
function aplicaConcessao(tipo, pericia){
  const c = cur(); if(!c) return;
  c.concessoes = c.concessoes || {};
  const antes = c.concessoes[tipo];

  if(antes && antes.pericia && c.skills[antes.pericia] > 0){
    c.skills[antes.pericia] = Math.max(0, c.skills[antes.pericia] - 1);
  }
  if(pericia && TODAS_PERICIAS.includes(pericia)){
    c.skills[pericia] = Math.min(4, (c.skills[pericia] || 0) + 1);
    c.concessoes[tipo] = { fonte: tipo === "cultura" ? c.cultura : c.antecedente, pericia };
  } else {
    delete c.concessoes[tipo];
  }
  save();
}

/* trocar de Cultura/Antecedente devolve o grau antigo e zera a escolha */
function reiniciaConcessao(tipo){
  const c = cur(); if(!c) return;
  c.concessoes = c.concessoes || {};
  const antes = c.concessoes[tipo];
  if(antes && antes.pericia && c.skills[antes.pericia] > 0){
    c.skills[antes.pericia] = Math.max(0, c.skills[antes.pericia] - 1);
  }
  delete c.concessoes[tipo];
}

let toastTimer = null;
function toast(msg, ms, actionLabel, action){
  const box = document.getElementById("toast");
  if(!box) return;
  box.textContent = "";
  const span = document.createElement("span");
  span.textContent = msg;
  box.appendChild(span);
  if(actionLabel){
    const b = document.createElement("button");
    b.className = "btn btn-xs";
    b.textContent = actionLabel;
    b.onclick = () => { hideToast(); if(action) action(); };
    box.appendChild(b);
  }
  const x = document.createElement("button");
  x.className = "toast-x"; x.textContent = "✕";
  x.setAttribute("aria-label","Fechar aviso");
  x.onclick = hideToast;
  box.appendChild(x);
  box.hidden = false;
  clearTimeout(toastTimer);
  if(ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast(){ const b = document.getElementById("toast"); if(b) b.hidden = true; }

/* ------------------------------------------------------------
   NORMALIZAÇÃO
   Toda ficha que entra — do armazenamento ou de um arquivo —
   passa por aqui. Sem isso, uma ficha gravada por uma versão
   anterior (sem algum campo) derruba a tela inteira na hora de
   desenhar, e o usuário lê isso como "perdi tudo".
   ------------------------------------------------------------ */
function normalize(raw){
  const base = blankChar();
  if(!raw || typeof raw !== "object") return base;

  const c = Object.assign(base, raw);
  c.id = (typeof raw.id === "string" && raw.id) ? raw.id : uid();

  c.attrs = Object.assign({corpo:1,raciocinio:1,espirito:1,influencia:1}, raw.attrs || {});
  Object.keys(ATTR_LABEL).forEach(k => c.attrs[k] = clampNum(c.attrs[k],1,5,1));

  c.skills = Object.assign({}, raw.skills || {});
  Object.values(SKILLS).flat().forEach(s => c.skills[s] = clampNum(c.skills[s],0,4,0));

  c.lab = Object.assign({selo:"",estagio:"—",cargas:0,tracos:""}, raw.lab || {});

  // as listas também são saneadas item a item: um único campo inválido aqui
  // (um Vínculo desconhecido, por exemplo) impediria a ficha de ser desenhada
  const arr = k => Array.isArray(raw[k]) ? raw[k].filter(x => x && typeof x === "object") : [];
  const str = v => (v == null ? "" : String(v));
  const opt = (v,lista) => lista.includes(v) ? v : "";

  c.cifras = arr("cifras").map(x => {
    const vinculo = VINCULOS[x.vinculo] ? x.vinculo : "Baixo";
    return {
      nome:str(x.nome), selo:opt(x.selo,SELOS), vinculo,
      gatilho:opt(x.gatilho,GATILHOS), gestos:str(x.gestos), efeito:str(x.efeito),
      // Cifra gravada antes do cálculo de XP herda o custo do próprio Vínculo
      xp: clampNum(x.xp, 0, 99, VINCULOS[vinculo].xp),
      corrente: !!x.corrente
    };
  });
  /* Um Talento gravado antes da revisão não tem Peso nem Ativada. Quando o
     nome ainda existe no livro novo, puxamos os números de lá; quando não,
     o que sobrou vira um Talento avulso de Peso 2, para o jogador ajustar
     em vez de perder a linha. */
  c.talentos = arr("talentos").map(x => {
    const doLivro = achaTalento(str(x.nome), str(x.chave));
    return {
      nome:  str(x.nome),
      chave: str(x.chave) || (doLivro ? doLivro.chave : ""),
      xp:    clampNum(x.xp, 0, 99, doLivro ? doLivro.xp : 2),
      /* "carga" era o nome anterior deste campo; fichas gravadas com ele
         continuam abrindo. */
      ativada: clampNum(x.ativada ?? x.carga, 0, 99, doLivro ? doLivro.ativada : 0),
      texto: str(x.texto) || str(x.desc) || (doLivro ? doLivro.texto : ""),
      ativo: x.ativo === undefined ? true : !!x.ativo
    };
  });
  /* Ressonância e Bênçãos saíram da ficha: a mecânica passou a ser expressa
     por Talentos e Cifras. O que já estava anotado não é apagado — segue no
     arquivo salvo e nos backups, apenas sem painel que o desenhe. */
  c.inventario = arr("inventario").map(x => ({
    nome:str(x.nome), volume:clampNum(x.volume,0,999,0),
    nc:clampNum(x.nc,0,4,0), equipado: !!x.equipado
  }));

  c.ancoras = (Array.isArray(raw.ancoras) ? raw.ancoras : []).slice(0,2)
    .map(a => Object.assign({nome:"",cre:"",faria:""}, (a && typeof a === "object") ? a : {}));
  while(c.ancoras.length < 2) c.ancoras.push({nome:"",cre:"",faria:""});

  c.concessoes = (raw.concessoes && typeof raw.concessoes === "object") ? raw.concessoes : {};

  /* Ponte com as fichas anteriores à revisão. A Especialização escolhida
     virou o Arquétipo de mesmo nome, e a Corrupção que existia era
     permanente, então entra como Assentada. Essência não tem para onde ir:
     o recurso deixou de existir. */
  if(!c.arquetipo && Array.isArray(raw.especializacoes) && raw.especializacoes[0]){
    const antiga = str(raw.especializacoes[0].nome);
    if(ARQUETIPOS.some(a => a.nome === antiga)) c.arquetipo = antiga;
  }
  c.arquetipo = ARQUETIPOS.some(a => a.nome === c.arquetipo) ? c.arquetipo : "";
  if(raw.corrAssentada === undefined && raw.corrupcao !== undefined){
    c.corrAssentada = clampNum(raw.corrupcao,0,99,0);
  }
  /* A Corrupção Recente existiu brevemente e foi absorvida pela Assentada:
     o que estava marcado numa ficha não pode simplesmente evaporar. */
  if(raw.corrRecente !== undefined){
    c.corrAssentada = clampNum(c.corrAssentada,0,1e9,0) + clampNum(raw.corrRecente,0,99,0);
  }
  delete c.especializacoes; delete c.corrupcao; delete c.corrRecente;
  delete c.essLvl; delete c.essPts;
  delete c.rf; delete c.re;   // Resistência Física e Espiritual saíram do sistema

  c.vitLvl = clampNum(c.vitLvl,0,5,5);
  ["vitPts","xp","nc","marcas","estre","corrAssentada"]
    .forEach(k => c[k] = clampNum(c[k],0,1e9,0));

  return c;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(LS_KEY); }
  catch(e){ setStatus("erro"); }

  let parsed = null;
  if(raw){
    try{ parsed = JSON.parse(raw); }
    catch(e){
      // nunca descarta em silêncio: preserva o texto ilegível para recuperação manual
      try{ localStorage.setItem(LS_KEY + ":corrompido:" + Date.now(), raw); }catch(_){}
      try{
        const bak = localStorage.getItem(LS_BAK);
        if(bak) parsed = JSON.parse(bak);
      }catch(_){}
      toast(parsed
        ? "O arquivo principal estava corrompido. Restaurei a última cópia de segurança."
        : "O arquivo salvo estava ilegível. Guardei uma cópia bruta dele no navegador.", 12000);
    }
  }

  if(parsed && Array.isArray(parsed.chars) && parsed.chars.length){
    db.chars   = parsed.chars.map(normalize);
    db.activeId = parsed.activeId;
    db.trash   = Array.isArray(parsed.trash) ? parsed.trash.map(normalize) : [];
  }
  if(!db.chars.length){
    const c = blankChar();
    db.chars.push(c);
    db.activeId = c.id;
  }
  if(!db.chars.some(c => c.id === db.activeId)) db.activeId = db.chars[0].id;
}

/* ------------------------------------------------------------
   GRAVAÇÃO
   Debounce curto + descarga forçada ao sair da página, para que
   as últimas teclas digitadas nunca fiquem para trás.
   ------------------------------------------------------------ */
let saveTimer = null, pending = false, lastBak = 0;

function save(){
  pending = true;
  setStatus("gravando");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}

function flush(){
  clearTimeout(saveTimer);
  if(!pending) return;
  let json;
  try{ json = JSON.stringify(db); }
  catch(e){ setStatus("erro"); return; }

  try{
    localStorage.setItem(LS_KEY, json);
    pending = false;
    setStatus("salvo");
    // cópia de segurança espaçada, só depois que a principal deu certo
    if(Date.now() - lastBak > 30000){
      try{ localStorage.setItem(LS_BAK, json); lastBak = Date.now(); }catch(_){}
    }
  }catch(e){
    setStatus("erro");
    toast("NÃO FOI POSSÍVEL SALVAR — o armazenamento está cheio ou bloqueado. Baixe um backup completo agora para não perder nada.", 0);
  }
}

window.addEventListener("beforeunload", e => {
  flush();
  if(pending){ e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") flush();
});

// outra aba gravou por cima: avisa em vez de deixar as duas se sobrescreverem
window.addEventListener("storage", e => {
  if(e.key !== LS_KEY || !e.newValue) return;
  toast("Esta ficha foi alterada em outra aba. Recarregue para ver a versão mais nova — continuar aqui vai sobrescrever a outra.",
        0, "Recarregar", () => location.reload());
});

function cur(){
  let c = db.chars.find(x => x.id === db.activeId);
  if(!c){ c = db.chars[0]; if(c) db.activeId = c.id; }
  return c;
}

/* --- caminho aninhado: "attrs.corpo" --- */
function setPath(obj, path, val){
  const parts = path.split(".");
  let o = obj;
  for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function getPath(obj, path){
  return path.split(".").reduce((o,k) => (o == null ? o : o[k]), obj);
}

/* ============================================================
   HELPERS DE MARCAÇÃO
   ============================================================ */

const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function fieldInput(label, path, value, type){
  return `<div class="field"><label>${label}</label>
    <input class="inp" type="${type||"text"}" data-path="${path}" value="${esc(value)}"></div>`;
}
function fieldSelect(label, path, value, opts, allowBlank){
  const o = (allowBlank ? `<option value=""${!value?" selected":""}>—</option>` : "")
    + opts.map(x => `<option${x===value?" selected":""}>${esc(x)}</option>`).join("");
  return `<div class="field"><label>${label}</label>
    <select class="sel" data-path="${path}">${o}</select></div>`;
}
function fieldArea(label, path, value, rows){
  return `<div class="field"><label>${label}</label>
    <textarea class="txt" rows="${rows||3}" data-path="${path}">${esc(value)}</textarea></div>`;
}

/* A altura do campo passa a ser a do texto que ele guarda. Roda depois de
   cada desenho e a cada tecla, porque uma frase a mais precisa aparecer na
   hora, e não quando a ficha for redesenhada. */
function ajustaCaixas(escopo){
  (escopo || document).querySelectorAll(".txt.cresce").forEach(t => {
    t.style.height = "auto";
    /* box-sizing e border-box: scrollHeight mede conteudo mais padding e
       ignora a borda, entao ela entra na conta a parte ou sobra uma linha
       recortada no rodape do campo. */
    t.style.height = (t.scrollHeight + (t.offsetHeight - t.clientHeight)) + "px";
  });
}

function renderList(key){
  const c = cur(), cfg = LIST_CFG[key], box = document.getElementById(cfg.el);
  if(!box) return;
  const arr = c[key];
  box.innerHTML = arr.length
    ? arr.map((it,i) => `<div class="row">${cfg.row(it,i)}</div>`).join("")
    : `<p class="empty">${cfg.vazio}</p>`;
  ajustaCaixas(box);
  if(key === "inventario") updateVolume();
}

const LINHAGEM_HAB = {
  "Angelical":[
    ["Nada Embaixo","No Limiar, o Narrador determina a consequência livremente, porque não existe nada mais velho no corpo dessa pessoa para decidir por ela. É a linhagem com mais espaço e menos proteção."]
  ],
  "Dracônico":[
    ["O Sangue Se Impõe","No Limiar, a consequência definitiva é sempre transformação física visível e permanente. Nunca possessão, nunca colapso da alma. O sangue mais antigo não se perde."]
  ],
  "Lunar":[
    ["A Deusa Visita","No Limiar, a consequência definitiva é sempre mudança de comportamento e consciência, uma presença falando através de você por um tempo. Nunca transformação física, nunca colapso. Ela não destrói o que ama."]
  ],
  "Bestial":[
    ["A Fera Assume","No Limiar, a consequência definitiva é sempre o instinto tomando as rédeas por uma cena inteira. Você continua controlando seu personagem, mas ele age por instinto: ataca o que ameaça, foge do que teme, ignora nuance."]
  ]
};

function renderConcedidas(){
  const c = cur(), box = document.getElementById("listConcedidas");
  if(!box || !c) return;
  c.concessoes = c.concessoes || {};
  const partes = [];

  for(const tipo of ["cultura","antecedente"]){
    const escolhido = tipo === "cultura" ? c.cultura : c.antecedente;
    if(!escolhido){ continue; }
    const f = fonteDe(tipo, c);
    if(!f) continue;
    const ops = periciasConcedidas(f.pericia);
    const atual = (c.concessoes[tipo] || {}).pericia || "";
    partes.push(`
      <div class="conc">
        <div class="conc-de">${tipo === "cultura" ? "Cultura" : "Antecedente"} · ${esc(f.nome)}</div>
        <div class="conc-nome">${esc(f.traco)}</div>
        <div class="conc-txt">${esc(f.tracoTexto)}</div>
        <div class="conc-per">
          <span class="conc-de">Perícia concedida</span>
          ${ops.length
            ? `<select class="sel" data-concessao="${tipo}">
                 <option value="">— escolher —</option>
                 ${ops.map(p => `<option${p===atual?" selected":""}>${esc(p)}</option>`).join("")}
               </select>`
            : `<span class="conc-txt">${esc(f.pericia)}</span>`}
        </div>
      </div>`);
  }

  const lin = LINHAGEM_HAB[linChave(c)];
  if(lin) partes.push(`
    <div class="conc">
      <div class="conc-de">Linhagem · ${esc(c.linhagem)} <span class="tag">Vitalidade ${vitMaxDe(c)}</span> <span class="tag">Limiar ${limiarDe(c)}</span></div>
      ${lin.map(([n,t]) => `<div class="conc-nome" style="margin-top:5px">${esc(n)}</div><div class="conc-txt">${esc(t)}</div>`).join("")}
    </div>`);

  const arq = ARQUETIPOS.find(a => a.nome === c.arquetipo);
  if(arq) partes.push(`
    <div class="conc">
      <div class="conc-de">Arquétipo · ${esc(arq.nome)} <span class="tag">não ocupa Capacidade</span></div>
      <div class="conc-nome" style="margin-top:5px">Forma de operar</div>
      <div class="conc-txt">${esc(arq.forma)}</div>
      <div class="conc-nome" style="margin-top:5px">O que ele não faz</div>
      <div class="conc-txt">${esc(arq.naoFaz)}</div>
    </div>`);

  box.innerHTML = partes.length ? partes.join("")
    : `<p class="empty">Escolha Cultura e Antecedente no cabeçalho.</p>`;
}

function updateDerived(){
  const c = cur();
  const vitMax = vitMaxDe(c);

  const set = (id,v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set("vitMax",vitMax); set("vitMax2",vitMax);

  const vl = VIT_LEVELS.find(l => l.n === c.vitLvl) || VIT_LEVELS[0];
  set("vitNome",vl.nome); set("vitPen",vl.pen);

  // dados por atributo
  document.querySelectorAll("[data-attr]").forEach(inp => {
    const k = inp.dataset.path.split(".")[1];
    const d = inp.parentElement.querySelector(".attr-d");
    if(d) d.textContent = c.attrs[k] + "D6";
  });
  // pools de perícia
  document.querySelectorAll("[data-pool]").forEach(sp => {
    const s = sp.dataset.pool, a = sp.dataset.attrOf;
    sp.textContent = (c.attrs[a] + (c.skills[s]||0)) + "D6";
  });

  // corrupção — a barra tem exatamente o tamanho do Limiar, então quando a
  // Linhagem muda ela precisa ser redesenhada, não só repintada
  const limiar = limiarDe(c), corr = corrTotal(c);
  const cs = corrState(corr, limiar);
  set("corrT",cs.t); set("corrV",corr); set("corrD",cs.d);

  /* a barra é pequena e depende de três grandezas (Assentada, Ativada e
     Limiar): redesenhá-la inteira custa menos que sincronizar classe a
     classe, e nunca sai do passo. */
  const bar = document.getElementById("corrBar");
  if(bar) bar.innerHTML = celulasCorrupcao(c);
  document.documentElement.style.setProperty("--corr", Math.min(1, corr/limiar).toFixed(2));

  updateCapacidade();
  updateXP();
  updateVolume();
  renderFileList();
}

/* O saldo é a única coisa que o jogador realmente olha; ficar negativo não
   é bloqueado, é sublinhado — a ficha avisa, a mesa decide. */
function updateXP(){
  const c = cur();
  const gasto = xpGasto(c), livre = xpLivre(c);
  const g = document.getElementById("xpGasto"), l = document.getElementById("xpLivre");
  const l2 = document.getElementById("xpLivre2"), r = document.getElementById("xpRow");
  if(g) g.value = gasto;
  if(l) l.value = livre;
  if(l2) l2.textContent = livre;
  if(r) r.classList.toggle("over", livre < 0);
}

/* O ambiente reage à Capacidade do mesmo jeito que reage à Corrupção:
   passar do teto não é proibido pela ficha, é apenas visível. */
function updateCapacidade(){
  const c = cur();
  const usado = pesoUsado(c), cap = capacidadeDe(c);
  const u = document.getElementById("capUsed"), m = document.getElementById("capMax");
  const r = document.getElementById("capRow"), ch = document.getElementById("capCheio");
  if(u) u.textContent = usado;
  if(m) m.textContent = cap;
  if(r) r.classList.toggle("over", usado > cap);
  if(ch) ch.style.width = Math.min(100, (usado/cap)*100).toFixed(1) + "%";
}

function updateVolume(){
  const c = cur();
  const used = c.inventario.reduce((s,i) => s + (Number(i.volume)||0), 0);
  const cap = c.attrs.corpo + 5;
  const u = document.getElementById("volUsed"), p = document.getElementById("volCap"), r = document.getElementById("volRow");
  if(u) u.textContent = used;
  if(p) p.textContent = cap;
  if(r) r.classList.toggle("over", used > cap);
}

/* ============================================================
   COMPÊNDIO — catálogo do livro com preço, e um clique para
   trazer a entrada para a ficha já preenchida.
   ============================================================ */

let compAba = "talentos";

const COMP_ABAS = [
  ["talentos","Talentos"],
  ["cifras","Cifras"],
  ["arquetipos","Arquétipos"]
];

function abreCompendio(aba){
  compAba = aba || "talentos";
  document.getElementById("compendio").hidden = false;
  document.getElementById("compBusca").value = "";
  renderCompendio();
  document.getElementById("compBusca").focus();
}
function fechaCompendio(){ document.getElementById("compendio").hidden = true; }

function renderCompendio(){
  const c = cur(); if(!c) return;
  const busca = (document.getElementById("compBusca").value || "").toLowerCase().trim();
  const casa = (...campos) => !busca || campos.filter(Boolean).join(" ").toLowerCase().includes(busca);

  document.getElementById("compAbas").innerHTML = COMP_ABAS
    .map(([k,r]) => `<button class="comp-aba${k===compAba?" on":""}" data-comp-aba="${k}">${r}</button>`).join("");

  const lista = document.getElementById("compLista");
  const partes = [];

  /* A prateleira do Arquétipo ativo vem primeiro e aberta; as outras onze
     ficam abaixo, visíveis e fechadas. Ver o que existe atrás de uma porta
     que você não abriu faz parte de escolher qual porta abrir. */
  if(compAba === "talentos"){
    const ordem = ARQUETIPOS.slice().sort((a,b) =>
      (b.nome === c.arquetipo) - (a.nome === c.arquetipo));

    for(const a of ordem){
      const aberto = a.nome === c.arquetipo;
      const itens = a.talentos.filter(t => casa(t.nome, t.texto, a.nome));
      if(!itens.length) continue;
      partes.push(`<div class="comp-grupo">${esc(a.nome)} · ${itens.length}${aberto ? "" : " · fechado"}</div>`);
      for(const t of itens){
        const ja = c.talentos.some(x => x.nome === t.nome && x.chave === a.nome);
        partes.push(`
          <div class="comp-item${ja?" ja":""}${aberto?"":" trancado"}">
            <div class="comp-cab">
              <span class="comp-nome">${esc(t.nome)}</span>
              <span class="tag">${t.xp} XP · Peso ${t.xp}</span>
              ${t.ativada ? `<span class="tag">Ativada ${t.ativada}</span>` : ""}
              <button class="btn btn-xs" data-comp-add="talento"
                data-nome="${esc(t.nome)}" data-chave="${esc(a.nome)}"
                ${ja||!aberto?" disabled":""}>${ja?"na ficha":aberto?"+ adicionar":"outro Arquétipo"}</button>
            </div>
            <div class="comp-txt">${esc(t.texto)}</div>
          </div>`);
      }
    }
  }

  if(compAba === "cifras"){
    for(const selo of ["Universal","Origem","Extinção","Controle","Pesadelo","Tormento","Causalidade"]){
      const itens = DADOS.cifras.filter(x => x.selo === selo && casa(x.nome, x.efeito, x.gestos, x.gatilho));
      if(!itens.length) continue;
      partes.push(`<div class="comp-grupo">${selo} · ${itens.length}</div>`);
      for(const f of itens){
        const v = VINCULOS[f.vinculo] || VINCULOS["Baixo"];
        const ja = c.cifras.some(x => x.nome === f.nome);
        partes.push(`
          <div class="comp-item${ja?" ja":""}">
            <div class="comp-cab">
              <span class="comp-nome">${esc(f.nome)}</span>
              <span class="tag">${esc(f.vinculo)}</span>
              <span class="tag">${v.xp} XP</span>
              <span class="tag">+${v.corr} Corr · ND ${v.nd} · retém ${v.falha}/${v.passa}</span>
              <button class="btn btn-xs" data-comp-add="cifra" data-nome="${esc(f.nome)}"${ja?" disabled":""}>${ja?"na ficha":"+ adicionar"}</button>
            </div>
            <div class="comp-txt">${esc(f.efeito)}</div>
            ${(f.gestos || f.gatilho) ? `<div class="conc-de">${f.gestos?"Gestos: "+esc(f.gestos):""}${f.gestos&&f.gatilho?" · ":""}${f.gatilho?"Gatilho: "+esc(f.gatilho):""}</div>` : ""}
          </div>`);
      }
    }
  }

  if(compAba === "arquetipos"){
    for(const grupo of ["Ofensivos","Sociais","Místicos","de Suporte"]){
      const itens = ARQUETIPOS.filter(a => a.grupo === grupo &&
        casa(a.nome, a.mote, a.forma, a.naoFaz, a.talentos.map(t => t.nome + " " + t.texto).join(" ")));
      if(!itens.length) continue;
      partes.push(`<div class="comp-grupo">Arquétipos ${grupo} · ${itens.length}</div>`);
      for(const a of itens){
        const ja = c.arquetipo === a.nome;
        partes.push(`
          <div class="comp-item${ja?" ja":""}">
            <div class="comp-cab">
              <span class="comp-nome">${esc(a.nome)}</span>
              <span class="tag">${a.talentos.length} Talentos</span>
              <button class="btn btn-xs" data-comp-add="arquetipo" data-nome="${esc(a.nome)}"${ja?" disabled":""}>${ja?"ativo":"tornar ativo"}</button>
            </div>
            <div class="comp-txt">${esc(a.mote)}</div>
            <div class="comp-txt"><b>Forma de operar.</b> ${esc(a.forma)}</div>
            <div class="comp-txt"><b>O que ele não faz.</b> ${esc(a.naoFaz)}</div>
            <div class="conc-de" style="margin-top:5px">${a.talentos.map(t =>
              esc(t.nome) + " " + t.xp + (t.ativada ? "/" + t.ativada : "")).join(" · ")}</div>
          </div>`);
      }
    }
  }

  lista.innerHTML = partes.length ? partes.join("") : `<p class="comp-vazio">Nada encontrado para “${esc(busca)}”.</p>`;
}

/* traz a entrada do livro para a ficha, já preenchida */
function adicionaDoLivro(tipo, nome, chave){
  const c = cur(); if(!c) return;
  if(tipo === "talento"){
    const t = achaTalento(nome, chave); if(!t) return;
    /* Entra aceso se ainda couber na Capacidade. Passar do teto não é a ficha
       que decide, mas ela também não empurra ninguém para lá sem avisar. */
    const cabe = pesoUsado(c) + t.xp <= capacidadeDe(c);
    c.talentos.push({ nome:t.nome, chave:t.chave, xp:t.xp, ativada:t.ativada, texto:t.texto, ativo:cabe });
    renderList("talentos");
    updateDerived();
    if(!cabe) toast(`"${nome}" entrou dormente: não cabe na Capacidade.`, 4500);
  }
  if(tipo === "cifra"){
    const f = DADOS.cifras.find(x => x.nome === nome); if(!f) return;
    c.cifras.push({
      nome:f.nome, selo: f.selo === "Universal" ? "" : f.selo, vinculo:f.vinculo,
      gatilho:f.gatilho, gestos:f.gestos, efeito:f.efeito,
      xp:(VINCULOS[f.vinculo] || VINCULOS["Baixo"]).xp, corrente:false
    });
    renderList("cifras");
    updateDerived();
  }
  /* Trocar de Arquétipo não apaga Talento nenhum: o que veio da prateleira
     antiga apenas se apaga, e volta aceso se o jogador voltar. */
  if(tipo === "arquetipo"){
    const a = ARQUETIPOS.find(x => x.nome === nome); if(!a) return;
    c.arquetipo = a.nome;
    c.talentos.forEach(t => { if(t.chave && t.chave !== a.nome) t.ativo = false; });
    save();
    renderSheet();
    renderCompendio();
    toast(`Agora você opera como ${nome}.`, 3500);
    return;
  }
  save();
  renderCompendio();
  toast(`"${nome}" foi para a ficha.`, 3500);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(b && b.dataset.abreCompendio){ abreCompendio(b.dataset.abreCompendio); return; }
  if(b && b.dataset.compAba){ compAba = b.dataset.compAba; renderCompendio(); return; }
  if(b && b.dataset.compAdd){ adicionaDoLivro(b.dataset.compAdd, b.dataset.nome, b.dataset.chave); return; }
  if(b && b.id === "compFechar"){ fechaCompendio(); return; }
  if(e.target.id === "compendio") fechaCompendio();      // clique no fundo
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !document.getElementById("compendio").hidden) fechaCompendio();
});
document.addEventListener("input", e => {
  if(e.target.id === "compBusca") renderCompendio();
});

// entrada de texto / selects / checkbox
document.addEventListener("input", e => {
  const t = e.target;
  if(!t.dataset || !t.dataset.path) return;
  const c = cur();
  if(!c) return;
  let v = t.type === "checkbox" ? t.checked : t.value;
  if(t.type === "number"){
    const n = Number(v);
    // enquanto digita não engessa o campo, mas NaN nunca entra na ficha
    v = Number.isFinite(n) ? n : (t.hasAttribute("data-attr") ? 1 : 0);
  }
  setPath(c, t.dataset.path, v);

  if(t.dataset.path === "patrimonio"){ /* tratado no change */ }
  if(t.hasAttribute("data-attr") || t.hasAttribute("data-vol")
     || t.hasAttribute("data-peso") || t.hasAttribute("data-xp")) updateDerived();
  if(t.dataset.path === "corrAssentada" || t.dataset.path === "xp") updateDerived();
  if(t.classList && t.classList.contains("cresce")) ajustaCaixas(t.parentElement);
  if(t.dataset.path === "nome" || t.dataset.path === "selo") renderFileList();
  save();
});

document.addEventListener("change", e => {
  const t = e.target;
  if(!t.dataset || !t.dataset.path) return;
  const c = cur();
  if(!c) return;

  // ao sair do campo, prende o número na faixa válida e devolve o valor corrigido
  if(t.type === "number"){
    const lim = t.hasAttribute("data-attr") ? [1,5]
              : t.dataset.path === "vitPts"  ? [0, vitMaxDe(c)]
              : t.dataset.path === "nc"      ? [0,4]
              : t.dataset.path === "marcas"  ? [0,2]
              : [0,1e9];
    const fixed = clampNum(getPath(c, t.dataset.path), lim[0], lim[1], lim[0]);
    setPath(c, t.dataset.path, fixed);
    t.value = fixed;
    if(t.hasAttribute("data-attr") || t.hasAttribute("data-vol")
       || t.hasAttribute("data-peso") || t.hasAttribute("data-xp")) updateDerived();
  }

  // patrimônio preenche o Estre inicial
  if(t.dataset.path === "patrimonio"){
    c.estre = PATRIMONIOS[t.value] ?? c.estre;
    const inp = document.querySelector('[data-path="estre"]');
    if(inp) inp.value = c.estre;
  }
  /* Vínculo da Cifra: além da legenda, o custo em XP acompanha, porque o
     Vínculo é justamente o que define quanto ela custa. Quem quiser um
     valor fora da tabela ajusta o campo depois. */
  if(t.hasAttribute("data-vinc")){
    const i = Number(t.dataset.path.split(".")[1]);
    if(c.cifras[i]) c.cifras[i].xp = (VINCULOS[c.cifras[i].vinculo] || VINCULOS["Baixo"]).xp;
    renderList("cifras"); updateDerived();
  }
  if(t.dataset.path === "cultura" || t.dataset.path === "antecedente"){
    reiniciaConcessao(t.dataset.path);
    save(); renderSheet(); return;
  }
  // Linhagem move Vitalidade e Limiar, e o Limiar é o tamanho da barra de
  // Corrupção — não dá para repintar, tem que redesenhar
  if(t.dataset.path === "linhagem"){ save(); renderSheet(); return; }
  if(t.dataset.path === "arquetipo"){
    c.talentos.forEach(x => { if(x.chave && x.chave !== c.arquetipo) x.ativo = false; });
    save(); renderSheet(); return;
  }
  if(t.dataset.path === "afiliacao" || t.dataset.path === "ascensao") renderSheet();
  if(t.dataset.path && t.dataset.path.startsWith("cifras.") && t.dataset.path.endsWith(".corrente")) renderList("cifras");
  save();
});

// cliques
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if(!t) return;
  const c = cur();

  // trocar de ficha
  if(t.dataset.char){ db.activeId = t.dataset.char; save(); renderSheet(); return; }

  // graus de perícia
  if(t.dataset.skill){
    const s = t.dataset.skill, g = Number(t.dataset.grade);
    c.skills[s] = (c.skills[s] === g) ? g-1 : g;
    const row = document.querySelector(`[data-skill-row="${CSS.escape(s)}"]`);
    if(row){
      row.classList.toggle("has-grade", c.skills[s] > 0);
      row.querySelectorAll(".pip").forEach(p => p.classList.toggle("on", Number(p.dataset.grade) <= c.skills[s]));
    }
    updateDerived(); save(); return;
  }


  /* marcar Corrupção Assentada. Clicar de novo na casa mais alta baixa
     uma, que é como se apaga sem precisar de um segundo controle. */
  if(t.dataset.corr !== undefined){
    const v = Number(t.dataset.corr);
    c.corrAssentada = (c.corrAssentada === v) ? v - 1 : v;
    updateDerived(); save(); return;
  }
  // níveis de vitalidade
  if(t.dataset.vit !== undefined){
    c.vitLvl = Number(t.dataset.vit);
    document.querySelectorAll("[data-vit]").forEach(b => b.classList.toggle("on", Number(b.dataset.vit) === c.vitLvl));
    updateDerived(); save(); return;
  }

  /* acender e apagar Talento. A ficha deixa passar da Capacidade — ela
     registra o personagem, não arbitra a mesa — mas diz que passou. */
  if(t.dataset.acende !== undefined){
    const item = c.talentos[Number(t.dataset.acende)];
    if(item){
      item.ativo = !item.ativo;
      renderList("talentos"); updateDerived(); save();
      if(item.ativo && pesoUsado(c) > capacidadeDe(c)){
        toast(`Capacidade estourada: ${pesoUsado(c)} de ${capacidadeDe(c)}.`, 4500);
      }
    }
    return;
  }

  // adicionar / remover linha
  if(t.dataset.add){
    c[t.dataset.add].push(LIST_CFG[t.dataset.add].novo());
    renderList(t.dataset.add); updateDerived(); save(); return;
  }
  if(t.dataset.del){
    c[t.dataset.del].splice(Number(t.dataset.i),1);
    renderList(t.dataset.del); updateDerived(); save(); return;
  }
});

// retrato
document.addEventListener("click", e => {
  if(!e.target.closest("#portrait")) return;
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        // reduz para caber no armazenamento local
        const max = 320, sc = Math.min(1, max/Math.max(img.width,img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        cur().portrait = cv.toDataURL("image/jpeg",0.82);
        save(); renderSheet();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
});

/* ---------- gaveta: ações ---------- */
document.getElementById("btnNew").onclick = () => {
  const c = blankChar();
  db.chars.push(c); db.activeId = c.id;
  save(); renderSheet();
};
document.getElementById("btnDup").onclick = () => {
  const c = JSON.parse(JSON.stringify(cur()));
  c.id = uid();
  c.nome = (c.nome || "Sem nome") + " (cópia)";
  db.chars.push(c); db.activeId = c.id;
  save(); renderSheet();
};
/* arquivar é reversível: a ficha vai para a lixeira, que também é gravada */
document.getElementById("btnDel").onclick = () => {
  const c = cur();
  if(!c) return;
  if(!confirm(`Arquivar a ficha de "${c.nome || "Sem nome"}"?\n\nEla vai para a lixeira e pode ser restaurada depois.`)) return;
  db.trash.unshift(JSON.parse(JSON.stringify(c)));
  db.trash = db.trash.slice(0,20);
  db.chars = db.chars.filter(x => x.id !== c.id);
  if(!db.chars.length) db.chars.push(blankChar());
  db.activeId = db.chars[0].id;
  save(); renderSheet();
  toast(`"${c.nome || "Sem nome"}" foi arquivada.`, 15000, "Desfazer", restoreLast);
};

function restoreLast(){
  if(!db.trash.length){ toast("A lixeira está vazia.", 4000); return; }
  const c = normalize(db.trash.shift());
  if(db.chars.some(x => x.id === c.id)) c.id = uid();
  db.chars.push(c);
  db.activeId = c.id;
  save(); renderSheet();
  toast(`"${c.nome || "Sem nome"}" foi restaurada.`, 5000);
}
document.getElementById("btnUndo").onclick = restoreLast;

/* ---------- movimento ----------
   "auto" segue o sistema. "on" e "off" mandam nele. A escolha fica
   gravada por aparelho, porque é preferência de quem olha a tela. */
const LS_MOV = "caos-eminente:movimento";

function temMovimento(){
  const m = document.documentElement.dataset.motion;
  if(m === "on")  return true;
  if(m === "off") return false;
  return !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function aplicaMovimento(modo){
  const raiz = document.documentElement;
  if(modo === "auto") delete raiz.dataset.motion;
  else raiz.dataset.motion = modo;
  const b = document.getElementById("btnMotion");
  if(b) b.textContent = "Efeitos: " + ({auto:"automático", on:"ligados", off:"desligados"})[modo];
  try{ localStorage.setItem(LS_MOV, modo); }catch(_){}
}

document.getElementById("btnMotion").onclick = () => {
  const atual = document.documentElement.dataset.motion || "auto";
  const proximo = atual === "auto" ? "on" : atual === "on" ? "off" : "auto";
  aplicaMovimento(proximo);
  if(proximo === "on" && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    toast("Seu sistema pede movimento reduzido. A ficha vai ignorar isso e animar mesmo assim.", 7000);
  }
  renderSheet();   // redesenha para as animações de chegada rodarem na hora
};

document.getElementById("drawerToggle").onclick = e => {
  const aberta = document.querySelector(".drawer").classList.toggle("is-open");
  e.currentTarget.setAttribute("aria-expanded", aberta);
  e.currentTarget.textContent = aberta ? "Fichas ▴" : "Fichas ▾";
};

/* Quais painéis são "compridos" depende da ficha, não do desenho: a mesma
   folha imprime apertada na primeira sessão e enorme na trigésima. Então a
   decisão é tomada na hora de imprimir, medindo o que existe.
   Vale para o botão e para o Ctrl+P do navegador. */
/* Só painel que sozinho domina uma coluna. Abaixo disso ele cabe numa coluna
   de um terço e alargá-lo só desperdiça papel — e desde que os painéis podem
   quebrar, nenhum deles corre risco de ser cortado por ficar estreito. */
const PAINEL_LARGO_PX = 900;

function marcaPaineisLargos(){
  document.querySelectorAll(".panel").forEach(p => {
    p.classList.toggle("largo", p.getBoundingClientRect().height > PAINEL_LARGO_PX);
  });
}
function desmarcaPaineisLargos(){
  document.querySelectorAll(".panel.largo").forEach(p => p.classList.remove("largo"));
}

window.addEventListener("beforeprint", marcaPaineisLargos);
window.addEventListener("afterprint", desmarcaPaineisLargos);

document.getElementById("btnPrint").onclick = () => { flush(); marcaPaineisLargos(); window.print(); };

/* backup de tudo: fichas, lixeira e qual estava aberta */
document.getElementById("btnBackup").onclick = () => {
  flush();
  const d = new Date().toISOString().slice(0,10);
  downloadJSON(db, `caos-eminente-backup-${d}.json`);
  toast(`Backup de ${db.chars.length} ficha(s) baixado.`, 5000);
};

function downloadJSON(obj, filename){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById("btnJson").onclick = () => {
  const c = cur(); if(!c) return;
  downloadJSON(c, (c.nome || "ascendido").toLowerCase().replace(/[^a-z0-9]+/g,"-") + ".json");
};

document.getElementById("btnLoad").onclick = () => document.getElementById("fileInput").click();

/* importar sempre ACRESCENTA — nunca substitui o que já existe */
document.getElementById("fileInput").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => toast("Não consegui ler esse arquivo do disco.", 8000);
  fr.onload = () => {
    let o;
    try{ o = JSON.parse(fr.result); }
    catch(err){ toast("Arquivo inválido: não é um JSON legível. Nada foi alterado.", 8000); return; }

    const entrando = (o && Array.isArray(o.chars)) ? o.chars      // backup completo
                   : (o && typeof o === "object")  ? [o]          // ficha avulsa
                   : null;
    if(!entrando || !entrando.length){
      toast("Esse JSON não contém nenhuma ficha. Nada foi alterado.", 8000);
      return;
    }

    const novos = entrando.map(x => {
      const c = normalize(x);
      if(db.chars.some(y => y.id === c.id)) c.id = uid();  // nunca colide com o que já está aberto
      return c;
    });
    db.chars.push(...novos);
    db.activeId = novos[0].id;
    save(); renderSheet();
    toast(`${novos.length} ficha(s) importada(s). Nenhuma existente foi substituída.`, 7000);
  };
  fr.readAsText(f);
};

/* ---------- início ---------- */
load();
(function(){ let m="auto"; try{ m = localStorage.getItem(LS_MOV) || "auto"; }catch(_){} aplicaMovimento(m); })();
renderSheet();
renderFileList();
</script>
